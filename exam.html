<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CENQAL Exam</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#f3f6f9;
  --card:#fff;
  --ink:#17324d;
  --muted:#687d90;
  --line:#d9e3ea;
  --blue:#1d6fa5;
  --green:#198754;
  --red:#b83232;
  --amber:#9a6b13
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,system-ui,sans-serif
}
.app{
  max-width:720px;
  margin:auto;
  padding:16px 12px 30px
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px
}
.logo{
  width:44px;
  height:44px;
  border-radius:13px;
  background:var(--blue);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:24px
}
.brand h1{margin:0;font-size:20px}
.brand small{color:var(--muted)}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:0 6px 20px #17324d12
}
.hero{text-align:center}
.pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#e8f3f9;
  color:#15567f;
  font-size:12px;
  font-weight:700
}
h2{margin:10px 0}
.muted{color:var(--muted)}
.action{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  font-size:15px
}
.action.secondary{
  background:#edf3f7;
  color:var(--ink);
  border:1px solid var(--line)
}
.action:disabled{opacity:.55}
.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px
}
.timer{
  padding:7px 9px;
  border-radius:9px;
  background:#edf3f7;
  font-weight:800;
  font-variant-numeric:tabular-nums
}
.timer.warn{background:#fff1d2;color:var(--amber)}
.timer.bad{background:#fde7e7;color:var(--red)}
.progressText{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
  margin:15px 0 5px
}
.progress{
  height:8px;
  background:#e6edf2;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:18px
}
.progress i{
  display:block;
  height:100%;
  background:var(--blue)
}
.question{
  font-size:18px;
  line-height:1.45;
  font-weight:700;
  margin-bottom:17px
}
.answers{display:grid;gap:9px}
.answer{
  width:100%;
  display:flex;
  gap:10px;
  align-items:flex-start;
  text-align:left;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  background:#fff;
  color:var(--ink);
  font-size:15px
}
.answer b{
  min-width:28px;
  height:28px;
  border-radius:8px;
  display:grid;
  place-items:center;
  background:#e8f3f9;
  color:#15567f
}
.note{
  margin-top:13px;
  padding:12px;
  border-radius:11px;
  background:#edf4f8;
  color:#526c80;
  font-size:13px;
  line-height:1.45
}
.note.good{background:#e7f7ee;color:#17643f}
.note.warn{background:#fff3da;color:#775713}
.note.bad{background:#fde8e8;color:#902b2b}
.grade{
  margin:15px 0;
  font-size:48px;
  font-weight:900;
  color:var(--blue)
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:15px 0
}
.stat{
  padding:10px 5px;
  background:#f5f8fa;
  border:1px solid var(--line);
  border-radius:11px;
  text-align:center
}
.stat b{display:block;font-size:18px}
.stat small{color:var(--muted)}
.field{margin:12px 0}
.field label{
  display:block;
  font-weight:700;
  font-size:12px;
  margin-bottom:5px
}
.field input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:15px
}
.loader{text-align:center;padding:30px}
.review{
  padding:14px 0;
  border-top:1px solid var(--line)
}
.review:first-child{border-top:0}
.goodText{color:var(--green)}
.badText{color:var(--red)}
</style>
</head>

<body>

<div class="app">

  <div class="brand">
    <div class="logo">⚛️</div>
    <div>
      <h1>CENQAL Exam</h1>
      <small>Evaluación identificada</small>
    </div>
  </div>

  <main id="screen">
    <div class="card loader">Conectando con CENQAL…</div>
  </main>

</div>

<script>
/* CENQAL EXAM v74.1 */

const tg=window.Telegram?.WebApp;

try{
  tg?.ready();
  tg?.expand();
}catch(e){}

const P=new URLSearchParams(location.search);

const SBURL=(P.get('sburl')||'').replace(/\/+$/,'');
const SBKEY=P.get('sbkey')||'';
let TOKEN=P.get('token')||'';
const EXAMCODE=P.get('exam')||'';

try{
  history.replaceState(null,'',location.pathname);
}catch(e){}

let timer=null;
let remaining=0;
let busy=false;

const esc=v=>String(v??'').replace(
  /[&<>"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

const screen=()=>document.getElementById('screen');

function vibrate(type='light'){
  try{
    tg?.HapticFeedback?.impactOccurred(type);
  }catch(e){}
}

function notify(type){
  try{
    tg?.HapticFeedback?.notificationOccurred(type);
  }catch(e){}
}

function reason(r){
  const m={
    invalid_token:'El enlace no es válido o ha caducado.',
    invalid_choice:'Respuesta no válida.',
    exam_not_found:'No se encuentra el examen.',
    bad_pin:'PIN incorrecto.',
    student_not_found:'No se encuentra ese alumno.',
    closed:'El examen está cerrado.',
    question_not_found:'No se encuentra la pregunta.',
    review_not_released:'La revisión todavía no está disponible.'
  };
  return m[r]||r||'Error desconocido.';
}

async function rpc(name,body={}){
  if(!SBURL||!SBKEY){
    throw new Error('Falta la configuración de Supabase.');
  }

  let r;

  try{
    r=await fetch(
      `${SBURL}/rest/v1/rpc/${name}`,
      {
        method:'POST',
        headers:{
          apikey:SBKEY,
          Authorization:`Bearer ${SBKEY}`,
          'Content-Type':'application/json'
        },
        body:JSON.stringify(body)
      }
    );
  }catch(e){
    throw new Error('No hay conexión con CENQAL.');
  }

  const txt=await r.text();

  let d;

  try{
    d=txt?JSON.parse(txt):null;
  }catch(e){
    d=txt;
  }

  if(!r.ok){
    throw new Error(
      d?.message||
      d?.error||
      `HTTP ${r.status}`
    );
  }

  return d;
}

function loading(t='Consultando CENQAL…'){
  screen().innerHTML=
    `<div class="card loader">${esc(t)}</div>`;
}

function stopTimer(){
  if(timer){
    clearInterval(timer);
    timer=null;
  }
}

function clock(){
  const el=document.getElementById('timer');
  if(!el)return;

  const m=Math.floor(remaining/60);
  const s=remaining%60;

  el.textContent=
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  el.className=
    'timer'+
    (remaining<=60?' bad':remaining<=300?' warn':'');
}

function startTimer(sec){
  stopTimer();

  remaining=Math.max(0,Number(sec||0));
  clock();

  timer=setInterval(()=>{
    remaining=Math.max(0,remaining-1);
    clock();

    if(remaining===0){
      stopTimer();
      loadState();
    }
  },1000);
}

function errorView(msg,fallback=true){
  stopTimer();

  screen().innerHTML=`
    <section class="card hero">
      <div style="font-size:44px">⚠️</div>
      <h2>No se ha podido continuar</h2>
      <p class="muted">${esc(msg)}</p>

      <button class="action secondary" onclick="loadState()">
        ↻ Reintentar
      </button>

      ${
        fallback
        ? `<button class="action" onclick="fallbackView()">
             🔑 Acceso de emergencia
           </button>`
        : ''
      }
    </section>
  `;
}

function fallbackView(){
  stopTimer();

  screen().innerHTML=`
    <section class="card">

      <span class="pill">ACCESO DE EMERGENCIA</span>

      <h2>Entrar al examen</h2>

      <p class="muted">
        Utiliza esta vía solo si no puedes acceder desde Mr. Berilio.
      </p>

      <div class="field">
        <label>Código del examen</label>
        <input id="fExam" value="${esc(EXAMCODE)}">
      </div>

      <div class="field">
        <label>Código CENQAL del alumno</label>
        <input id="fStudent" placeholder="QAL26-XXXX">
      </div>

      <div class="field">
        <label>PIN de emergencia</label>
        <input id="fPin" type="password">
      </div>

      <div id="fMsg" class="note warn" style="display:none"></div>

      <button id="fBtn" class="action" onclick="fallbackLogin()">
        Entrar
      </button>

    </section>
  `;
}

async function fallbackLogin(){
  const exam=document.getElementById('fExam').value.trim();
  const student=document.getElementById('fStudent').value.trim();
  const pin=document.getElementById('fPin').value.trim();
  const msg=document.getElementById('fMsg');
  const btn=document.getElementById('fBtn');

  if(!exam||!student||!pin){
    msg.style.display='block';
    msg.textContent='Completa todos los campos.';
    return;
  }

  btn.disabled=true;

  try{
    const d=await rpc(
      'cenqal_exam_fallback_login',
      {
        p_exam_code:exam,
        p_student_code:student,
        p_pin:pin
      }
    );

    if(!d?.ok){
      throw new Error(reason(d?.reason));
    }

    TOKEN=d.token||'';

    if(!TOKEN){
      throw new Error('No se ha recibido el token.');
    }

    await loadState();

  }catch(e){
    msg.style.display='block';
    msg.textContent=e.message||String(e);
    btn.disabled=false;
  }
}

async function loadState(){
  if(!TOKEN){
    fallbackView();
    return;
  }

  loading();

  try{
    const d=await rpc(
      'cenqal_exam_state',
      {p_token:TOKEN}
    );

    if(!d?.ok){
      throw new Error(reason(d?.reason));
    }

    renderState(d);

  }catch(e){
    errorView(e.message||String(e));
  }
}

function renderState(d){
  stopTimer();

  if(d.state==='in_progress'){
    questionView(d);
    return;
  }

  if(d.state==='completed'){
    completedView(d);
    return;
  }

  if(d.state==='locked'){
    screen().innerHTML=`
      <section class="card hero">
        <div style="font-size:44px">🔒</div>
        <h2>Examen todavía cerrado</h2>
        <p class="muted">${esc(d.message||'La profesora todavía no lo ha abierto.')}</p>
        <button class="action" onclick="loadState()">↻ Comprobar</button>
      </section>`;
    return;
  }

  if(d.state==='expired'){
    screen().innerHTML=`
      <section class="card hero">
        <div style="font-size:44px">⌛</div>
        <h2>Acceso expirado</h2>
        <p class="muted">${esc(d.title||'')}</p>
      </section>`;
    return;
  }

  if(d.state==='closed'){
    screen().innerHTML=`
      <section class="card hero">
        <div style="font-size:44px">🔒</div>
        <h2>Convocatoria cerrada</h2>
        <p class="muted">${esc(d.title||'')}</p>
      </section>`;
    return;
  }

  errorView('Estado de examen no reconocido.');
}

function questionView(d){
  const pos=Number(d.position||1);
  const total=Number(d.question_count||20);
  const pct=Math.round(((pos-1)/total)*100);
  const q=d.question||{};
  const opts=Array.isArray(q.options)?q.options:[];

  screen().innerHTML=`
    <section class="card">

      <div class="head">
        <div>
          <span class="pill">${esc(d.exam_code||'CENQAL EXAM')}</span>
          <h2>${esc(d.title||'Examen')}</h2>
        </div>

        <div id="timer" class="timer">--:--</div>
      </div>

      <div class="progressText">
        <span>Pregunta ${pos}/${total}</span>
        <span>${pct}%</span>
      </div>

      <div class="progress">
        <i style="width:${pct}%"></i>
      </div>

      <div class="question">
        ${esc(q.text||'')}
      </div>

      <div class="answers">

        ${opts.map((o,i)=>`
          <button
            class="answer"
            onclick="answer(${Number(o.index??i)})">

            <b>${String.fromCharCode(65+i)}</b>

            <span>${esc(o.text||'')}</span>
          </button>
        `).join('')}

      </div>

      <div class="note warn">
        Cada respuesta se guarda inmediatamente en CENQAL.
        Una vez registrada no puede modificarse.
      </div>

    </section>
  `;

  startTimer(d.remaining_seconds);
}

async function answer(index){
  if(busy)return;

  busy=true;
  vibrate();

  document.querySelectorAll('.answer')
    .forEach(b=>b.disabled=true);

  try{
    const d=await rpc(
      'cenqal_exam_answer',
      {
        p_token:TOKEN,
        p_choice_index:Number(index)
      }
    );

    if(!d?.ok){
      throw new Error(reason(d?.reason));
    }

    renderState(d);

  }catch(e){
    notify('error');

    errorView(
      'La respuesta NO ha sido confirmada por CENQAL. '+
      'No se considera registrada. '+
      (e.message||String(e)),
      false
    );

  }finally{
    busy=false;
  }
}

function completedView(d){
  stopTimer();

  const score=
    d.score_out_of_10==null
    ? null
    : Number(d.score_out_of_10);

  const passed=
    score!=null && score>=5;

  notify(passed?'success':'warning');

  screen().innerHTML=`
    <section class="card hero">

      <div style="font-size:48px">
        ${passed?'✅':'📚'}
      </div>

      <span class="pill">
        ENTREGA REGISTRADA
      </span>

      <h2>Examen finalizado</h2>

      <div class="grade">
        ${score==null?'—':score.toFixed(2).replace('.',',')}
        <span style="font-size:18px">/10</span>
      </div>

      <div class="stats">

        <div class="stat">
          <b>${Number(d.correct_count||0)}/${Number(d.question_count||20)}</b>
          <small>Aciertos</small>
        </div>

        <div class="stat">
          <b>${esc(d.topic_number??'—')}</b>
          <small>Tema</small>
        </div>

        <div class="stat">
          <b>${d.review_available?'Sí':'No'}</b>
          <small>Revisión</small>
        </div>

      </div>

      <div class="note good">
        ✓ El intento y la nota están registrados en CENQAL.
      </div>

      ${
        d.reason==='time_expired'
        ? `<div class="note warn">⏱️ El examen se cerró automáticamente al agotarse el tiempo.</div>`
        : ''
      }

      ${
        d.review_available
        ? `<button class="action" onclick="review()">📖 Ver corrección</button>`
        : `<div class="note">La corrección detallada aparecerá cuando la profesora libere la revisión.</div>`
      }

      <button class="action secondary" onclick="loadState()">
        ↻ Comprobar estado
      </button>

    </section>
  `;
}

async function review(){
  loading('Cargando corrección…');

  try{
    const d=await rpc(
      'cenqal_exam_review',
      {p_token:TOKEN}
    );

    if(!d?.ok){
      throw new Error(reason(d?.reason));
    }

    reviewView(d);

  }catch(e){
    errorView(e.message||String(e),false);
  }
}

function reviewView(d){
  const arr=Array.isArray(d.answers)?d.answers:[];

  screen().innerHTML=`
    <section class="card">

      <span class="pill">REVISIÓN</span>

      <h2>Corrección del examen</h2>

      <div class="stats">

        <div class="stat">
          <b>${d.score_out_of_10??'—'}</b>
          <small>Nota /10</small>
        </div>

        <div class="stat">
          <b>${d.correct_count??0}</b>
          <small>Aciertos</small>
        </div>

        <div class="stat">
          <b>${d.question_count??0}</b>
          <small>Preguntas</small>
        </div>

      </div>

      ${arr.map(a=>`
        <div class="review">

          <h3 class="${a.is_correct?'goodText':'badText'}">
            ${a.is_correct?'✅':'❌'}
            Pregunta ${esc(a.position)}
          </h3>

          <b>${esc(a.question)}</b>

          <p>
            <b>Tu respuesta:</b>
            ${esc(a.selected_text||'—')}
          </p>

          ${
            !a.is_correct
            ? `<p class="goodText">
                 <b>Correcta:</b>
                 ${esc(a.correct_text||'—')}
               </p>`
            : ''
          }

          ${
            a.explanation
            ? `<div class="note">${esc(a.explanation)}</div>`
            : ''
          }

        </div>
      `).join('')}

      <button class="action secondary" onclick="loadState()">
        ← Volver
      </button>

    </section>
  `;
}

document.addEventListener(
  'visibilitychange',
  ()=>{
    if(
      document.visibilityState==='visible' &&
      TOKEN
    ){
      loadState();
    }
  }
);

async function boot(){
  if(!SBURL||!SBKEY){
    errorView(
      'Abre el examen desde Mr. Berilio.',
      false
    );
    return;
  }

  if(!TOKEN){
    fallbackView();
    return;
  }

  await loadState();
}

boot();
</script>

</body>
</html>
