<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>CENQAL Exam</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#f3f6f9;
  --card:#ffffff;
  --ink:#17324d;
  --muted:#6a7e91;
  --line:#d9e2ea;
  --primary:#1d6fa5;
  --primary2:#15567f;
  --green:#198754;
  --red:#c33b3b;
  --amber:#b7791f;
  --soft:#edf4f8;
  --shadow:0 8px 24px rgba(20,45,70,.08);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  min-height:100vh;
}

.app{
  width:min(760px,100%);
  margin:auto;
  padding:
    max(16px,env(safe-area-inset-top))
    14px
    max(28px,env(safe-area-inset-bottom));
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      #133f60,
      #277bb1
    );
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:24px;
  box-shadow:var(--shadow);
}

.brand h1{
  margin:0;
  font-size:21px;
}

.brand small{
  color:var(--muted);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.hero{
  text-align:center;
  padding:24px 18px;
}

.hero h2{
  margin:8px 0;
  font-size:26px;
}

.hero p{
  color:var(--muted);
  line-height:1.5;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 11px;
  background:#e9f3fa;
  color:#15567f;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
}

.statusPill{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.statusPill.good{
  background:#e7f7ef;
  color:#16754a;
}

.statusPill.warn{
  background:#fff4d9;
  color:#8d6512;
}

.statusPill.bad{
  background:#fdeaea;
  color:#a42d2d;
}

.action{
  appearance:none;
  border:0;
  border-radius:13px;
  padding:14px 16px;
  width:100%;
  margin-top:10px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  color:#fff;
  background:var(--primary);
  transition:.15s ease;
}

.action:active{
  transform:scale(.99);
}

.action:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.action.secondary{
  background:#edf3f7;
  color:var(--ink);
  border:1px solid var(--line);
}

.action.good{
  background:var(--green);
}

.action.bad{
  background:var(--red);
}

.questionHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.questionHead h2{
  margin:0;
  font-size:18px;
}

.timer{
  flex:0 0 auto;
  font-variant-numeric:tabular-nums;
  padding:7px 10px;
  border-radius:10px;
  background:#edf3f7;
  font-weight:900;
}

.timer.warning{
  background:#fff4d9;
  color:#956812;
}

.timer.danger{
  background:#fdeaea;
  color:#aa2e2e;
}

.progressrow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:13px;
  margin-bottom:6px;
}

.progress{
  height:9px;
  background:#e8eef3;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:20px;
}

.progress > div{
  height:100%;
  background:var(--primary);
  transition:width .25s ease;
}

.question{
  font-size:19px;
  line-height:1.48;
  font-weight:750;
  margin:8px 0 20px;
}

.difficulty{
  color:var(--muted);
  font-size:12px;
  margin-top:-10px;
  margin-bottom:15px;
}

.answers{
  display:grid;
  gap:10px;
}

.answer{
  appearance:none;
  display:flex;
  text-align:left;
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:14px;
  gap:12px;
  align-items:flex-start;
  color:var(--ink);
  font-size:15px;
  line-height:1.4;
  cursor:pointer;
}

.answer:hover{
  background:#f7fafc;
}

.answer:disabled{
  opacity:.6;
  cursor:wait;
}

.letter{
  width:30px;
  min-width:30px;
  height:30px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eaf3f9;
  color:#15567f;
  font-weight:900;
}

.note{
  border-radius:13px;
  padding:13px 14px;
  font-size:13px;
  line-height:1.5;
  background:#edf4f8;
  color:#4c667c;
}

.note.warn{
  background:#fff5dd;
  color:#775714;
}

.note.danger{
  background:#fdeaea;
  color:#992d2d;
}

.note.good{
  background:#e8f7ef;
  color:#17633f;
}

.loaderWrap{
  text-align:center;
  padding:36px 18px;
}

.loader{
  width:34px;
  height:34px;
  margin:0 auto 14px;
  border-radius:50%;
  border:4px solid #dbe5ec;
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.grade{
  font-size:52px;
  line-height:1;
  font-weight:950;
  color:var(--primary);
  margin:15px 0 8px;
}

.bigIcon{
  font-size:50px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:18px 0;
}

.stat{
  background:#f5f8fa;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 8px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:18px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.field{
  margin:12px 0;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:5px;
}

.field input{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px 13px;
  font-size:15px;
  color:var(--ink);
  background:#fff;
}

.reviewItem{
  border-top:1px solid var(--line);
  padding:16px 0;
}

.reviewItem:first-child{
  border-top:0;
}

.reviewItem h3{
  font-size:15px;
  margin:0 0 9px;
}

.reviewItem .good{
  color:var(--green);
}

.reviewItem .bad{
  color:var(--red);
}

.muted{
  color:var(--muted);
}

.connection{
  position:fixed;
  right:10px;
  bottom:
    max(10px,env(safe-area-inset-bottom));
  font-size:11px;
  padding:6px 9px;
  border-radius:999px;
  background:#e8f7ef;
  color:#17633f;
  box-shadow:0 3px 12px rgba(0,0,0,.09);
  z-index:20;
}

.connection.bad{
  background:#fdeaea;
  color:#a42d2d;
}

@media(max-width:480px){
  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .card{
    padding:15px;
    border-radius:15px;
  }

  .hero h2{
    font-size:23px;
  }

  .question{
    font-size:17px;
  }

  .grade{
    font-size:45px;
  }

  .stats{
    gap:6px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="brand">
    <div class="logo">⚛️</div>

    <div>
      <h1>CENQAL Exam</h1>
      <small>Evaluación identificada y registrada</small>
    </div>
  </div>

  <main id="screen">

    <div class="card loaderWrap">
      <div class="loader"></div>
      Conectando con CENQAL…
    </div>

  </main>

</div>

<div
  id="connection"
  class="connection">
  ● CENQAL
</div>


<script>
/* =========================================================
   CENQAL EXAM · CLIENTE SEGURO SUPABASE
   v74.0
========================================================= */

const tg = window.Telegram?.WebApp;

if(tg){
  try{
    tg.ready();
    tg.expand();
    tg.setHeaderColor('secondary_bg_color');
  }catch(e){}
}


/* =========================================================
   PARÁMETROS
========================================================= */

const PARAMS = new URLSearchParams(
  window.location.search
);

const SBURL =
  (PARAMS.get('sburl') || '')
    .trim()
    .replace(/\/+$/,'');

const SBKEY =
  (PARAMS.get('sbkey') || '')
    .trim();

let TOKEN =
  (PARAMS.get('token') || '')
    .trim();

const EXAM_CODE_PARAM =
  (PARAMS.get('exam') || '')
    .trim();


/*
  Una vez leídos los parámetros eliminamos la URL visible,
  pero TOKEN, SBURL y SBKEY permanecen en memoria.
*/
try{
  history.replaceState(
    null,
    '',
    location.pathname
  );
}catch(e){}


/* =========================================================
   ESTADO LOCAL DE INTERFAZ
========================================================= */

let CURRENT_STATE = null;

let TIMER_HANDLE = null;

let REMAINING_SECONDS = 0;

let ANSWER_BUSY = false;

let STATE_BUSY = false;

let VISIBILITY_REFRESH_BUSY = false;


/* =========================================================
   UTILIDADES
========================================================= */

function esc(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
}


function setConnection(ok,text){

  const el =
    document.getElementById('connection');

  if(!el)return;

  el.className =
    'connection' +
    (ok ? '' : ' bad');

  el.textContent =
    ok
      ? `● ${text || 'CENQAL conectado'}`
      : `● ${text || 'Sin conexión'}`;
}


function notify(type){

  try{
    tg?.HapticFeedback
      ?.notificationOccurred(type);
  }catch(e){}
}


function haptic(){

  try{
    tg?.HapticFeedback
      ?.impactOccurred('light');
  }catch(e){}
}


function mmss(seconds){

  const n =
    Math.max(
      0,
      Number(seconds || 0)
    );

  const m =
    Math.floor(n / 60);

  const s =
    Math.floor(n % 60);

  return (
    String(m).padStart(2,'0') +
    ':' +
    String(s).padStart(2,'0')
  );
}


function reasonText(reason){

  const map = {

    invalid_token:
      'El enlace de acceso no es válido o ha caducado.',

    invalid_choice:
      'La respuesta seleccionada no es válida.',

    exam_not_found:
      'No se encuentra esta convocatoria.',

    bad_pin:
      'El PIN de emergencia no es correcto.',

    student_not_found:
      'No se encuentra un alumno activo con ese código.',

    closed:
      'El examen ya no está abierto.',

    question_not_found:
      'No se ha podido recuperar la siguiente pregunta.',

    review_not_released:
      'La profesora todavía no ha liberado la revisión.'

  };

  return (
    map[reason] ||
    reason ||
    'Se ha producido un error.'
  );
}


/* =========================================================
   RPC
========================================================= */

async function rpc(name,body={}){

  if(!SBURL || !SBKEY){

    throw new Error(
      'Falta la configuración pública de Supabase.'
    );
  }

  let response;

  try{

    response =
      await fetch(
        `${SBURL}/rest/v1/rpc/${name}`,
        {
          method:'POST',

          headers:{
            'apikey':SBKEY,
            'Authorization':
              `Bearer ${SBKEY}`,
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(body)
        }
      );

  }catch(e){

    setConnection(
      false,
      'Sin conexión'
    );

    throw new Error(
      'No se puede conectar con CENQAL. Comprueba la conexión a Internet.'
    );
  }


  const text =
    await response.text();

  let data = null;

  try{

    data =
      text
        ? JSON.parse(text)
        : null;

  }catch(e){

    data = text;
  }


  if(!response.ok){

    setConnection(
      false,
      `Error ${response.status}`
    );

    throw new Error(
      data?.message ||
      data?.error ||
      String(data || '') ||
      `HTTP ${response.status}`
    );
  }


  setConnection(
    true,
    'CENQAL conectado'
  );

  return data;
}


/* =========================================================
   TEMPORIZADOR
========================================================= */

function stopTimer(){

  if(TIMER_HANDLE){

    clearInterval(
      TIMER_HANDLE
    );

    TIMER_HANDLE = null;
  }
}


function updateTimerVisual(){

  const el =
    document.getElementById('timer');

  if(!el)return;

  el.textContent =
    mmss(REMAINING_SECONDS);

  el.className =
    'timer' +
    (
      REMAINING_SECONDS <= 60
        ? ' danger'
        : REMAINING_SECONDS <= 300
          ? ' warning'
          : ''
    );
}


function startTimer(seconds){

  stopTimer();

  REMAINING_SECONDS =
    Math.max(
      0,
      Number(seconds || 0)
    );

  updateTimerVisual();

  TIMER_HANDLE =
    setInterval(
      async()=>{

        REMAINING_SECONDS--;

        updateTimerVisual();

        if(
          REMAINING_SECONDS <= 0
        ){

          stopTimer();

          await loadState(true);
        }

      },
      1000
    );
}


/* =========================================================
   RENDER BASE
========================================================= */

function loading(text='Consultando CENQAL…'){

  document.getElementById('screen')
    .innerHTML = `

      <div class="card loaderWrap">

        <div class="loader"></div>

        ${esc(text)}

      </div>
    `;
}


function renderError(
  message,
  allowFallback=true
){

  stopTimer();

  document.getElementById('screen')
    .innerHTML = `

      <section class="card hero">

        <div class="bigIcon">
          ⚠️
        </div>

        <h2>
          No se ha podido continuar
        </h2>

        <p>
          ${esc(message)}
        </p>

        <button
          class="action secondary"
          onclick="loadState(true)">
          ↻ Reintentar
        </button>

        ${
          allowFallback
            ? `
              <button
                class="action"
                onclick="renderFallback()">
                🔑 Acceso de emergencia
              </button>
            `
            : ''
        }

      </section>
    `;
}


/* =========================================================
   LOGIN DE EMERGENCIA
========================================================= */

function renderFallback(){

  stopTimer();

  document.getElementById('screen')
    .innerHTML = `

      <section class="card">

        <span class="pill">
          ACCESO DE EMERGENCIA
        </span>

        <h2>
          Entrar con código CENQAL
        </h2>

        <p class="muted">
          Utiliza esta opción solo si no puedes
          abrir el examen desde Mr. Berilio.
        </p>


        <div class="field">

          <label>
            Código del examen
          </label>

          <input
            id="fallbackExam"
            autocomplete="off"
            value="${esc(EXAM_CODE_PARAM)}"
            placeholder="Código de convocatoria">

        </div>


        <div class="field">

          <label>
            Tu código CENQAL
          </label>

          <input
            id="fallbackStudent"
            autocomplete="off"
            placeholder="Ej.: QAL26-XXXX">

        </div>


        <div class="field">

          <label>
            PIN de emergencia
          </label>

          <input
            id="fallbackPin"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            placeholder="PIN">

        </div>


        <div
          id="fallbackMessage"
          class="note warn"
          style="display:none">
        </div>


        <button
          id="fallbackButton"
          class="action"
          onclick="fallbackLogin()">
          Entrar al examen
        </button>

      </section>
    `;
}


async function fallbackLogin(){

  const examCode =
    document
      .getElementById('fallbackExam')
      ?.value
      ?.trim();

  const studentCode =
    document
      .getElementById('fallbackStudent')
      ?.value
      ?.trim();

  const pin =
    document
      .getElementById('fallbackPin')
      ?.value
      ?.trim();

  const msg =
    document.getElementById(
      'fallbackMessage'
    );

  const btn =
    document.getElementById(
      'fallbackButton'
    );


  if(
    !examCode ||
    !studentCode ||
    !pin
  ){

    msg.style.display='
