<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CENQAL · Agenda</title>
<style>
  :root{--bg:#f5f6f8;--card:#ffffff;--text:#171a1f;--muted:#68707c;--line:#e7e9ee;--accent:#5035a5;--accent2:#e9e3ff;--ok:#197a50;--warn:#b26a00;--danger:#b33a3a}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:760px;margin:auto;padding:18px 14px 34px}.top{background:linear-gradient(135deg,#34236f,#6a48c9);color:white;border-radius:24px;padding:22px;box-shadow:0 8px 24px rgba(36,25,75,.18)}
  .brand{font-size:12px;letter-spacing:.14em;font-weight:800;opacity:.84}.date{font-size:29px;font-weight:850;margin-top:7px;line-height:1.12}.sub{opacity:.88;margin-top:6px;font-size:14px}
  .tabs{display:flex;gap:8px;margin:16px 0;overflow:auto}.tab{border:0;border-radius:999px;padding:10px 14px;background:#fff;color:#444;font-weight:750;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.06)}.tab.active{background:var(--accent);color:white}
  .section{margin:18px 2px 8px;font-size:13px;font-weight:850;letter-spacing:.06em;color:#4e5560}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 7px rgba(20,24,30,.04)}
  .row{display:flex;gap:11px;align-items:flex-start}.ico{font-size:24px;line-height:1}.grow{flex:1}.title{font-size:16px;font-weight:820;line-height:1.22}.meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.35}.desc{font-size:14px;margin-top:8px;line-height:1.45}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;margin-top:8px;background:var(--accent2);color:#3c2884}
  .empty{background:white;border:1px dashed #cfd4dc;border-radius:16px;padding:18px;color:var(--muted);text-align:center}.notice{border-left:5px solid var(--accent)}.danger{border-left:5px solid var(--danger)}.today{border-left:5px solid var(--ok)}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}.error{color:var(--danger);background:#fff1f1;padding:12px;border-radius:12px;margin-top:14px}.loading{padding:28px;text-align:center;color:var(--muted)}
  button.refresh{width:100%;margin-top:14px;border:0;border-radius:14px;padding:12px;background:white;font-weight:800;color:#4d397f;box-shadow:0 1px 4px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">CENQAL · QUÍMICA DE LOS ALIMENTOS</div>
    <div class="date" id="todayTitle">Agenda</div>
    <div class="sub" id="todaySub">Cargando planificación…</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="today">Hoy</button>
    <button class="tab" data-view="pending">Pendientes</button>
    <button class="tab" data-view="upcoming">Próximamente</button>
    <button class="tab" data-view="notices">Avisos</button>
  </div>

  <div id="content" class="loading">Cargando CENQAL Calendar…</div>
  <button class="refresh" onclick="loadAll()">↻ Actualizar agenda</button>
  <div class="foot">Los avisos personales y las calificaciones siguen llegando de forma privada por Mr. Berilio.</div>
</div>
<script>
const p=new URLSearchParams(location.search);
const SBURL=(p.get('sburl')||'').replace(/\/$/,'');
const SBKEY=p.get('sbkey')||'';
let events=[], challenges=[], currentView='today';
const fmtDate=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'});
const fmtTime=new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'});
const fmtShort=new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'2-digit',month:'2-digit'});
const today=new Date(); today.setHours(0,0,0,0);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function parseDate(x){if(!x)return null;const d=new Date(x);return isNaN(d)?null:d}
function sameDay(a,b){return a&&b&&a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
function icon(t){return ({class:'🟢',practice:'🧪',activity:'🎯',challenge:'📰',exam:'📝',excursion:'🚌',no_class:'⚪',holiday:'🎄',info:'📢'})[t]||'📌'}
function label(t){return ({class:'Clase',practice:'Práctica',activity:'Actividad',challenge:'Reto',exam:'Examen',excursion:'Excursión',no_class:'Sin clase',holiday:'Festivo',info:'Aviso'})[t]||'Evento'}
async function sb(table,query){
  if(!SBURL||!SBKEY)throw new Error('Falta la configuración de CENQAL Calendar.');
  const r=await fetch(`${SBURL}/rest/v1/${table}?${query}`,{headers:{apikey:SBKEY,Authorization:`Bearer ${SBKEY}`}});
  if(!r.ok)throw new Error(`${table}: ${r.status}`);return await r.json();
}
async function loadAll(){
  document.getElementById('todayTitle').textContent=fmtDate.format(new Date()).replace(/^./,c=>c.toUpperCase());
  document.getElementById('todaySub').textContent='Tu agenda académica CENQAL de un vistazo';
  document.getElementById('content').innerHTML='<div class="loading">Actualizando agenda…</div>';
  let errs=[];
  try{events=await sb('cenqal_calendar_events','select=id,event_code,event_type,title,description,starts_at,ends_at,location,priority,active&active=eq.true&order=starts_at.asc&limit=250')}catch(e){events=[];errs.push(e.message)}
  try{challenges=await sb('cenqal_challenges','select=id,challenge_code,title,portfolio_number,deadline,active&active=eq.true&order=deadline.asc&limit=50')}catch(e){challenges=[];errs.push(e.message)}
  render();
  if(errs.length && !events.length && !challenges.length){document.getElementById('content').innerHTML=`<div class="error">⚠️ No he podido cargar la agenda. ${esc(errs.join(' · '))}</div>`}
}
function eventCard(e,extra=''){
  const d=parseDate(e.starts_at), end=parseDate(e.ends_at); let when=d?`${fmtShort.format(d)} · ${fmtTime.format(d)}`:'Sin fecha';
  if(end&&d&&sameDay(d,end))when+=`–${fmtTime.format(end)}`;
  return `<div class="card ${extra}"><div class="row"><div class="ico">${icon(e.event_type)}</div><div class="grow"><div class="title">${esc(e.title||'Evento')}</div><div class="meta">${esc(when)}${e.location?` · 📍 ${esc(e.location)}`:''}</div>${e.description?`<div class="desc">${esc(e.description)}</div>`:''}<span class="badge">${esc(label(e.event_type))}</span></div></div></div>`
}
function challengeCard(c){
  const d=parseDate(c.deadline);return `<div class="card"><div class="row"><div class="ico">🎯</div><div class="grow"><div class="title">Porfolio ${esc(c.portfolio_number||'')} · ${esc(c.title||c.challenge_code||'Reto')}</div><div class="meta">${d?'Entrega '+fmtShort.format(d)+' · '+fmtTime.format(d):'Sin fecha límite'}</div><span class="badge">Pendiente del curso</span></div></div></div>`
}
function render(){
  const box=document.getElementById('content'); const now=new Date();
  const futureEvents=events.filter(e=>{const d=parseDate(e.starts_at);return d&&d>=new Date(now.getTime()-6*3600000)});
  const futureCh=challenges.filter(c=>{const d=parseDate(c.deadline);return d&&d>=now});
  let html='';
  if(currentView==='today'){
    const tod=events.filter(e=>sameDay(parseDate(e.starts_at),now));
    const notices=events.filter(e=>e.event_type==='info'&&sameDay(parseDate(e.starts_at),now));
    html='<div class="section">HOY</div>'+(tod.length?tod.map(e=>eventCard(e,e.event_type==='info'?'notice':'today')).join(''):'<div class="empty">✅ No hay eventos programados para hoy.</div>');
    if(notices.length===0){const recent=events.filter(e=>e.event_type==='info'&&parseDate(e.starts_at)&&parseDate(e.starts_at)<=now).slice(-1);if(recent.length)html+='<div class="section">ÚLTIMO AVISO</div>'+recent.map(e=>eventCard(e,'notice')).join('')}
    const next=futureEvents.filter(e=>!sameDay(parseDate(e.starts_at),now)).slice(0,3);if(next.length)html+='<div class="section">LO SIGUIENTE</div>'+next.map(e=>eventCard(e)).join('');
  } else if(currentView==='pending'){
    html='<div class="section">TAREAS Y ENTREGAS PENDIENTES</div>'+(futureCh.length?futureCh.slice(0,12).map(challengeCard).join(''):'<div class="empty">No hay porfolios activos con fecha pendiente.</div>');
    const acts=futureEvents.filter(e=>['activity','exam','practice'].includes(e.event_type)).slice(0,8);if(acts.length)html+='<div class="section">OTRAS TAREAS PROGRAMADAS</div>'+acts.map(e=>eventCard(e)).join('');
  } else if(currentView==='upcoming'){
    html='<div class="section">PRÓXIMOS EVENTOS</div>'+(futureEvents.length?futureEvents.slice(0,18).map(e=>eventCard(e)).join(''):'<div class="empty">No hay próximos eventos cargados.</div>');
  } else {
    const n=events.filter(e=>e.event_type==='info').sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at)).slice(0,15);
    html='<div class="section">AVISOS DE LA PROFESORA</div>'+(n.length?n.map(e=>eventCard(e,'notice')).join(''):'<div class="empty">No hay avisos activos.</div>');
  }
  box.innerHTML=html;
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;render()}));
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}}catch(e){}
loadAll();
</script>
</body>
</html>
