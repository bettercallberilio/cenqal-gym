<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CENQAL Play</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --navy:#0c3f82;--blue:#277bdc;--green:#18a66a;--violet:#7444c7;
  --amber:#e9a51b;--red:#d84b4b;--ink:#17304f;--muted:#6d7f96;
  --bg:#f3f8fd;--card:#fff;--line:#dbe7f4;--shadow:0 14px 38px rgba(35,70,110,.12)
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 0,#e7f3ff 0,transparent 35%),linear-gradient(180deg,#f8fbff,#eef6ff);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,textarea{font:inherit}
.app{max-width:760px;margin:auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px}.atom{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--green));display:grid;place-items:center;color:#fff;font-size:25px;box-shadow:var(--shadow)}
.brand h1{font-size:22px;margin:0;color:var(--navy)}.brand small{color:var(--muted)}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--navy)}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{overflow:hidden;position:relative;background:linear-gradient(135deg,#0c3f82,#277bdc 60%,#18a66a);color:white;border:0}
.hero:after{content:"H₂O";position:absolute;right:-6px;bottom:-22px;font-size:90px;font-weight:1000;opacity:.12}
.hero h2{margin:0 0 7px;font-size:26px}.hero p{margin:0;line-height:1.45;max-width:590px}
.topicgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.topic{padding:15px;border:1px solid var(--line);border-radius:18px;background:#fff;min-height:122px;position:relative;overflow:hidden}
.topic.open{cursor:pointer;border-color:#b9d6f4}.topic.locked{opacity:.58}
.topic .n{font-size:12px;font-weight:900;color:var(--blue)}.topic h3{font-size:15px;margin:7px 0 5px}.topic p{font-size:12px;color:var(--muted);margin:0}.lock{position:absolute;right:10px;top:10px}
.progress{height:8px;background:#eaf0f6;border-radius:999px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:999px}
.activities{display:grid;gap:11px}.activity{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:18px;padding:13px;background:#fff;cursor:pointer}
.activity:active{transform:scale(.99)}.acticon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:#eef6ff}
.activity h3{font-size:15px;margin:0 0 4px}.activity p{font-size:12px;color:var(--muted);margin:0}.arrow{font-size:22px;color:var(--blue)}
.steps{display:flex;gap:5px;margin:12px 0}.steps span{height:6px;flex:1;border-radius:99px;background:#dfeaf5}.steps span.on{background:var(--blue)}
.kicker{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.question{font-size:21px;font-weight:850;line-height:1.3;margin:10px 0 15px}
.answers{display:grid;gap:9px}.answer{border:1px solid var(--line);border-radius:15px;padding:13px;text-align:left;background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}.answer b{min-width:27px;height:27px;border-radius:9px;background:#edf5ff;display:grid;place-items:center;color:var(--blue)}
.answer.good{border-color:#8cd4b2;background:#eefaf4}.answer.bad{border-color:#e7a1a1;background:#fff3f3}
.feedback{border-radius:15px;padding:13px;margin-top:12px;background:#f6f9fc;line-height:1.45}.feedback.good{background:#edf9f3;color:#25684b}.feedback.bad{background:#fff3f3;color:#8a3030}
.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;font-weight:850;cursor:pointer;margin-top:11px}.primary{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff}.secondary{background:#eef5fc;color:var(--navy);border:1px solid var(--line)}
.visual{display:flex;align-items:center;justify-content:center;min-height:128px;margin:8px 0 13px;border-radius:20px;background:linear-gradient(135deg,#f3f9ff,#eefaf6);overflow:hidden;position:relative}
.water{position:relative;width:180px;height:110px}.o,.h{position:absolute;border-radius:50%;display:grid;place-items:center;color:white;font-weight:1000;box-shadow:0 8px 20px rgba(0,0,0,.14)}.o{width:76px;height:76px;background:#ef5b67;left:52px;top:25px;font-size:28px}.h{width:47px;height:47px;background:#58a6e7;font-size:20px}.h.one{left:15px;top:0}.h.two{right:15px;top:0}.bond{position:absolute;height:7px;width:55px;background:#a7b9ca;border-radius:10px;top:47px;transform-origin:left center;z-index:0}.bond.one{left:42px;transform:rotate(-28deg)}.bond.two{left:87px;transform:rotate(28deg)}
.escapeRow{display:flex;justify-content:center;gap:8px;margin:12px 0}.lockbox{width:44px;height:44px;border-radius:13px;background:#edf3f8;display:grid;place-items:center;font-weight:900}.lockbox.done{background:#e8f8f0;color:#267352}.lockbox.current{background:#eaf3ff;color:#1260a8;box-shadow:0 0 0 3px rgba(39,123,220,.14)}
textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:90px;resize:vertical}
.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rate{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 5px;text-align:center;cursor:pointer}.rate.sel{background:#eaf4ff;border-color:#7db5ed}.rate .emoji{font-size:25px;display:block}
.summary{text-align:center}.scoreRing{width:118px;height:118px;border-radius:50%;margin:5px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--green) var(--pct),#e9f0f6 0);position:relative}.scoreRing:after{content:"";position:absolute;inset:12px;background:white;border-radius:50%}.scoreRing b{position:relative;z-index:2;font-size:27px;color:var(--navy)}
.badge{display:inline-flex;gap:7px;align-items:center;background:#f2ecff;color:#6039a6;border-radius:999px;padding:8px 12px;font-weight:850;font-size:12px;margin:4px}
.note{font-size:12px;color:var(--muted);line-height:1.45}.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#17304f;color:#fff;padding:11px 14px;border-radius:13px;display:none;z-index:99;max-width:90%}.toast.show{display:block}
@media(max-width:560px){.topicgrid{grid-template-columns:1fr}.activity{grid-template-columns:48px 1fr auto}.question{font-size:19px}}
</style>
</head>

function esc(s){

  /[&<>"']/g,
  c=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[c])
 )
}

function toast(t){

}

async function rpc(name,body){
 if(DEMO)return null;

 const r=await fetch(
  `${SBURL}/rest/v1/rpc/${name}`,
  {
   method:'POST',
   headers:{
    'Content-Type':'application/json',
    'apikey':SBKEY,
    'Authorization':`Bearer ${SBKEY}`
   },
   body:JSON.stringify(body)
  }
 );

 const txt=await r.text();
 let d;

 try{
  d=txt?JSON.parse(txt):null
 }catch(e){
  d=txt
 }

 if(!r.ok){
  throw new Error(
   d?.message||
   String(d)||
   `HTTP ${r.status}`
  )
 }

 return d;
}

    p_event_type:type,
    p_phase:extra.phase||null,
    p_item_code:extra.item||null,
    p_concept_key:extra.concept||null,
    p_response:extra.response||null,
    p_is_correct:extra.correct??null,
    p_score:extra.score??null,
    p_hints_used:extra.hints||0,
    p_duration_ms:extra.ms||null,
    p_metadata:extra.meta||{}
   }
  );
 }catch(e){
  console.debug('telemetry',e)
 }
}

  state.feedback;

 if(
  f.sat==null||
  f.learn==null||
  f.better==null
 ){

  toast(
   'Marca las tres respuestas para continuar.'
  );

  return;
 }

 if(!DEMO){

  try{

   await rpc(
    'cenqal_play_feedback_v1',
    {
     p_token:PT,
     p_attempt_id:state.attempt,
     p_satisfaction:f.sat,
     p_perceived_learning:f.learn,
     p_understand_better:f.better,
     p_difficulty:null,
     p_comment:
      state.result.comment||
      null
    }
   );

  }catch(e){

   console.debug(e)

  }

 }

 saveProgress(
  state.activity,
  {
   completed:true,
   game:state.result.game,
   transfer:state.transfer,
   at:new Date().toISOString()
  }
 );

 renderResult();
}

function renderResult(){

 const a=
  ACTIVITIES[state.activity];

 const game=
  state.result.game;

 const transfer=
  state.transfer??0;

 const pct=
  Math.round(
   (game+transfer)/2
  );

 const badge=
  transfer>=100
  ?'🔬 Transferencia lograda'
  :game>=80
   ?'🧠 Buen razonamiento'
   :'🔄 En proceso';

 document.getElementById('screen').innerHTML=`

 <section class="card summary">

  <div class="kicker">
   Resultado de aprendizaje
  </div>

  <div
   class="scoreRing"
   style="--pct:${pct}%"
  >
   <b>
    ${pct}%
   </b>
  </div>

  <h2>
   ${esc(a.title)}
  </h2>

  <p>
   Predicción inicial:
   <b>
    ${
     state.pre===100
     ?'✓'
     :'→ revisar'
    }
   </b>

   · Actividad:
   <b>
    ${game}%
   </b>

   · Transferencia:
   <b>
    ${transfer}%
   </b>
  </p>

  <div class="badge">
   ${badge}
  </div>

  <p class="note">
   Este resultado es formativo.
   No concede PP ni Og.
   CENQAL utiliza la información
   para detectar conceptos que conviene reforzar.
  </p>

  <button
   class="btn primary"
   onclick="openTopic(1)"
  >
   Volver a T1
  </button>

  <button
   class="btn secondary"
   onclick="renderTopics()"
  >
   Todos los temas
  </button>

 </section>
 `;
}

boot();
</script>
</body>
</html>
