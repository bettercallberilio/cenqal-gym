const ACTIVITIES={"T1-INTERACCIONES":{"title":"Interacciones químicas","type":"Quiz visual","icon":"🧪","minutes":5,"why":"Las interacciones entre partículas ayudan a explicar propiedades como solubilidad, estado físico, densidad y punto de ebullición.","socratic":{"q":"¿Por qué el agua disuelve muchas sustancias iónicas y polares mejor que un medio apolar?","options":["Porque su polaridad permite interacciones favorables con iones y dipolos.","Porque rompe cualquier enlace covalente de manera espontánea.","Porque carece de cargas parciales.","Porque las moléculas apolares siempre atraen con más fuerza a los iones."],"correct":0,"concept":"polaridad_solubilidad"},"micro":"La polaridad del agua y sus interacciones intermoleculares permiten estabilizar iones y moléculas polares. Las fuerzas intermoleculares también influyen en propiedades físicas como ebullición, densidad y solubilidad.","items":[{"code":"Q1","concept":"fuerzas_inter","q":"¿Qué propiedad puede depender directamente de las fuerzas intermoleculares?","o":["Punto de ebullición","Número atómico","Número de protones","Masa del electrón"],"c":0,"e":"Las fuerzas intermoleculares condicionan, entre otras propiedades, el estado físico, la solubilidad y el punto de ebullición."},{"code":"Q2","concept":"puente_h","q":"¿En cuál de estas moléculas es esperable la formación de puentes de hidrógeno entre moléculas?","o":["H₂O","CH₄","Cl₂","CO₂"],"c":0,"e":"Los puentes de hidrógeno aparecen cuando H está unido a átomos pequeños y muy electronegativos como O, N o F."},{"code":"Q3","concept":"agua_ebullicion","q":"¿Qué ayuda a explicar el punto de ebullición relativamente alto del agua?","o":["La red de puentes de hidrógeno","La ausencia de polaridad","Un enlace metálico","Que el agua sea lineal"],"c":0,"e":"Para pasar a vapor deben vencerse numerosas interacciones por puente de hidrógeno."},{"code":"Q4","concept":"london","q":"¿Qué afirmación sobre las fuerzas de London es correcta?","o":["Aumentan al crecer la polarizabilidad y el tamaño molecular.","Solo existen en moléculas polares.","Son enlaces covalentes entre moléculas.","Desaparecen por completo en moléculas grandes."],"c":0,"e":"Las fuerzas de dispersión de London aumentan con nubes electrónicas más grandes y polarizables."},{"code":"Q5","concept":"polaridad_molecular","q":"Una molécula puede tener enlaces polares y, aun así, ser apolar cuando…","o":["Su geometría compensa los dipolos.","Contiene hidrógeno.","Tiene muchos electrones.","Está en estado líquido."],"c":0,"e":"La polaridad molecular depende también de la geometría; una distribución simétrica puede cancelar los dipolos."}],"transfer":{"code":"TR","concept":"transferencia_solubilidad","q":"En una formulación, ¿qué explicación es más coherente si un compuesto polar se dispersa bien en agua pero mal en una fase oleosa?","options":["Las interacciones con el agua son más favorables por su polaridad.","La fase oleosa rompe todos sus enlaces internos.","La polaridad no influye en la solubilidad.","El agua es apolar y por eso lo estabiliza."],"correct":0},"reflect":"Explica en una frase qué relación ves entre polaridad e interacción con el agua."},"T1-PROPIEDADES":{"title":"Propiedades e interacciones","type":"Mini-escape","icon":"🔐","minutes":8,"why":"Comprender la relación entre estructura e interacción permite interpretar por qué una sustancia se disuelve, hierve, se congela o cambia de estado.","socratic":{"q":"Si dos sustancias tienen fuerzas intermoleculares de distinta intensidad, ¿esperas que tengan exactamente el mismo punto de ebullición?","options":["No necesariamente.","Sí, siempre.","Solo si una es iónica.","La interacción no afecta al cambio de estado."],"correct":0,"concept":"fuerzas_propiedades"},"micro":"En este recorrido cada respuesta correcta abre un nivel. Usa polaridad, puentes de hidrógeno, fuerzas de London y estructura del agua para completar los cinco niveles.","escape":true,"items":[{"code":"L1","concept":"ion_dipolo","q":"Nivel 1 · Una sal entra en contacto con agua. ¿Qué favorece que los iones abandonen la red cristalina?","o":["La orientación de los dipolos del agua alrededor de los iones.","La ausencia de polaridad del agua.","La formación de un enlace metálico.","La desaparición de las cargas de los iones."],"c":0,"e":"El agua orienta sus extremos de carga parcial alrededor de los iones y favorece su separación de la red."},{"code":"L2","concept":"hielo_densidad","q":"Nivel 2 · ¿Por qué el hielo puede ser menos denso que el agua líquida?","o":["La red de puentes de H genera una estructura más abierta.","Los átomos de O desaparecen al congelar.","El agua se vuelve apolar.","Se forman enlaces metálicos."],"c":0,"e":"Al congelar se organiza una estructura abierta asociada a los puentes de hidrógeno."},{"code":"L3","concept":"puente_h","q":"Nivel 3 · ¿Qué pareja cumple la condición básica para un puente de hidrógeno?","o":["O–H","C–C","Cl–Cl","Na–Na"],"c":0,"e":"En el tema se destacan F–H, O–H y N–H como uniones capaces de participar en puentes de H."},{"code":"L4","concept":"london","q":"Nivel 4 · Entre Cl₂ e I₂, ¿en cuál esperas fuerzas de London más intensas?","o":["I₂","Cl₂","Iguales siempre","Ninguna presenta London"],"c":0,"e":"I₂ posee una nube electrónica mayor y más polarizable."},{"code":"L5","concept":"agua_estructura","q":"Nivel 5 · ¿Cuál describe mejor a la molécula de agua?","o":["Polar y no lineal.","Apolar y lineal.","Iónica y lineal.","Metálica y tetraédrica."],"c":0,"e":"El agua es una molécula covalente, altamente polar y no lineal."}],"transfer":{"code":"TR","concept":"transferencia_propiedades","q":"Un cambio de formulación reduce las interacciones intermoleculares entre moléculas. ¿Qué consecuencia es razonable investigar?","options":["Un cambio en propiedades físicas como ebullición o solubilidad.","Un cambio en el número atómico.","La creación de protones nuevos.","La desaparición del oxígeno."],"correct":0},"reflect":"¿Qué nivel te obligó a razonar más y por qué?"},"T1-INTRUSO":{"title":"Clasificación de sustancias","type":"El intruso","icon":"🧩","minutes":5,"why":"Clasificar obliga a identificar el criterio químico que comparten varias sustancias, no solo a recordar definiciones.","socratic":{"q":"¿Qué criterio usarías primero para comparar fuerzas intermoleculares?","options":["Polaridad, posibilidad de puente de H y tamaño/polarizabilidad.","Color del compuesto.","Nombre comercial.","Orden alfabético."],"correct":0,"concept":"clasificacion"},"micro":"En cada conjunto hay una opción que no comparte el criterio principal. Selecciona el intruso y después comprueba la razón.","items":[{"code":"I1","concept":"puente_h","q":"¿Cuál es el intruso si el criterio es “puede formar puentes de hidrógeno entre moléculas”?","o":["CH₄","H₂O","NH₃","HF"],"c":0,"e":"CH₄ no contiene H unido a O, N o F."},{"code":"I2","concept":"tipo_enlace","q":"¿Cuál es el intruso si el criterio es “sustancia molecular covalente”?","o":["NaCl","H₂O","NH₃","HCl"],"c":0,"e":"NaCl se describe como compuesto iónico; los otros ejemplos son moleculares covalentes."},{"code":"I3","concept":"london","q":"¿Cuál es el intruso si ordenamos por aumento de tamaño entre halógenos F₂, Cl₂, Br₂, I₂?","o":["H₂O","F₂","Cl₂","I₂"],"c":0,"e":"H₂O no pertenece a la serie de halógenos usada para ejemplificar el aumento de fuerzas de London con el tamaño."},{"code":"I4","concept":"propiedades_inter","q":"¿Cuál NO es una propiedad física destacada como influida por las fuerzas intermoleculares?","o":["Número de protones","Solubilidad","Densidad","Punto de ebullición"],"c":0,"e":"El número de protones define el elemento y no depende de fuerzas intermoleculares."}],"transfer":{"code":"TR","concept":"transferencia_clasificacion","q":"Si una molécula es apolar, ¿qué interacción de Van der Waals seguirá siendo relevante?","options":["Dispersión de London.","Puente de hidrógeno obligatorio.","Enlace metálico.","Enlace iónico entre moléculas."],"correct":0},"reflect":"¿Qué criterio de clasificación te parece más útil para predecir propiedades de un alimento?"},"T1-PREDICCION":{"title":"Predicción de comportamiento","type":"Predicción","icon":"🔮","minutes":6,"why":"Predecir antes de recibir la explicación obliga a activar tus ideas previas y permite comprobar si el modelo químico realmente funciona.","socratic":{"q":"Al congelarse el agua, ¿esperas que su estructura sea más compacta o más abierta?","options":["Más abierta.","Más compacta siempre.","Idéntica a la fase vapor.","No existe organización molecular."],"correct":0,"concept":"hielo_densidad"},"micro":"Primero predice. Después compara tu decisión con el modelo químico y revisa si necesitas cambiar tu explicación.","items":[{"code":"P1","concept":"agua_ebullicion","q":"Si debilitáramos notablemente las interacciones entre moléculas de agua, ¿qué esperarías respecto a la energía necesaria para separarlas?","o":["Sería menor.","Sería necesariamente mayor.","No cambiaría nunca.","Se crearían protones."],"c":0,"e":"Interacciones más débiles requieren menos energía para separar las moléculas."},{"code":"P2","concept":"hielo_densidad","q":"Al organizarse una red abierta por puentes de H durante la congelación, ¿qué tendencia esperas en densidad?","o":["Disminuir.","Aumentar sin límite.","No cambiar jamás.","Convertirse en una propiedad nuclear."],"c":0,"e":"Una estructura más abierta ocupa más volumen para una cantidad comparable de materia."},{"code":"P3","concept":"london","q":"Si aumenta el tamaño y polarizabilidad de una molécula apolar, ¿qué predices para sus fuerzas de London?","o":["Aumentarán.","Desaparecerán.","Se convertirán en enlaces iónicos.","Serán siempre cero."],"c":0,"e":"Las nubes electrónicas más grandes y polarizables favorecen dipolos instantáneos más intensos."},{"code":"P4","concept":"polaridad_solubilidad","q":"Una especie iónica entra en un disolvente muy polar. ¿Qué comportamiento es razonable predecir?","o":["El disolvente puede estabilizar las cargas mediante orientación dipolar.","Las cargas dejan de existir.","Solo puede formarse un metal.","La polaridad impide cualquier interacción."],"c":0,"e":"Los dipolos del disolvente polar pueden orientarse alrededor de las cargas."}],"transfer":{"code":"TR","concept":"transferencia_prediccion","q":"Un nuevo compuesto tiene enlaces polares pero geometría perfectamente simétrica. ¿Qué deberías comprobar antes de afirmar que la molécula es polar?","options":["Si los dipolos se cancelan por la geometría.","Solo su nombre.","Solo su color.","Si contiene un metal."],"correct":0},"reflect":"¿Cambió alguna de tus predicciones después de leer la explicación?"},"T1-ERROR":{"title":"Explicaciones químicas","type":"Detecta el error","icon":"🤖","minutes":6,"why":"Detectar un error obliga a comparar una explicación con el modelo químico y a justificar qué parte debe corregirse.","socratic":{"q":"Berilio afirma: “Si una molécula tiene enlaces polares, toda la molécula será necesariamente polar”. ¿Es correcto?","options":["No; la geometría puede cancelar los dipolos.","Sí; siempre.","Sí, pero solo en gases.","No; porque ningún enlace puede ser polar."],"correct":0,"concept":"polaridad_molecular"},"micro":"Berilio cometerá errores deliberados. Tu tarea no es estar de acuerdo con él, sino localizar el punto químico que falla.","items":[{"code":"E1","concept":"agua_estructura","q":"“La molécula de agua es lineal y apolar”. ¿Qué corrección es adecuada?","o":["Es no lineal y altamente polar.","Es metálica.","Es un ion monoatómico.","No contiene enlaces covalentes."],"c":0,"e":"El tema describe al agua como covalente, altamente polar y no lineal."},{"code":"E2","concept":"london","q":"“Las fuerzas de London solo aparecen en compuestos apolares”. ¿Qué falla?","o":["También aparecen en compuestos covalentes polares.","No existen en ninguna sustancia.","Son enlaces iónicos.","Solo aparecen en metales."],"c":0,"e":"Las fuerzas de Van der Waals están presentes en compuestos covalentes polares y apolares."},{"code":"E3","concept" async function telemetry(type,extra={}){if(DEMO||!state.attempt)return;try{await rpc('cenqal_play_log_event_v1',{p_token:PT,p_attempt_id:state.attempt,p_event_type:type,p_phase:extra.phase||null,p_item_code:extra.item||null,p_concept_key:extra.concept||null,p_response:extra.response||null,p_is_correct:extra.correct??null,p_score:extra.score??null,p_hints_used:extra.hints||0,p_duration_ms:extra.ms||null,p_metadata:extra.meta||{}})}catch(e){console.debug('telemetry',e)}}
function topicHasContent(n){return Object.keys(ACTIVITIES).some(k=>k.startsWith(`T${n}-`))}
async function boot(){if(!DEMO){try{state.boot=await rpc('cenqal_play_bootstrap_v1',{p_token:PT})}catch(e){document.getElementById('screen').innerHTML=`<section class="card"><h2>Sesión caducada</h2><p>${esc(e.message)}</p><p class="note">Vuelve a abrir CENQAL Play desde Berilio.</p></section>`;return}}else{state.boot={student:{full_name:'Modo demostración'},topics:TOPICS.map(t=>({topic_number:t.n,title:t.title,is_open:topicHasContent(t.n)})),activities:Object.keys(ACTIVITIES).map((code,i)=>({activity_code:code,topic_number:Number(code.match(/^T(\d+)-/)?.[1]||0),sort_order:(i+1)*10}))}}document.getElementById('who').textContent=state.boot.student?.academy_name||state.boot.student?.full_name||'CENQAL';renderTopics();if(INITIAL_TOPIC&&topicHasContent(INITIAL_TOPIC))setTimeout(()=>openTopic(INITIAL_TOPIC,false),30)}
function localProgress(code){try{return JSON.parse(localStorage.getItem('cqplay:'+code)||'null')}catch(e){return null}}function saveProgress(code,p){localStorage.setItem('cqplay:'+code,JSON.stringify(p))}
function renderTopics(){state.activity=null;state.attempt=null;const openMap=Object.fromEntries((state.boot.topics||[]).map(t=>[Number(t.topic_number),!!t.is_open]));document.getElementById('screen').innerHTML=`<section class="card hero"><h2>Aprender jugando, con evidencia</h2><p>Comprende, predice, juega, explica y aplica. Tus respuestas ayudan a CENQAL a detectar qué conceptos están claros y cuáles conviene reforzar.</p></section><div class="topicgrid">${TOPICS.map(t=>{const content=topicHasContent(t.n),open=DEMO?content:(openMap[t.n]&&content);const acts=Object.keys(ACTIVITIES).filter(k=>k.startsWith(`T${t.n}-`));const done=acts.filter(k=>localProgress(k)?.completed).length;return `<div class="topic ${open?'open':'locked'}" ${open?`onclick="openTopic(${t.n})"`:''}><span class="lock">${open?'':'🔒'}</span><div class="n">TEMA ${t.n}</div><h3>${esc(t.title)}</h3><p>${open?(done?`${done}/${acts.length} actividades completadas`:'Sala disponible'):(content?'Sala cerrada':'Contenido en preparación')}</p><div class="progress"><span style="width:${acts.length?100*done/acts.length:0}%"></span></div></div>`}).join('')}</div>${DEMO?'<p class="note">Vista de demostración: puedes revisar T1 y T2, pero la analítica solo se envía a CENQAL cuando el alumno abre Play desde Berilio.</p>':''}`;}
function openTopic(n,forceDemo=false){const topic=TOPICS.find(t=>t.n===Number(n));if(!topic||!topicHasContent(n)){toast('Este tema todavía no tiene actividades cargadas.');return}if(!DEMO&&!forceDemo){const srv=(state.boot.topics||[]).find(t=>Number(t.topic_number)===Number(n));if(!srv?.is_open){toast('Esta sala todavía está cerrada.');return}}state.topic=Number(n);const local=Object.keys(ACTIVITIES).filter(k=>k.startsWith(`T${n}-`));const registered=new Set((state.boot?.activities||[]).map(x=>String(x.activity_code||'')));const list=DEMO?local:local.filter(code=>registered.has(code));if(!list.length){toast('Las actividades de esta sala todavía no están habilitadas en CENQAL.');return}document.getElementById('screen').innerHTML=`<button class="btn secondary" onclick="renderTopics()">← Volver a temas</button><section class="card hero"><div class="kicker" style="color:#d9ecff">TEMA ${n}</div><h2>${esc(topic.title)}</h2><p>${esc(topic.desc)}</p></section><div class="activities">${list.map(code=>{const a=ACTIVITIES[code],p=localProgress(code);return `<div class="activity" onclick="begin('${code}')"><div class="acticon">${a.icon}</div><div><h3>${esc(a.title)}</h3><p>${esc(a.type)} · ${a.minutes} min${p?.completed?' · ✅ completada':''}</p></div><div class="arrow">›</div></div>`}).join('')}</div>`;}
async function begin(code){const a=ACTIVITIES[code];if(!a)return toast('Actividad no encontrada.');if(!DEMO){const registered=(state.boot?.activities||[]).some(x=>String(x.activity_code||'')===String(code));if(!registered)return toast('Esta actividad todavía no está habilitada en CENQAL.');}state.activity=code;state.idx=0;state.correct=0;state.answers=[];state.pre=null;state.transfer=null;state.start=Date.now();if(!DEMO){try{const d=await rpc('cenqal_play_start_attempt_v1',{p_token:PT,p_activity_code:code,p_metadata:{client:'play_web_v2_1',topic:state.topic,build:PLAY_BUILD}});state.attempt=d.attempt_id}catch(e){toast(e.message);return}}else state.attempt='demo-'+Date.now();renderWhy(a)}
function visualFor(a){if(!a.visual)return `<div class="water"><div class="bond one"></div><div class="bond two"></div><div class="o">O</div><div class="h one">H</div><div class="h two">H</div></div>`;if(a.visual==='carbonyl')return `<div class="chemVisual"><div class="chemChip">R–CHO</div><div class="chemChip">R–C(=O)–R′</div></div>`;if(a.visual==='isomers')return `<div class="chemVisual"><div class="chemChip">1-pentanol</div><div class="chemArrow">⇄</div><div class="chemChip">2-pentanol</div><div class="chemArrow">⇄</div><div class="chemChip">3-pentanol</div></div>`;if(a.visual==='sugars')return `<div class="chemVisual"><div class="chemChip">Glucosa</div><div class="chemChip">Sacarosa</div><div class="chemChip">Almidón</div></div>`;if(a.visual==='sugar_factory')return `<div class="chemVisual"><div class="chemChip">Glucosa</div><div class="chemArrow">＋</div><div class="chemChip">Fructosa</div><div class="chemArrow">→</div><div class="chemChip">Sacarosa</div></div>`;if(a.visual==='starch')return `<div class="chemVisual"><div class="granule">frío</div><div class="chemArrow">🔥 + H₂O →</div><div class="granule hot">hinchado</div></div>`;if(a.visual==='kitchen')return `<div class="chemVisual"><div class="chemChip">🍞 Maillard</div><div class="chemChip">🥣 almidón</div><div class="chemChip">🍌 hidrólisis</div></div>`;return ''}
function renderWhy(a){document.getElementById('screen').innerHTML=`<section class="card"><div class="kicker">¿Por qué importa?</div><h2>${esc(a.title)}</h2><div class="visual">${visualFor(a)}</div><p>${esc(a.why)}</p><button class="btn primary" onclick="renderPre()">Empezar</button></section>`;telemetry('activity_open',{phase:'why'})}function steps(n){return `<div class="steps">${[1,2,3,4,5,6].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`}
function renderPre(){const a=ACTIVITIES[state.activity],x=a.socratic;document.getElementById('screen').innerHTML=`<section class="card">${steps(2)}<div class="kicker">Antes de jugar · predice</div><div class="question">${esc(x.q)}</div><div class="answers">${x.options.map((o,i)=>`<button class="answer" onclick="answerPre(${i})"><b>${String.fromCharCode(65+i)}</b>${esc(o)}</button>`).join('')}</div></section>`}
async function answerPre(i){const a=ACTIVITIES[state.activity],x=a.socratic,ok=i===x.correct;state.pre=ok?100:0;haptic(ok);await telemetry('response',{phase:'pre',item:'PRE',concept:x.concept,response:{selected:i},correct:ok,score:state.pre});document.getElementById('screen').innerHTML=`<section class="card">${steps(3)}<div class="kicker">Idea clave</div><h2>${ok?'Buena predicción':'Revisa el modelo'}</h2><p>${esc(a.micro)}</p><button class="btn primary" onclick="startGame()">Entrar en la actividad</button></section>`}
function startGame(){state.idx=0;state.correct=0;renderItem()}function renderItem(){const a=ACTIVITIES[state.activity],x=a.items[state.idx];if(!x)return renderTransfer();document.getElementById('screen').innerHTML=`<section class="card">${steps(4)}<div class="kicker">${esc(a.type)} · ${state.idx+1}/${a.items.length}</div>${a.escape?`<div class="escapeRow">${a.items.map((_,i)=>`<div class="lockbox ${i<state.idx?'done':i===state.idx?'current':''}">${i<state.idx?'✓':i+1}</div>`).join('')}</div>`:''}<div class="question">${esc(x.q)}</div><div class="answers">${x.o.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answerItem(${i})"><b>${String.fromCharCode(65+i)}</b>${esc(o)}</button>`).join('')}</div><div id="explain"></div></section>`;state.itemShown=Date.now()}
async function answerItem(i){const a=ACTIVITIES[state.activity],x=a.items[state.idx],ok=i===x.c;state.correct+=ok?1:0;state.answers.push({code:x.code,ok});haptic(ok);document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add('good');if(j===i&&!ok)b.classList.add('bad')});document.getElementById('explain').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correcto':'No exactamente'}</b><br>${esc(x.e)}</div><button class="btn primary" onclick="nextItem()">Continuar</button>`;await telemetry('response',{phase:'game',item:x.code,concept:x.concept,response:{selected:i},correct:ok,score:ok?100:0,ms:Date.now()-state.itemShown})}function nextItem(){state.idx++;renderItem()}
function renderTransfer(){const a=ACTIVITIES[state.activity],x=a.transfer;document.getElementById('screen').innerHTML=`<section class="card">${steps(5)}<div class="kicker">Transferencia</div><div class="question">${esc(x.q)}</div><div class="answers">${x.options.map((o,i)=>`<button class="answer" onclick="answerTransfer(${i})"><b>${String.fromCharCode(65+i)}</b>${esc(o)}</button>`).join('')}</div></section>`;state.itemShown=Date.now()}
async function answerTransfer(i){const a=ACTIVITIES[state.activity],x=a.transfer,ok=i===x.correct;state.transfer=ok?100:0;haptic(ok);await telemetry('response',{phase:'transfer',item:x.code,concept:x.concept,response:{selected:i},correct:ok,score:state.transfer,ms:Date.now()-state.itemShown});document.getElementById('screen').innerHTML=`<section class="card">${steps(6)}<div class="kicker">Explica y reflexiona</div><h2>${ok?'Transferencia lograda':'Esta parte conviene reforzar'}</h2><p>${ok?'Has aplicado el concepto a una situación diferente.':'El objetivo es detectar dónde conviene revisar el razonamiento.'}</p><label class="note">${esc(a.reflect)}</label><textarea id="reflection" placeholder="Respuesta breve (opcional)"></textarea><button class="btn primary" onclick="finishActivity()">Continuar</button></section>`}
async function finishActivity(){const a=ACTIVITIES[state.activity],comment=document.getElementById('reflection')?.value.trim()||'',game=Math.round(100*state.correct/a.items.length),duration=Date.now()-state.start;await telemetry('reflection',{phase:'reflection',response:{text:comment}});if(!DEMO){try{await rpc('cenqal_play_finish_attempt_v1',{p_token:PT,p_attempt_id:state.attempt,p_pre_score:state.pre??0,p_game_score:game,p_transfer_score:state.transfer??0,p_duration_ms:duration,p_metadata:{activity_type:a.type,topic:state.topic}})}catch(e){console.debug(e)}}state.result={game,duration,comment};renderFeedback()}
function renderFeedback(){document.getElementById('screen').innerHTML=`<section class="card"><div class="kicker">Tu experiencia</div><h2>¿Te ha gustado esta actividad?</h2><div class="rating" id="sat">${[['🙁','Nada'],['😐','Poco'],['🙂','Bastante'],['😍','Mucho']].map((x,i)=>`<button class="rate" onclick="rate('sat',${i+1},this)"><span class="emoji">${x[0]}</span>${x[1]}</button>`).join('')}</div><h3 style="margin-top:18px">¿Cuánto crees que has aprendido?</h3><div class="rating" id="learn">${[['🫥','Nada'],['🌱','Poco'],['🧠','Algo'],['✨','Mucho']].map((x,i)=>`<button class="rate" onclick="rate('learn',${i+1},this)"><span class="emoji">${x[0]}</span>${x[1]}</button>`).join('')}</div><h3 style="margin-top:18px">¿Ahora entiendes mejor el concepto?</h3><div class="rating" id="better"><button class="rate" onclick="rate('better',0,this)">No</button><button class="rate" onclick="rate('better',1,this)">No estoy seguro</button><button class="rate" onclick="rate('better',2,this)">Sí</button></div><button class="btn primary" onclick="saveFeedback()">Ver resultado</button></section>`}
function rate(k,v,el){state.feedback[k]=v;el.parentElement.querySelectorAll('.rate').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}async function saveFeedback(){const f=state.feedback;if(f.sat==null||f.learn==null||f.better==null){toast('Marca las tres respuestas para continuar.');return}if(!DEMO){try{await rpc('cenqal_play_feedback_v1',{p_token:PT,p_attempt_id:state.attempt,p_satisfaction:f.sat,p_perceived_learning:f.learn,p_understand_better:f.better,p_difficulty:null,p_comment:state.result.comment||null})}catch(e){console.debug(e)}}saveProgress(state.activity,{completed:true,game:state.result.game,transfer:state.transfer,at:new Date().toISOString()});renderResult()}
function renderResult(){const a=ACTIVITIES[state.activity],game=state.result.game,transfer=state.transfer??0,pct=Math.round((game+transfer)/2),badge=transfer>=100?'🔬 Transferencia lograda':game>=80?'🧠 Buen razonamiento':'🔄 En proceso';document.getElementById('screen').innerHTML=`<section class="card summary"><div class="kicker">Resultado de aprendizaje</div><div class="scoreRing" style="--pct:${pct}%"><b>${pct}%</b></div><h2>${esc(a.title)}</h2><p>Predicción inicial: <b>${state.pre===100?'✓':'→ revisar'}</b> · Actividad: <b>${game}%</b> · Transferencia: <b>${transfer}%</b></p><div class="badge">${badge}</div><p class="note">Este resultado es formativo. No concede PP ni Og. CENQAL utiliza la información para detectar conceptos que conviene reforzar.</p><button class="btn primary" onclick="openTopic(${state.topic},false)">Volver a T${state.topic}</button><button class="btn secondary" onclick="renderTopics()">Todos los temas</button></section>`}
boot();
</script></body></html>
