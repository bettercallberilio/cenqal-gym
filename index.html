:root{--bg:var(--tg-theme-bg-color,#f5f7fa);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#17202a);--muted:var(--tg-theme-hint-color,#657786);--accent:var(--tg-theme-button-color,#2481cc);--accentText:var(--tg-theme-button-text-color,#fff);--line:rgba(120,130,140,.22);--good:#198754;--bad:#c0392b;--warn:#b7791f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit}
.app{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.logo{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-size:25px}.brand h1{font-size:19px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 5px 18px rgba(0,0,0,.04)}.hero{padding:18px}.hero h2{margin:0 0 6px;font-size:22px}.hero p{margin:0;color:var(--muted);line-height:1.42}.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.topic{min-height:92px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:13px;text-align:left}.topic:active,.action:active,.answer:active{transform:scale(.985)}.topic strong{display:block;font-size:16px}.topic small{display:block;color:var(--muted);margin-top:5px;line-height:1.25}.topic .badge{display:inline-block;margin-top:8px;font-size:11px;font-weight:700}.available .badge{color:var(--good)}.locked{opacity:.58}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{text-align:center;border:1px solid var(--line);border-radius:14px;padding:10px 5px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.actions{display:grid;gap:9px;margin-top:14px}.action{border:0;border-radius:14px;padding:14px 12px;font-weight:700;background:var(--accent);color:var(--accentText)}.action.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.action.danger{background:transparent;color:var(--bad);border:1px solid rgba(192,57,43,.35)}.progressrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:7px}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);width:0;transition:width .25s}.difficulty{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.difficulty.hard{color:var(--bad)}.difficulty.medium{color:var(--warn)}.question{font-size:19px;line-height:1.38;font-weight:750;margin:15px 0 16px}.answers{display:grid;gap:9px}.answer{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 13px;background:var(--card);color:var(--text);text-align:left;line-height:1.34}.answer b{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--line);margin-right:7px}.answer.correct{border-color:var(--good);background:rgba(25,135,84,.08)}.answer.wrong{border-color:var(--bad);background:rgba(192,57,43,.08)}.answer[disabled]{opacity:.83}.feedback{margin-top:14px;border-radius:15px;padding:14px;line-height:1.46}.feedback.good{background:rgba(25,135,84,.10);border:1px solid rgba(25,135,84,.28)}.feedback.bad{background:rgba(192,57,43,.09);border:1px solid rgba(192,57,43,.25)}.feedback h3{margin:0 0 7px;font-size:16px}.feedback p{margin:0;font-size:14px}.concept{margin-top:10px;color:var(--muted);font-size:12px}.hidden{display:none!important}.center{text-align:center}.big{font-size:34px}.muted{color:var(--muted)}.masteryline{font-size:13px;color:var(--muted);margin:9px 0}.footer{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:11px;color:var(--muted)}

<script>
const QUESTIONS = [{"id":"T1-Q01","difficulty":"medium","concept":"Configuración electrónica","question":"¿Qué afirmación describe mejor el principio de Aufbau al escribir la configuración electrónica de un átomo?","options":["Los electrones ocupan primero los orbitales disponibles de menor energía.","Los electrones ocupan primero los orbitales de mayor número cuántico principal.","Cada orbital recibe cuatro electrones antes de pasar al siguiente.","Los electrones se distribuyen únicamente según la masa atómica del elemento."],"correct":0,"explanation":"Aufbau establece que los electrones se incorporan a los orbitales de manera que el átomo alcance la menor energía posible; por eso se llenan primero los orbitales de menor energía.","topic":1},{"id":"T1-Q02","difficulty":"medium","concept":"Principio de Pauli","question":"Dos electrones se encuentran en el mismo orbital atómico. ¿Qué condición debe cumplirse?","options":["Deben tener espines opuestos.","Deben tener los cuatro números cuánticos idénticos.","Deben encontrarse siempre en un orbital p.","Deben pertenecer a elementos distintos."],"correct":0,"explanation":"El principio de exclusión de Pauli impide que dos electrones de un mismo átomo tengan los cuatro números cuánticos iguales. En un mismo orbital comparten n, l y mₗ, por lo que necesariamente deben diferir en el espín.","topic":1},{"id":"T1-Q03","difficulty":"medium","concept":"Regla de Hund","question":"En tres orbitales p degenerados hay tres electrones. ¿Cómo se distribuyen en el estado de menor energía?","options":["Cada electrón ocupa un orbital distinto con espines paralelos.","Uno ocupa p y los otros dos pasan a un orbital d.","Dos se aparean en el primer orbital y uno ocupa el segundo.","Los tres se aparean en un único orbital."],"correct":0,"explanation":"La regla de Hund indica que, en orbitales de igual energía, los electrones se colocan primero desapareados y con espines paralelos, reduciendo la repulsión electrónica.","topic":1},{"id":"T1-Q04","difficulty":"hard","concept":"Tabla periódica y valencia","question":"Dos elementos pertenecen al mismo grupo principal de la tabla periódica. ¿Qué propiedad explica mejor que presenten comportamientos químicos semejantes?","options":["Tienen idéntico número de neutrones.","Presentan una configuración semejante de electrones de valencia.","Poseen el mismo número de niveles electrónicos.","Tienen exactamente la misma masa atómica."],"correct":1,"explanation":"El comportamiento químico está determinado en gran medida por los electrones de valencia, que son los que intervienen en la formación de enlaces. Los elementos de un mismo grupo principal comparten una configuración de valencia semejante.","topic":1},{"id":"T1-Q05","difficulty":"medium","concept":"Electronegatividad","question":"¿Qué representa la electronegatividad en el contexto de un enlace químico?","options":["La energía necesaria para separar físicamente dos moléculas de agua.","El número total de protones y neutrones de un átomo.","La capacidad relativa de un átomo para atraer hacia sí los electrones compartidos.","La capacidad de un sólido para conducir calor."],"correct":2,"explanation":"La electronegatividad expresa la tendencia relativa de un átomo enlazado a atraer la densidad electrónica del enlace. Las diferencias de electronegatividad ayudan a interpretar la polaridad y el carácter de los enlaces.","topic":1},{"id":"T1-Q06","difficulty":"hard","concept":"Formación del enlace","question":"Cuando dos átomos se aproximan para formar un enlace estable, ¿qué situación energética caracteriza la distancia de enlace?","options":["No existe ninguna interacción electrostática.","La energía potencial del sistema alcanza un mínimo.","La repulsión entre núcleos desaparece por completo.","La energía potencial aumenta indefinidamente."],"correct":1,"explanation":"La distancia de enlace corresponde al equilibrio entre atracciones y repulsiones. En ese punto la energía potencial es mínima y el sistema es más estable que a distancias mayores o menores.","topic":1},{"id":"T1-Q07","difficulty":"medium","concept":"Enlace iónico","question":"¿Qué descripción representa mejor la formación de un compuesto iónico como NaCl?","options":["Na y Cl permanecen neutros y solo interactúan por fuerzas de London.","Na cede densidad electrónica y se forman iones de carga opuesta que se organizan en una red cristalina.","Na y Cl se unen mediante electrones completamente deslocalizados por todo el cristal.","Na y Cl comparten por igual un par electrónico y forman moléculas discretas."],"correct":1,"explanation":"En el modelo iónico, el metal forma un catión y el no metal un anión. La atracción electrostática entre cargas opuestas no genera moléculas discretas de NaCl, sino una red cristalina extensa.","topic":1},{"id":"T1-Q08","difficulty":"hard","concept":"Energía reticular","question":"Si se comparan dos sólidos iónicos de geometría semejante, ¿qué combinación tenderá a producir una energía reticular de mayor magnitud?","options":["Iones con menor carga y mayor radio.","Iones neutros y de gran tamaño.","Iones con igual carga pero separados a mayor distancia.","Iones con mayor carga y menor radio."],"correct":3,"explanation":"La atracción electrostática aumenta con el producto de las cargas y disminuye al aumentar la distancia entre iones. Por eso, cargas mayores y radios menores suelen dar redes iónicas más fuertemente cohesionadas.","topic":1},{"id":"T1-Q09","difficulty":"medium","concept":"Conductividad iónica","question":"¿Por qué un cristal sólido de NaCl no conduce bien la corriente eléctrica, mientras que una disolución acuosa de NaCl sí puede hacerlo?","options":["En el sólido no existen cargas; en agua aparecen protones nuevos.","En el sólido los iones están prácticamente fijos en la red, mientras que en disolución pueden desplazarse.","El agua convierte todos los iones en electrones libres.","El enlace iónico desaparece y se convierte en metálico."],"correct":1,"explanation":"Las especies cargadas ya existen en el sólido, pero están inmovilizadas en posiciones de la red. Al disolverse, los iones hidratados pueden moverse y transportar carga eléctrica.","topic":1},{"id":"T1-Q10","difficulty":"hard","concept":"Solvatación","question":"¿Qué interacción es especialmente importante cuando el NaCl se disuelve en agua?","options":["Enlaces metálicos entre Na⁺ y las moléculas de agua.","Interacciones ion-dipolo entre los iones y las moléculas polares de agua.","Formación de moléculas covalentes NaCl-H₂O.","Únicamente fuerzas de London entre Na⁺ y Cl⁻."],"correct":1,"explanation":"El agua es polar. Su extremo parcialmente negativo se orienta hacia los cationes y el parcialmente positivo hacia los aniones. Estas interacciones ion-dipolo estabilizan los iones separados y favorecen la solvatación.","topic":1},{"id":"T1-Q11","difficulty":"medium","concept":"Enlace covalente","question":"¿Cuál es la característica esencial de un enlace covalente?","options":["La formación obligatoria de una red de cationes y aniones.","La deslocalización de todos los electrones de la sustancia como en un metal.","La transferencia completa de protones entre los átomos.","La compartición de uno o más pares de electrones entre los núcleos enlazados."],"correct":3,"explanation":"En el enlace covalente la densidad electrónica enlazante se comparte entre los átomos. Puede haber enlaces simples, dobles o triples según el número de pares compartidos.","topic":1},{"id":"T1-Q12","difficulty":"hard","concept":"Polaridad molecular","question":"Una molécula contiene varios enlaces covalentes polares. ¿Por qué no puede afirmarse automáticamente que la molécula completa sea polar?","options":["Porque la electronegatividad deja de actuar cuando hay más de dos átomos.","Porque la polaridad solo existe en sólidos iónicos.","Porque los momentos dipolares de los enlaces pueden cancelarse debido a la geometría molecular.","Porque los enlaces covalentes nunca originan cargas parciales."],"correct":2,"explanation":"La polaridad molecular depende tanto de la polaridad de cada enlace como de su disposición espacial. Una geometría simétrica puede hacer que los vectores dipolares se cancelen.","topic":1},{"id":"T1-Q13","difficulty":"medium","concept":"Geometría del agua","question":"¿Qué combinación explica mejor que la molécula de agua posea un momento dipolar neto?","options":["Los enlaces O-H son polares y la geometría molecular no permite cancelar sus dipolos.","El oxígeno y el hidrógeno tienen idéntica electronegatividad.","Los enlaces O-H son apolares y la molécula es lineal.","El agua está formada por iones H⁺ y O²⁻ libres."],"correct":0,"explanation":"El oxígeno atrae con mayor intensidad la densidad electrónica de los enlaces O-H y la geometría angular de H₂O hace que los dipolos de ambos enlaces no se anulen, originando una molécula polar.","topic":1},{"id":"T1-Q14","difficulty":"medium","concept":"Enlace metálico","question":"¿Qué modelo explica simultáneamente la conductividad y la maleabilidad de muchos metales?","options":["Iones positivos y negativos alternados sin electrones móviles.","Una red de moléculas polares unidas por puentes de hidrógeno.","Moléculas apolares unidas exclusivamente por fuerzas de London.","Cationes metálicos cohesionados por electrones de valencia deslocalizados."],"correct":3,"explanation":"En el modelo metálico, los electrones de valencia están deslocalizados y pueden desplazarse por la red. La cohesión no depende de pares de iones de signo opuesto concretos, lo que permite conducción y deformación sin ruptura inmediata de la estructura.","topic":1},{"id":"T1-Q15","difficulty":"hard","concept":"Enlace vs interacción","question":"En agua líquida, ¿qué afirmación distingue correctamente el enlace O-H de un puente de hidrógeno?","options":["Ambos implican transferencia completa de electrones.","El enlace O-H mantiene unidos O y H dentro de una molécula; el puente de hidrógeno es una interacción principalmente intermolecular entre regiones parcialmente cargadas.","El puente de hidrógeno une O y H dentro de cada molécula y el enlace O-H une moléculas distintas.","Ambos son enlaces covalentes intramoleculares de igual naturaleza."],"correct":1,"explanation":"El O-H es un enlace covalente intramolecular. Los puentes de hidrógeno aparecen entre un H enlazado a un átomo muy electronegativo y un átomo electronegativo vecino con densidad electrónica disponible; en agua contribuyen a cohesionar moléculas distintas.","topic":1},{"id":"T1-Q16","difficulty":"medium","concept":"Dipolo-dipolo","question":"¿Entre qué especies son especialmente características las interacciones dipolo-dipolo?","options":["Entre moléculas con dipolos permanentes.","Exclusivamente entre dos cationes.","Únicamente entre metales sólidos.","Solo entre gases nobles monoatómicos."],"correct":0,"explanation":"Las interacciones dipolo-dipolo se deben a la atracción entre regiones de carga parcial opuesta de moléculas que poseen dipolos permanentes.","topic":1},{"id":"T1-Q17","difficulty":"medium","concept":"Fuerzas de London","question":"¿Por qué las fuerzas de dispersión de London suelen aumentar al crecer el tamaño y la polarizabilidad de una molécula?","options":["Porque las nubes electrónicas más extensas se deforman con mayor facilidad y originan dipolos instantáneos más intensos.","Porque las moléculas grandes siempre se convierten en iones.","Porque desaparece el movimiento de los electrones.","Porque se forman necesariamente enlaces covalentes entre moléculas vecinas."],"correct":0,"explanation":"Las fuerzas de London surgen de fluctuaciones momentáneas de la nube electrónica. Una nube más grande y polarizable se distorsiona más fácilmente, lo que aumenta la intensidad de los dipolos instantáneos e inducidos.","topic":1},{"id":"T1-Q18","difficulty":"hard","concept":"Fuerzas de London","question":"Dos moléculas apolares tienen masa molecular semejante, pero una posee una superficie de contacto mucho mayor. ¿Cuál tenderá a presentar interacciones de London más intensas?","options":["La de menor superficie de contacto.","La de mayor superficie de contacto.","Solo puede responderse si una de ellas es iónica.","Ambas necesariamente presentan interacciones nulas."],"correct":1,"explanation":"A igualdad aproximada de otros factores, una superficie de contacto mayor permite más regiones de interacción cercana entre nubes electrónicas y puede reforzar las fuerzas de dispersión.","topic":1},{"id":"T1-Q19","difficulty":"medium","concept":"Puente de hidrógeno","question":"¿Qué condición favorece especialmente la formación de puentes de hidrógeno?","options":["La presencia exclusiva de dos iones del mismo signo.","La existencia de un metal con electrones deslocalizados.","Un H enlazado a O, N o F y la proximidad de un átomo electronegativo con densidad electrónica disponible.","Cualquier enlace C-H, independientemente del entorno."],"correct":2,"explanation":"Los puentes de hidrógeno son particularmente relevantes cuando H está unido a átomos pequeños y muy electronegativos como O, N o F, generando una fuerte polarización que permite una interacción intensa con otra región electronegativa.","topic":1},{"id":"T1-Q20","difficulty":"hard","concept":"Interacciones intermoleculares","question":"Una molécula polar capaz de formar puentes de hidrógeno también presenta fuerzas de London. ¿Por qué?","options":["Porque toda molécula polar se ioniza espontáneamente.","Porque las fuerzas de London solo aparecen después de romper enlaces covalentes.","Porque los puentes de hidrógeno transforman la molécula en un metal.","Porque las fuerzas de London proceden de fluctuaciones electrónicas y están presentes en todas las especies moleculares polarizables."],"correct":3,"explanation":"Las fluctuaciones de la nube electrónica ocurren también en moléculas polares. Por tanto, las fuerzas de London coexisten con otras interacciones; la presencia de un puente de hidrógeno no elimina las fuerzas de dispersión.","topic":1},{"id":"T1-Q21","difficulty":"medium","concept":"Agua y ebullición","question":"¿Cuál es la explicación molecular más adecuada del punto de ebullición anormalmente alto del agua respecto a hidruros semejantes?","options":["El agua es un sólido iónico a temperatura ambiente.","Los enlaces O-H se rompen completamente cada vez que el agua hierve.","Las moléculas de agua forman una red extensa de puentes de hidrógeno cuya separación requiere energía adicional.","La molécula de agua carece de polaridad."],"correct":2,"explanation":"Al hervir no se rompen de forma generalizada los enlaces covalentes O-H; se vencen principalmente interacciones entre moléculas. La red de puentes de hidrógeno eleva la energía necesaria para pasar a vapor.","topic":1},{"id":"T1-Q22","difficulty":"hard","concept":"Hielo y densidad","question":"¿Por qué el hielo puede ser menos denso que el agua líquida?","options":["Porque desaparecen todas las interacciones entre moléculas.","Porque al solidificar se forma una estructura de puentes de hidrógeno relativamente abierta que mantiene las moléculas más separadas.","Porque el hielo se convierte en una red metálica.","Porque al congelar el oxígeno pierde protones y disminuye su masa."],"correct":1,"explanation":"La organización de los puentes de hidrógeno en el sólido favorece una estructura abierta. El volumen ocupado por una misma cantidad de materia aumenta respecto a la fase líquida, disminuyendo la densidad.","topic":1},{"id":"T1-Q23","difficulty":"medium","concept":"Calor específico","question":"¿Qué consecuencia tecnológica se relaciona con el elevado calor específico del agua en un alimento?","options":["El calor específico determina por sí solo la actividad de agua.","Los alimentos ricos en agua no pueden calentarse nunca.","El agua elimina cualquier necesidad de control térmico.","Los alimentos ricos en agua pueden requerir una cantidad considerable de energía para cambiar su temperatura."],"correct":3,"explanation":"Un calor específico elevado significa que se necesita bastante energía para elevar la temperatura de una determinada masa de agua. Por eso el contenido acuoso influye en la respuesta térmica de los alimentos y en el diseño de procesos de calentamiento o enfriamiento.","topic":1},{"id":"T1-Q24","difficulty":"hard","concept":"Calor de vaporización","question":"En una operación de enfriamiento por evaporación, ¿por qué la pérdida de agua puede extraer una cantidad importante de energía del sistema?","options":["Porque la vaporización exige vencer numerosas interacciones intermoleculares y posee un calor latente elevado.","Porque el agua vaporiza sin absorber energía.","Porque durante la evaporación se forman enlaces metálicos.","Porque cada molécula de agua se transforma en un ion al evaporarse."],"correct":0,"explanation":"Pasar de líquido a vapor exige separar moléculas que estaban cohesionadas por interacciones, especialmente puentes de hidrógeno. Esa transición consume energía, fundamento del efecto refrigerante de la evaporación.","topic":1},{"id":"T1-Q25","difficulty":"hard","concept":"Agua y microondas","question":"Un alimento con gran cantidad de agua suele responder intensamente al calentamiento por microondas. ¿Qué propiedad molecular del agua resulta relevante?","options":["Su carácter polar permite que el campo eléctrico alternante interaccione con la orientación de sus dipolos y favorezca la disipación de energía.","Su estructura es una red iónica rígida que conduce electrones libres.","Carece de momento dipolar, por lo que no interacciona con campos eléctricos.","Los microondas rompen selectivamente todos los enlaces O-H en cada ciclo."],"correct":0,"explanation":"El agua posee un momento dipolar. El campo eléctrico alternante de las microondas hace que los dipolos intenten reorientarse, y la relajación molecular contribuye a convertir energía electromagnética en calor. No se trata de romper masivamente enlaces O-H.","topic":1},{"id":"T1-Q26","difficulty":"medium","concept":"Agua como disolvente","question":"¿Por qué el agua es un buen disolvente para muchas especies iónicas y polares?","options":["Porque disuelve por igual cualquier sustancia, incluida toda sustancia apolar.","Por su polaridad y su capacidad para establecer interacciones ion-dipolo y puentes de hidrógeno.","Porque siempre transforma el soluto en un gas.","Porque carece de interacciones intermoleculares propias."],"correct":1,"explanation":"La polaridad del agua permite estabilizar cargas y regiones polares. Esto explica su eficacia frente a muchos iones y moléculas polares, pero no convierte al agua en un disolvente universal para sustancias apolares.","topic":1},{"id":"T1-Q27","difficulty":"medium","concept":"Azúcares y agua","question":"La sacarosa contiene numerosos grupos hidroxilo. ¿Qué interacción ayuda especialmente a explicar su afinidad por el agua?","options":["Atracción entre dos redes iónicas completas.","Ausencia total de polaridad en la sacarosa.","Puentes de hidrógeno entre grupos -OH y moléculas de agua.","Enlace metálico entre los átomos de carbono y el agua."],"correct":2,"explanation":"Los grupos hidroxilo son polares y pueden donar o aceptar puentes de hidrógeno con el agua. La suma de muchas de estas interacciones favorece la hidratación y la solubilidad del azúcar.","topic":1},{"id":"T1-Q28","difficulty":"hard","concept":"Polaridad y miscibilidad","question":"Al mezclar aceite y agua se forman dos fases. ¿Cuál es la interpretación más adecuada desde las interacciones moleculares?","options":["El aceite y el agua forman enlaces covalentes entre sí pero se separan por gravedad.","El agua no posee ninguna interacción intermolecular.","El aceite está formado únicamente por iones positivos que repelen al agua.","Las moléculas mayoritariamente apolares del aceite no compensan energéticamente la ruptura de la red de interacciones entre moléculas de agua, por lo que la mezcla es desfavorable."],"correct":3,"explanation":"El agua se estabiliza mediante interacciones polares y puentes de hidrógeno, mientras que los lípidos apolares interaccionan sobre todo por dispersión. Mezclar ambos medios no genera interacciones suficientemente favorables para compensar las que se pierden.","topic":1},{"id":"T1-Q29","difficulty":"medium","concept":"Hidratación de macromoléculas","question":"¿Qué puede ocurrir cuando proteínas o polisacáridos presentan numerosos grupos capaces de interaccionar con agua?","options":["Necesariamente se transforman en compuestos iónicos cristalinos.","Pierden todos sus enlaces covalentes.","Pueden hidratarse y contribuir a dispersiones, viscosidad y determinadas texturas.","El agua deja de ser polar."],"correct":2,"explanation":"Los grupos polares de macromoléculas pueden establecer múltiples interacciones con el agua. La hidratación resultante influye en propiedades reológicas y en la formación de dispersiones, soles o geles.","topic":1},{"id":"T1-Q30","difficulty":"hard","concept":"Agua y geles","question":"En un sistema concentrado de un polímero hidrófilo, una parte importante del agua queda retenida en una red tridimensional y el sistema se vuelve muy viscoso o gelifica. ¿Qué explicación es más coherente?","options":["Todos los enlaces covalentes del polímero se rompen para liberar electrones.","La interacción repetida polímero-agua y polímero-polímero limita la movilidad del agua y construye una estructura extendida.","La viscosidad aumenta porque desaparece cualquier interacción molecular.","El agua se convierte químicamente en un metal."],"correct":1,"explanation":"La suma de muchas interacciones no covalentes puede crear una red que inmoviliza parcialmente el agua. No es necesario formar nuevos enlaces covalentes para que aparezcan viscosidad o comportamiento de gel.","topic":1},{"id":"T1-Q31","difficulty":"medium","concept":"Actividad de agua","question":"Dos alimentos contienen el mismo porcentaje de agua, pero presentan distinta actividad de agua (aᵥ). ¿Es químicamente posible?","options":["Sí, pero únicamente si uno de los alimentos es metálico.","No, el contenido de agua determina de forma única y lineal la aᵥ.","No, la aᵥ solo depende del color del alimento.","Sí, porque la aᵥ depende de la disponibilidad y del estado energético del agua, no solo de la cantidad total presente."],"correct":3,"explanation":"El contenido de humedad y la actividad de agua no son equivalentes. La interacción del agua con sales, azúcares, proteínas, polisacáridos y otras estructuras modifica su tendencia a escapar y, por tanto, su actividad.","topic":1},{"id":"T1-Q32","difficulty":"medium","concept":"Definición de actividad de agua","question":"A temperatura constante, ¿qué relación representa conceptualmente la actividad de agua de un alimento?","options":["La presión de vapor del agua sobre el alimento dividida por la presión de vapor del agua pura en las mismas condiciones.","La concentración de proteínas dividida por la de lípidos.","El punto de ebullición dividido por el punto de congelación.","La masa de agua multiplicada por la masa total del alimento."],"correct":0,"explanation":"La actividad de agua se relaciona con la presión de vapor relativa: aᵥ = P/P₀ en condiciones de equilibrio. Es una medida de la disponibilidad termodinámica del agua, no del porcentaje de humedad.","topic":1},{"id":"T1-Q33","difficulty":"hard","concept":"Equilibrio higroscópico","question":"Un alimento se mantiene en una cámara cerrada hasta alcanzar equilibrio con la humedad relativa del aire. ¿Qué interpreta mejor ese equilibrio?","options":["La tendencia del agua a escapar del alimento se ha igualado con la del entorno; la humedad relativa de equilibrio refleja su actividad de agua.","Toda el agua del alimento se ha evaporado necesariamente.","El contenido de agua del alimento se vuelve siempre cero.","El alimento deja de contener interacciones con sus solutos."],"correct":0,"explanation":"En equilibrio no existe un flujo neto de agua entre alimento y atmósfera. La humedad relativa de equilibrio está directamente relacionada con la actividad de agua y refleja la disponibilidad del agua en el sistema.","topic":1},{"id":"T1-Q34","difficulty":"hard","concept":"Isotermas de sorción","question":"¿Por qué no es correcto asumir una relación lineal universal entre contenido de humedad y actividad de agua?","options":["Porque la actividad de agua no depende en absoluto de la presencia de agua.","Porque el agua interactúa con la matriz alimentaria con distintas intensidades y las isotermas de sorción suelen ser no lineales.","Porque la humedad solo puede medirse en alimentos congelados.","Porque toda el agua de un alimento es químicamente idéntica y completamente libre."],"correct":1,"explanation":"A medida que cambia la humedad se ocupan sitios de unión y cambian los mecanismos de retención. Por eso, el incremento de agua total no produce necesariamente el mismo incremento proporcional de aᵥ.","topic":1},{"id":"T1-Q35","difficulty":"medium","concept":"Actividad de agua y estabilidad","question":"¿Por qué la actividad de agua es más útil que el contenido de humedad para predecir muchos aspectos de la estabilidad de un alimento?","options":["Porque siempre aumenta cuando se añade sal.","Porque sustituye a cualquier otro parámetro de conservación.","Porque informa mejor sobre la fracción de agua disponible para procesos químicos, físicos y microbiológicos.","Porque indica directamente la cantidad de minerales del alimento."],"correct":2,"explanation":"La estabilidad depende en gran medida de cuánta agua está disponible para movilidad molecular, reacciones y crecimiento microbiano. Dos alimentos con humedad semejante pueden comportarse de forma muy distinta si su aᵥ es diferente.","topic":1},{"id":"T1-Q36","difficulty":"hard","concept":"Salado y azucarado","question":"¿Qué mecanismo común explica que añadir suficiente sal o azúcar pueda reducir la actividad de agua de un alimento?","options":["El efecto se debe exclusivamente a un aumento del punto de fusión del alimento.","La sal y el azúcar convierten el agua en un compuesto apolar.","Los solutos eliminan todos los átomos de hidrógeno del agua.","Los solutos interactúan con el agua y disminuyen su potencial químico y su tendencia a escapar como vapor."],"correct":3,"explanation":"Los solutos modifican el estado termodinámico del agua. Al hidratarse y formar interacciones con ella reducen su presión de vapor relativa y, con ello, la actividad de agua.","topic":1},{"id":"T1-Q37","difficulty":"hard","concept":"Conservación","question":"Un alimento se deshidrata parcialmente, pero la aᵥ apenas disminuye al principio. ¿Qué interpretación es más razonable?","options":["La actividad de agua es siempre igual al porcentaje de humedad dividido por cien.","La deshidratación nunca modifica la aᵥ.","La relación entre humedad y aᵥ puede ser no lineal; se puede retirar agua relativamente móvil sin producir al principio un cambio proporcional de aᵥ o viceversa según la zona de la isoterma.","La aᵥ solo cambia cuando se rompen enlaces covalentes."],"correct":2,"explanation":"Las isotermas de sorción describen precisamente una relación no lineal entre agua total y actividad. El efecto de retirar una determinada cantidad de agua depende de cómo esté asociada a la matriz y de la región de la isoterma.","topic":1},{"id":"T1-Q38","difficulty":"hard","concept":"Caso alimentario integrado","question":"Una mermelada y una fruta fresca pueden contener cantidades importantes de agua, pero la mermelada suele tener menor aᵥ. ¿Qué explicación molecular es la más adecuada?","options":["La fruta fresca carece completamente de solutos.","La alta concentración de azúcares establece numerosas interacciones con el agua y reduce su disponibilidad termodinámica.","La aᵥ solo depende de la temperatura de cocción pasada, nunca de la composición actual.","El azúcar hace que el agua pierda sus electrones y se convierta en H₂."],"correct":1,"explanation":"Una concentración elevada de azúcares disminuye la presión de vapor relativa del agua y su actividad. Por eso, una matriz puede contener bastante agua total y, sin embargo, presentar una fracción menos disponible.","topic":1},{"id":"T1-Q39","difficulty":"hard","concept":"Estructura-propiedad","question":"¿Cuál de estas cadenas causales está mejor construida para explicar una propiedad alimentaria?","options":["Fuerzas de London inexistentes → aceite polar → miscibilidad total con agua.","Mayor electronegatividad → desaparición de todos los electrones → ausencia de enlaces → gelificación.","Enlace metálico en el agua → electrones libres → reducción de actividad de agua.","Grupos polares en un polisacárido → puentes de hidrógeno con agua → hidratación y retención de agua → aumento de viscosidad."],"correct":3,"explanation":"La primera cadena conecta correctamente estructura molecular, interacción no covalente y consecuencia macroscópica. Es el tipo de razonamiento estructura → interacción → propiedad que se busca en Química de los Alimentos.","topic":1},{"id":"T1-Q40","difficulty":"hard","concept":"Integración del tema","question":"Un tecnólogo observa que una formulación rica en agua, azúcar y polisacáridos se vuelve más viscosa y presenta menor aᵥ tras aumentar la concentración de sólidos. ¿Qué explicación integra mejor ambos fenómenos?","options":["Aumentan las interacciones entre agua y grupos polares de los solutos; parte del agua queda menos móvil y menos disponible, lo que puede elevar la viscosidad y reducir su presión de vapor relativa.","Todos los polisacáridos se ionizan completamente y expulsan el agua del sistema.","La disminución de aᵥ demuestra necesariamente que el contenido de agua es cero.","El agua se transforma en una red metálica y por eso aumenta la viscosidad."],"correct":0,"explanation":"Una mayor concentración de solutos hidrófilos incrementa las interacciones con el agua y reduce su movilidad. La misma reorganización del sistema puede contribuir a propiedades reológicas más marcadas y a una menor actividad de agua.","topic":1},{"id":"T2-Q01","difficulty":"medium","concept":"Química orgánica","question":"¿Qué rasgo estructural justifica que una molécula se estudie dentro de la química orgánica?","options":["Que posea un esqueleto de carbono unido principalmente mediante enlaces covalentes.","Que proceda obligatoriamente de un ser vivo.","Que sea siempre insoluble en agua.","Que contenga necesariamente nitrógeno."],"correct":0,"explanation":"La química orgánica estudia principalmente compuestos cuyo esqueleto se basa en átomos de carbono unidos mediante enlaces covalentes simples, dobles o triples.","topic":2},{"id":"T2-Q02","difficulty":"medium","concept":"Isomería de posición","question":"1-pentanol y 2-pentanol tienen la misma fórmula molecular, pero el grupo –OH ocupa posiciones distintas. ¿Qué isomería presentan?","options":["De posición.","De cadena.","De función.","Óptica."],"correct":0,"explanation":"La isomería de posición aparece cuando cambia la localización de un grupo funcional o de una insaturación sin cambiar la fórmula molecular.","topic":2},{"id":"T2-Q03","difficulty":"medium","concept":"Isomería de función","question":"Etanol y dimetiléter poseen la misma fórmula molecular, pero uno es alcohol y el otro éter. ¿Qué tipo de isomería explica esta diferencia?","options":["Isomería de función.","Isomería de cadena.","Isomería isotópica.","Isomería geométrica."],"correct":0,"explanation":"En la isomería de función una misma fórmula molecular corresponde a grupos funcionales distintos y, por ello, a propiedades diferentes.","topic":2},{"id":"T2-Q04","difficulty":"hard","concept":"Estereoisomería","question":"Dos moléculas presentan la misma fórmula y la misma conectividad, pero difieren en la orientación espacial de sus átomos. ¿Cómo se clasifican?","options":["Estereoisómeros.","Homopolímeros.","Electrófilos.","Isótopos."],"correct":0,"explanation":"La estereoisomería conserva la conectividad entre átomos, pero cambia su disposición tridimensional; incluye, entre otras, la isomería geométrica y la óptica.","topic":2},{"id":"T2-Q05","difficulty":"hard","concept":"Isomería cis-trans","question":"¿Por qué un doble enlace C=C puede originar isómeros cis/trans?","options":["Porque restringe la rotación de los sustituyentes alrededor del doble enlace.","Porque elimina todos los electrones π.","Porque convierte a los carbonos en iones libres.","Porque permite rotación completa sin coste energético."],"correct":0,"explanation":"La imposibilidad de rotación libre alrededor del doble enlace permite disposiciones espaciales diferentes de los sustituyentes.","topic":2},{"id":"T2-Q06","difficulty":"medium","concept":"Nucleófilos y electrófilos","question":"¿Qué descripción corresponde mejor a un nucleófilo?","options":["Especie con carga negativa o pares de electrones disponibles para formar enlace.","Especie que solo puede aceptar protones y nunca electrones.","Molécula sin electrones de valencia.","Compuesto necesariamente aromático."],"correct":0,"explanation":"Un nucleófilo dispone de densidad electrónica —por carga negativa o por pares de electrones libres— capaz de participar en la formación de enlaces.","topic":2},{"id":"T2-Q07","difficulty":"hard","concept":"Resonancia","question":"En una molécula con varias estructuras resonantes, ¿qué interpretación es correcta?","options":["La estructura real es un híbrido con electrones deslocalizados.","La molécula oscila físicamente entre estructuras aisladas.","Cada estructura resonante corresponde a un compuesto diferente.","La resonancia elimina los enlaces covalentes."],"correct":0,"explanation":"Las estructuras resonantes son representaciones límite; la molécula real presenta deslocalización electrónica y propiedades del híbrido.","topic":2},{"id":"T2-Q08","difficulty":"hard","concept":"Ruptura de enlace","question":"Una ruptura de enlace produce dos radicales, cada uno con un electrón procedente del enlace original. ¿Qué ruptura ha ocurrido?","options":["Homolítica.","Heterolítica.","Condensación.","Neutralización."],"correct":0,"explanation":"En la fisión homolítica el par electrónico se reparte de forma simétrica y se generan radicales.","topic":2},{"id":"T2-Q09","difficulty":"medium","concept":"Reacciones orgánicas","question":"Tras romperse un doble enlace, dos nuevos grupos se incorporan a los carbonos que lo formaban. ¿Qué tipo de reacción es?","options":["Adición.","Eliminación.","Sustitución.","Hidrólisis."],"correct":0,"explanation":"La reacción de adición consume una insaturación y añade grupos a los carbonos previamente unidos por el enlace múltiple.","topic":2},{"id":"T2-Q10","difficulty":"hard","concept":"Condensación","question":"Un ácido carboxílico reacciona con un alcohol y se forman un éster y agua. ¿Qué tipo de proceso describe mejor esta transformación?","options":["Es una condensación porque dos moléculas se unen con eliminación de una molécula pequeña.","Es una eliminación que no forma enlace nuevo.","Es una fisión homolítica.","Es exclusivamente una reacción ácido-base sin cambio covalente."],"correct":0,"explanation":"La esterificación es una reacción de condensación: se forma un nuevo enlace y se elimina una molécula pequeña, en este caso agua.","topic":2},{"id":"T2-Q11","difficulty":"medium","concept":"Alcoholes y éteres","question":"A igualdad aproximada de masa molecular, ¿por qué un alcohol suele hervir a mayor temperatura que un éter comparable?","options":["Porque el alcohol puede formar puentes de hidrógeno intermoleculares entre sus moléculas.","Porque el éter es siempre iónico.","Porque el alcohol carece de oxígeno.","Porque el éter posee necesariamente más carbonos."],"correct":0,"explanation":"El grupo –OH permite establecer puentes de hidrógeno entre moléculas de alcohol, aumentando la cohesión intermolecular.","topic":2},{"id":"T2-Q12","difficulty":"hard","concept":"Cadena carbonada y solubilidad","question":"En una serie de alcoholes con un único –OH, ¿qué tendencia se espera al aumentar mucho la longitud de la cadena carbonada?","options":["Disminuye la solubilidad en agua porque aumenta la contribución hidrofóbica.","Aumenta indefinidamente la solubilidad por conservar el –OH.","La polaridad desaparece por completo en el primer carbono añadido.","Todos se convierten en ácidos fuertes."],"correct":0,"explanation":"El –OH favorece la hidratación, pero una cadena hidrocarbonada cada vez mayor aumenta el carácter hidrofóbico global.","topic":2},{"id":"T2-Q13","difficulty":"medium","concept":"Aldehídos y cetonas","question":"¿Qué diferencia estructural básica distingue a un aldehído de una cetona?","options":["El aldehído presenta el carbonilo en un extremo unido a H; la cetona lo sitúa entre grupos carbonados.","La cetona carece de oxígeno.","El aldehído contiene siempre nitrógeno.","La cetona posee necesariamente un grupo –COOH."],"correct":0,"explanation":"Ambos contienen C=O, pero cambia la posición y los sustituyentes del carbono carbonílico.","topic":2},{"id":"T2-Q14","difficulty":"hard","concept":"Ésteres y aromas","question":"Una molécula de aroma frutal contiene el motivo R–COO–R'. ¿Qué interpretación es más coherente?","options":["Es un éster, familia frecuente en compuestos aromáticos de frutas.","Es un nitrilo.","Es un alcano puro.","Es una amina primaria."],"correct":0,"explanation":"El grupo –COO– caracteriza a los ésteres, una familia frecuente entre numerosos compuestos responsables de aromas frutales.","topic":2},{"id":"T2-Q15","difficulty":"medium","concept":"Ácidos carboxílicos","question":"¿Qué grupo funcional combina un carbonilo y un hidroxilo y explica el carácter ácido de compuestos como el ácido acético?","options":["Carboxilo –COOH.","Amino –NH2.","Ciano –C≡N.","Éter –O–."],"correct":0,"explanation":"El grupo carboxilo está constituido por C=O y –OH y se representa como –COOH.","topic":2},{"id":"T2-Q16","difficulty":"hard","concept":"Polimerización","question":"¿Qué diferencia conceptual separa una polimerización por adición de una polimerización por condensación?","options":["La condensación elimina moléculas pequeñas durante la unión de monómeros; la adición no requiere esa eliminación.","La adición siempre libera agua y la condensación nunca.","Solo la adición forma enlaces covalentes.","La condensación solo puede ocurrir con hidrocarburos saturados."],"correct":0,"explanation":"En la polimerización por condensación se eliminan moléculas pequeñas durante la unión de monómeros; en la polimerización por adición no es necesario ese proceso.","topic":2},{"id":"T2-Q17","difficulty":"medium","concept":"Clasificación de glúcidos","question":"¿Cuál de las siguientes parejas está correctamente clasificada?","options":["Glucosa: monosacárido; almidón: polisacárido.","Sacarosa: monosacárido; glucosa: polisacárido.","Lactosa: polisacárido; celulosa: disacárido.","Fructosa: oligosacárido; glucógeno: monosacárido."],"correct":0,"explanation":"La glucosa es un monosacárido y el almidón es un polisacárido formado por numerosas unidades de glucosa.","topic":2},{"id":"T2-Q18","difficulty":"medium","concept":"Aldosas y cetosas","question":"¿Qué grupo funcional diferencia de manera básica a una aldosa de una cetosa?","options":["Aldehído frente a cetona.","Éster frente a amida.","Amina frente a nitrilo.","Ácido carboxílico frente a fenol."],"correct":0,"explanation":"Los monosacáridos se clasifican como aldosas cuando presentan función aldehído y como cetosas cuando presentan función cetona.","topic":2},{"id":"T2-Q19","difficulty":"hard","concept":"Isomería de función en glúcidos","question":"Glucosa y fructosa comparten fórmula molecular C6H12O6, pero una es aldosa y la otra cetosa. ¿Qué tipo de isomería explica esta diferencia?","options":["Isomería de función.","Isomería de cadena exclusivamente.","Polimerización por adición.","Fisión homolítica."],"correct":0,"explanation":"Una misma fórmula molecular con distinto grupo funcional constituye un caso de isomería de función.","topic":2},{"id":"T2-Q20","difficulty":"hard","concept":"Ciclación de monosacáridos","question":"¿Por qué glucosa y fructosa pueden formar estructuras cíclicas en disolución?","options":["Porque su grupo carbonilo puede reaccionar intramolecularmente con un grupo –OH de la misma molécula.","Porque pierden todos sus grupos hidroxilo.","Porque se transforman en hidrocarburos.","Porque forman enlaces metálicos internos."],"correct":0,"explanation":"La reacción intramolecular entre el carbonilo y un hidroxilo origina formas cíclicas, que pueden dar anillos tipo furano o pirano.","topic":2},{"id":"T2-Q21","difficulty":"medium","concept":"Anómeros α/β","question":"Al ciclarse un monosacárido aparece un nuevo centro anomérico. ¿Qué distingue las formas α y β en la representación estudiada?","options":["La orientación del –OH del carbono anomérico.","El número total de carbonos.","La presencia o ausencia de oxígeno.","La masa molecular."],"correct":0,"explanation":"La orientación del grupo –OH en el carbono anomérico genera los anómeros α y β.","topic":2},{"id":"T2-Q22","difficulty":"hard","concept":"Estructura y comportamiento","question":"¿Qué ejemplo muestra que una diferencia α/β puede tener consecuencias macroscópicas en alimentos?","options":["Almidón con unidades α-glucosa frente a celulosa con unidades β-glucosa.","Metano frente a etano.","NaCl sólido frente a disuelto.","Etanol frente a metanol por número de carbonos."],"correct":0,"explanation":"La orientación anomérica modifica la arquitectura del polímero y ayuda a explicar comportamientos muy diferentes entre almidón y celulosa.","topic":2},{"id":"T2-Q23","difficulty":"medium","concept":"Enlace O-glucosídico","question":"¿Qué ocurre al formarse un enlace O-glucosídico entre dos monosacáridos?","options":["Se produce una condensación y se elimina una molécula de agua.","Se incorporan dos moléculas de agua.","Se rompe necesariamente un enlace C–C.","Se genera un metal."],"correct":0,"explanation":"El enlace O-glucosídico se forma por condensación entre grupos –OH, con pérdida de una molécula de agua.","topic":2},{"id":"T2-Q24","difficulty":"hard","concept":"Integración química orgánica-glúcidos","question":"La formación de un disacárido mediante un enlace O-glucosídico es un ejemplo de…","options":["aplica el concepto general de condensación de la química orgánica a una transformación de glúcidos.","es una polimerización metálica.","no implica grupos funcionales.","solo depende de fuerzas de London."],"correct":0,"explanation":"La formación del enlace glucosídico aplica una reacción de condensación entre monosacáridos.","topic":2},{"id":"T2-Q25","difficulty":"medium","concept":"Sacarosa","question":"¿Qué dos monosacáridos forman la sacarosa?","options":["Glucosa y fructosa.","Glucosa y galactosa.","Dos glucosas.","Fructosa y ribosa."],"correct":0,"explanation":"La sacarosa está constituida por glucosa y fructosa.","topic":2},{"id":"T2-Q26","difficulty":"medium","concept":"Lactosa","question":"¿Qué combinación describe correctamente la lactosa?","options":["Glucosa + galactosa; su digestión requiere lactasa.","Dos glucosas; su digestión requiere lipasa.","Glucosa + fructosa; su digestión requiere pepsina.","Galactosa + fructosa; no puede hidrolizarse."],"correct":0,"explanation":"La lactosa está formada por glucosa y galactosa y la lactasa cataliza su hidrólisis.","topic":2},{"id":"T2-Q27","difficulty":"hard","concept":"Maltosa","question":"Durante la germinación de cereales se degrada almidón y aumenta la maltosa. ¿Qué estructura de la maltosa explica su origen directo a partir de glucosa?","options":["Dos unidades de glucosa unidas por enlace α(1→4).","Glucosa y fructosa unidas por enlace β(1→2).","Dos galactosas unidas por enlace peptídico.","Una glucosa unida a un ácido graso."],"correct":0,"explanation":"La maltosa está formada por dos unidades de glucosa unidas mediante un enlace α(1→4), por lo que puede originarse durante la hidrólisis del almidón.","topic":2},{"id":"T2-Q28","difficulty":"medium","concept":"Oligosacáridos","question":"¿Qué rasgo caracteriza a los oligosacáridos?","options":["Están formados por un pequeño número de monosacáridos unidos mediante enlaces glucosídicos.","Son exclusivamente lípidos.","Carecen de enlaces covalentes.","Siempre son polímeros de miles de unidades."],"correct":0,"explanation":"Los oligosacáridos contienen pocas unidades de monosacáridos y pueden participar en reconocimiento celular o aparecer unidos a proteínas y lípidos.","topic":2},{"id":"T2-Q29","difficulty":"hard","concept":"Polisacáridos y agua","question":"Un polisacárido aumenta mucho la viscosidad de una dispersión pero no llega a formar gel. ¿Qué interpretación es más adecuada?","options":["Sus cadenas interactúan e inmovilizan agua, pero no forman suficientes zonas de unión tridimensional entre ellas.","No interacciona con el agua en absoluto.","Se ha convertido en un hidrocarburo.","La viscosidad solo puede deberse a una reacción redox."],"correct":0,"explanation":"Puede existir una fuerte interacción con el agua y un aumento de viscosidad sin que se forme una red tridimensional suficientemente conectada para gelificar.","topic":2},{"id":"T2-Q30","difficulty":"hard","concept":"Celulosa","question":"La celulosa posee numerosos grupos –OH y, sin embargo, es muy poco soluble en agua. ¿Cuál es la mejor explicación?","options":["Muchos –OH participan en interacciones internas entre cadenas y en la formación de fibras, reduciendo su hidratación externa.","Los –OH desaparecen por completo.","La celulosa es un metal.","La celulosa no contiene oxígeno."],"correct":0,"explanation":"La red de interacciones internas y la organización fibrosa limitan la hidratación de los grupos hidroxilo y favorecen la insolubilidad.","topic":2},{"id":"T2-Q31","difficulty":"medium","concept":"Almidón: amilosa y amilopectina","question":"¿Cuál es la diferencia estructural principal entre amilosa y amilopectina?","options":["La amilosa es esencialmente lineal con enlaces α(1→4); la amilopectina incorpora ramificaciones α(1→6).","La amilosa es proteína y la amilopectina es lípido.","La amilopectina carece de glucosa.","La amilosa solo contiene enlaces β(1→4)."],"correct":0,"explanation":"El almidón es una mezcla de amilosa, más lineal, y amilopectina, ramificada mediante enlaces α(1→6).","topic":2},{"id":"T2-Q32","difficulty":"hard","concept":"Gelatinización del almidón","question":"Durante el calentamiento de almidón en agua aumenta la viscosidad. ¿Qué secuencia explica mejor la gelatinización?","options":["Se debilitan puentes de hidrógeno del gránulo, entra agua, el gránulo se hincha y se libera amilosa a la dispersión.","Se elimina toda el agua y el almidón cristaliza inmediatamente.","Se rompen todos los enlaces glucosídicos en glucosa.","El almidón se transforma en proteína."],"correct":0,"explanation":"La gelatinización implica pérdida de orden interno, hidratación e hinchamiento del gránulo y liberación de amilosa, con aumento de viscosidad.","topic":2},{"id":"T2-Q33","difficulty":"medium","concept":"Almidones modificados","question":"¿Por qué se modifican industrialmente algunos almidones?","options":["Para obtener propiedades funcionales de textura, solubilidad, estabilidad o gelificación que el almidón nativo no ofrece suficientemente.","Para eliminar todo el carbono.","Para convertirlos obligatoriamente en proteínas.","Para impedir cualquier interacción con agua."],"correct":0,"explanation":"Los almidones se modifican para adaptar propiedades como textura, solubilidad, estabilidad o gelificación a las necesidades del proceso y del producto.","topic":2},{"id":"T2-Q34","difficulty":"hard","concept":"Pectinas","question":"Una formulación debe gelificar con poco azúcar y dispone de Ca2+. ¿Qué tipo de pectina encaja mejor?","options":["Pectina de bajo metoxilo.","Pectina de alto metoxilo, que solo depende de gran cantidad de azúcar y pH bajo.","Celulosa microcristalina como pectina.","Glucógeno."],"correct":0,"explanation":"Las pectinas de bajo metoxilo pueden gelificar en presencia de cationes polivalentes como Ca2+ y en un rango de pH más amplio.","topic":2},{"id":"T2-Q35","difficulty":"medium","concept":"Gomas","question":"¿Qué propiedad explica el uso frecuente de gomas en alimentos?","options":["Su capacidad de interactuar con agua y actuar como espesantes, gelificantes o estabilizantes.","Su incapacidad total para retener agua.","Su naturaleza metálica.","Su volatilidad extrema."],"correct":0,"explanation":"Las gomas interactúan intensamente con el agua y pueden modificar la viscosidad, favorecer la gelificación y estabilizar sistemas alimentarios.","topic":2},{"id":"T2-Q36","difficulty":"hard","concept":"Caramelización","question":"¿Qué situación favorece la caramelización?","options":["Calentar azúcares por encima de su punto de fusión, provocando deshidrataciones y formación de compuestos de color y aroma.","Mantener azúcares a baja temperatura sin transformación.","Mezclar únicamente sal y agua.","Hidrolizar proteínas con pepsina."],"correct":0,"explanation":"La caramelización es una transformación térmica de azúcares que genera deshidratación, productos aromáticos y compuestos coloreados.","topic":2},{"id":"T2-Q37","difficulty":"hard","concept":"Azúcar invertido","question":"¿Por qué la hidrólisis de sacarosa da lugar al denominado azúcar invertido?","options":["Porque la mezcla de glucosa y fructosa resultante cambia el signo global de la rotación óptica respecto a la sacarosa.","Porque se invierte físicamente el recipiente.","Porque se forma únicamente almidón.","Porque desaparecen todos los centros quirales."],"correct":0,"explanation":"El nombre alude al cambio de poder rotatorio tras la hidrólisis de sacarosa a glucosa y fructosa.","topic":2},{"id":"T2-Q38","difficulty":"medium","concept":"Polioles","question":"¿Cómo se forman conceptualmente los polioles a partir de azúcares?","options":["Por reducción del grupo aldehído o cetona a un grupo hidroxilo.","Por oxidación completa a CO2.","Por eliminación de todos los oxígenos.","Por formación de un enlace peptídico."],"correct":0,"explanation":"Los azúcares-alcoholes se obtienen cuando el grupo carbonilo del azúcar se reduce al correspondiente grupo –OH.","topic":2},{"id":"T2-Q39","difficulty":"hard","concept":"Glucósidos y pigmentos","question":"Las antocianinas se describen como glucósidos de antocianidinas. ¿Qué significa químicamente?","options":["Una aglicona pigmentada está unida a un azúcar mediante un enlace glucosídico.","Son hidrocarburos sin oxígeno.","Son proteínas unidas a metales.","Son exclusivamente polisacáridos lineales."],"correct":0,"explanation":"En una antocianina, una aglicona pigmentada —la antocianidina— está unida a uno o más azúcares mediante enlaces glucosídicos.","topic":2},{"id":"T2-Q40","difficulty":"medium","concept":"Fibra alimentaria","question":"¿Qué componentes se consideran habitualmente dentro de la fracción de fibra de origen vegetal?","options":["Celulosa, hemicelulosa, pectinas y gomas; además menciona lignina aunque no es un glúcido.","Solo sacarosa y fructosa.","Únicamente triglicéridos.","Proteínas y aminoácidos exclusivamente."],"correct":0,"explanation":"Entre los componentes de la fibra se incluyen celulosa, hemicelulosas, pectinas y gomas; la lignina suele acompañar a esta fracción aunque químicamente no sea un hidrato de carbono.","topic":2},{"id":"T3-Q01","difficulty":"medium","concept":"Estructura de aminoácidos","question":"¿Qué grupos están unidos al carbono α en la estructura general de un aminoácido?","options":["Un grupo amino, un grupo carboxilo, un H y un radical R.","Dos grupos carboxilo y dos grupos amino.","Un grupo fosfato, un azúcar y una base nitrogenada.","Solo carbono e hidrógeno, sin grupos funcionales."],"correct":0,"explanation":"Un aminoácido α presenta un carbono central unido a un grupo amino, un grupo carboxilo, un hidrógeno y un radical R variable.","topic":3},{"id":"T3-Q02","difficulty":"medium","concept":"Aminoácidos esenciales","question":"¿Qué define a un aminoácido esencial?","options":["El organismo no puede producirlo en cantidad suficiente y debe obtenerlo de los alimentos.","Solo aparece en proteínas animales.","No participa en la síntesis de proteínas.","Carece de grupo amino."],"correct":0,"explanation":"Los aminoácidos esenciales deben proceder de la dieta porque el organismo no los produce de forma suficiente.","topic":3},{"id":"T3-Q03","difficulty":"medium","concept":"Aminoácidos esenciales","question":"¿Cuál de los siguientes es un aminoácido esencial?","options":["Lisina.","Alanina.","Glicina.","Serina."],"correct":0,"explanation":"La lisina es uno de los nueve aminoácidos esenciales, junto con histidina, isoleucina, leucina, metionina, fenilalanina, treonina, triptófano y valina.","topic":3},{"id":"T3-Q04","difficulty":"hard","concept":"Punto isoeléctrico","question":"Si el pH del medio es menor que el punto isoeléctrico (pI) de un aminoácido, ¿qué forma predomina?","options":["La forma protonada o catiónica.","La forma aniónica.","Una molécula necesariamente neutra y apolar.","Una forma sin grupo carboxilo."],"correct":0,"explanation":"Cuando pH < pI predomina la forma protonada y la carga neta del aminoácido es positiva.","topic":3},{"id":"T3-Q05","difficulty":"hard","concept":"Punto isoeléctrico","question":"¿Qué sucede con la carga neta de un aminoácido cuando el pH es superior a su pI?","options":["Adquiere carga neta negativa o forma aniónica.","Adquiere siempre carga +2.","Su carga neta permanece obligatoriamente en cero.","Pierde todos sus grupos ionizables."],"correct":0,"explanation":"Cuando pH > pI predomina la forma aniónica y la carga neta del aminoácido es negativa.","topic":3},{"id":"T3-Q06","difficulty":"medium","concept":"Punto isoeléctrico","question":"¿Qué caracteriza al punto isoeléctrico de un aminoácido?","options":["Las cargas positivas y negativas se compensan y la carga neta es cero.","El aminoácido alcanza su máxima carga positiva.","El aminoácido pierde el grupo amino.","El aminoácido se transforma en un lípido."],"correct":0,"explanation":"En el punto isoeléctrico existe igual número de cargas positivas y negativas, por lo que la carga neta es cero.","topic":3},{"id":"T3-Q07","difficulty":"medium","concept":"Carácter anfotérico","question":"¿Qué significa que los aminoácidos tengan naturaleza anfotérica ácido-base?","options":["Pueden comportarse como ácido o como base según las condiciones del medio.","Solo pueden ceder protones.","Solo pueden aceptar protones.","No presentan grupos ionizables."],"correct":0,"explanation":"La naturaleza anfotérica implica que un aminoácido puede comportarse como ácido o como base dependiendo del pH del medio.","topic":3},{"id":"T3-Q08","difficulty":"hard","concept":"Propiedades iónicas","question":"¿Qué propiedad de los aminoácidos libres es coherente con su naturaleza iónica?","options":["Puntos de fusión o descomposición elevados y buena solubilidad en agua.","Puntos de ebullición extremadamente bajos y total insolubilidad en agua.","Ausencia de momento dipolar.","Comportamiento idéntico al de los hidrocarburos apolares."],"correct":0,"explanation":"Su estructura iónica se relaciona con temperaturas de fusión o descomposición relativamente elevadas y con una buena solubilidad en agua.","topic":3},{"id":"T3-Q09","difficulty":"medium","concept":"Enlace peptídico","question":"¿Entre qué grupos se forma el enlace peptídico?","options":["Entre el grupo amino de un aminoácido y el grupo carboxilo de otro.","Entre dos grupos carboxilo.","Entre dos grupos amino.","Entre dos cadenas laterales hidrofóbicas exclusivamente."],"correct":0,"explanation":"El enlace peptídico es un enlace de tipo amida entre el grupo amino de un aminoácido y el grupo carboxilo de otro.","topic":3},{"id":"T3-Q10","difficulty":"hard","concept":"Resonancia del enlace peptídico","question":"¿Qué consecuencia tiene el carácter parcial de doble enlace del enlace peptídico?","options":["Restringe la libre rotación del enlace C–N y limita las conformaciones posibles.","Permite una rotación completamente libre.","Hace que el enlace sea puramente iónico.","Elimina la polaridad del enlace."],"correct":0,"explanation":"La resonancia confiere carácter parcial de doble enlace al C–N peptídico, aumentando su rigidez y restringiendo la rotación.","topic":3},{"id":"T3-Q11","difficulty":"hard","concept":"Polaridad del enlace peptídico","question":"¿Cómo participa el enlace peptídico en los puentes de hidrógeno de las proteínas?","options":["El grupo –NH puede donar H y el grupo –CO puede aceptarlo.","El grupo –CO dona H y el –NH nunca participa.","Solo las cadenas laterales pueden formar puentes de hidrógeno.","El enlace peptídico no es polar."],"correct":0,"explanation":"La polaridad del enlace peptídico permite que el grupo –NH actúe como donador y el grupo –CO como aceptor de puentes de hidrógeno.","topic":3},{"id":"T3-Q12","difficulty":"medium","concept":"Configuración cis/trans","question":"En la configuración trans del enlace peptídico, ¿cómo se sitúan los dos carbonos α?","options":["A lados opuestos del enlace peptídico.","En el mismo lado del enlace peptídico.","Fusionados en un único carbono.","Sin relación espacial definida."],"correct":0,"explanation":"En la configuración cis los dos carbonos α quedan al mismo lado; en la configuración trans se sitúan a lados opuestos.","topic":3},{"id":"T3-Q13","difficulty":"medium","concept":"Estructura primaria","question":"¿Qué define la estructura primaria de una proteína?","options":["La secuencia y el orden de sus aminoácidos.","La asociación de varias subunidades.","La disposición tridimensional final de todos sus átomos.","Solo la presencia de puentes disulfuro."],"correct":0,"explanation":"La estructura primaria corresponde al número, identidad y orden de los aminoácidos en la cadena polipeptídica.","topic":3},{"id":"T3-Q14","difficulty":"medium","concept":"Estructura secundaria","question":"¿Qué interacción estabiliza de forma fundamental la estructura secundaria de las proteínas?","options":["Puentes de hidrógeno entre grupos –CO– y –NH– del esqueleto peptídico.","Enlaces metálicos.","Enlaces glucosídicos.","Interacciones entre triglicéridos."],"correct":0,"explanation":"La estructura secundaria surge del plegamiento estabilizado por puentes de hidrógeno entre grupos del enlace peptídico.","topic":3},{"id":"T3-Q15","difficulty":"hard","concept":"α-hélice","question":"En una α-hélice, ¿entre qué grupos se establece el patrón característico de puentes de hidrógeno?","options":["Entre el –NH de un residuo y el –C=O del cuarto aminoácido que le sigue.","Entre dos grupos R de cisteína únicamente.","Entre dos grupos carboxilo consecutivos.","Entre moléculas de lípidos vecinas."],"correct":0,"explanation":"La α-hélice se estabiliza por numerosos puentes de hidrógeno entre el –NH de un residuo y el –C=O del cuarto residuo siguiente.","topic":3},{"id":"T3-Q16","difficulty":"hard","concept":"Lámina β","question":"¿Qué descripción corresponde a la conformación β o lámina plegada?","options":["Cadenas dispuestas en forma de zig-zag y estabilizadas por puentes de hidrógeno entre grupos –C=O y –NH.","Una única cadena convertida en red iónica.","Una hélice formada exclusivamente por enlaces disulfuro.","Una estructura sin puentes de hidrógeno."],"correct":0,"explanation":"La lámina β presenta una disposición en zig-zag y se estabiliza mediante puentes de hidrógeno entre grupos –C=O y –NH de segmentos vecinos.","topic":3},{"id":"T3-Q17","difficulty":"hard","concept":"Colágeno","question":"¿Qué rasgo estructural distingue al colágeno?","options":["Presenta una triple hélice asociada a abundancia de glicina, prolina e hidroxiprolina.","Está formado por una única α-hélice sin asociación entre cadenas.","Es una proteína globular soluble típica.","Carece de estructura secundaria."],"correct":0,"explanation":"El colágeno presenta una estructura helicoidal especial formada por tres cadenas asociadas y es rico en glicina, prolina e hidroxiprolina.","topic":3},{"id":"T3-Q18","difficulty":"medium","concept":"Estructura terciaria","question":"¿Qué representa la estructura terciaria de una proteína?","options":["La disposición tridimensional global de todos los átomos de una cadena polipeptídica.","Solo la secuencia de aminoácidos.","La unión de monosacáridos.","La cantidad total de nitrógeno."],"correct":0,"explanation":"La estructura terciaria es la organización tridimensional de la cadena y determina en gran medida la interacción con ligandos y las propiedades biológicas.","topic":3},{"id":"T3-Q19","difficulty":"hard","concept":"Estabilización terciaria","question":"¿Qué conjunto de interacciones puede estabilizar la estructura terciaria?","options":["Puentes de hidrógeno, atracciones electrostáticas, interacciones hidrofóbicas/Van der Waals y puentes disulfuro.","Solo enlaces glucosídicos.","Solo fuerzas gravitatorias.","Únicamente enlaces metálicos."],"correct":0,"explanation":"La estructura terciaria puede estabilizarse mediante puentes de hidrógeno, atracciones electrostáticas, interacciones hidrofóbicas, fuerzas de Van der Waals y puentes disulfuro.","topic":3},{"id":"T3-Q20","difficulty":"medium","concept":"Puentes disulfuro","question":"¿Entre qué residuos se forman los puentes disulfuro?","options":["Entre dos cisteínas mediante sus grupos tiol –SH.","Entre dos glicinas.","Entre lisina y leucina exclusivamente.","Entre dos grupos carboxilo."],"correct":0,"explanation":"Los puentes disulfuro son enlaces covalentes entre grupos tiol de dos residuos de cisteína.","topic":3},{"id":"T3-Q21","difficulty":"medium","concept":"Proteínas globulares y fibrosas","question":"¿Cuál de estas comparaciones entre proteínas globulares y fibrosas es correcta?","options":["Las globulares suelen ser más solubles y funcionales; las fibrosas suelen ser insolubles y estructurales.","Las globulares son siempre insolubles y las fibrosas siempre enzimáticas.","Ambas tienen necesariamente idéntica función.","Las fibrosas están formadas por lípidos."],"correct":0,"explanation":"Las proteínas globulares suelen ser más solubles y desempeñar funciones dinámicas; queratina, colágeno y elastina son ejemplos de proteínas fibrosas con función estructural.","topic":3},{"id":"T3-Q22","difficulty":"medium","concept":"Estructura cuaternaria","question":"¿Cuándo se habla de estructura cuaternaria?","options":["Cuando una proteína está formada por más de una cadena polipeptídica asociada.","Cuando una cadena presenta un único aminoácido.","Cuando se rompe el enlace peptídico.","Cuando la proteína pierde agua."],"correct":0,"explanation":"La estructura cuaternaria corresponde a la asociación de varias cadenas o subunidades polipeptídicas en una proteína oligomérica.","topic":3},{"id":"T3-Q23","difficulty":"hard","concept":"Desnaturalización","question":"¿Qué niveles estructurales pueden perderse durante la desnaturalización sin que necesariamente se hidrolice el enlace peptídico?","options":["Secundario, terciario y cuaternario, manteniéndose la estructura primaria.","Solo el primario.","Únicamente la composición elemental.","Ninguno: desnaturalizar significa siempre hidrolizar."],"correct":0,"explanation":"La desnaturalización puede alterar las estructuras secundaria, terciaria y cuaternaria sin implicar necesariamente la hidrólisis del enlace peptídico ni la pérdida de la estructura primaria.","topic":3},{"id":"T3-Q24","difficulty":"medium","concept":"Desnaturalización térmica","question":"¿Por qué el calentamiento puede aumentar la digestibilidad de ciertas proteínas alimentarias?","options":["Porque puede desnaturalizar las proteínas y también inhibidores de proteasas presentes en leguminosas.","Porque transforma las proteínas en hidratos de carbono.","Porque elimina todos los aminoácidos esenciales.","Porque siempre rompe todos los enlaces peptídicos."],"correct":0,"explanation":"El calentamiento puede desplegar proteínas y desnaturalizar inhibidores de proteasas presentes en algunas leguminosas, facilitando su digestión.","topic":3},{"id":"T3-Q25","difficulty":"hard","concept":"Desnaturalización por pH","question":"¿Cómo pueden los cambios extremos de pH desestabilizar una proteína?","options":["Modificando la ionización de las cadenas laterales y alterando puentes salinos que estabilizan la conformación nativa.","Aumentando únicamente la masa molecular.","Formando enlaces metálicos nuevos.","Eliminando todos los átomos de oxígeno."],"correct":0,"explanation":"Los cambios de pH alteran la carga de grupos laterales y pueden impedir interacciones electrostáticas o puentes salinos esenciales para la estructura nativa.","topic":3},{"id":"T3-Q26","difficulty":"hard","concept":"Desnaturalización mecánica","question":"¿Por qué una fuerte agitación o esfuerzo cortante puede afectar a proteínas multiméricas?","options":["Puede desdoblar estructuras oligoméricas y romper interacciones que mantienen su organización.","Convierte los aminoácidos en minerales.","Forma automáticamente enlaces glucosídicos.","No puede producir ningún cambio estructural."],"correct":0,"explanation":"Los esfuerzos cortantes y la agitación intensa pueden desorganizar interacciones que mantienen la estructura de proteínas, especialmente las multiméricas.","topic":3},{"id":"T3-Q27","difficulty":"hard","concept":"Funcionalidad y desnaturalización","question":"¿Por qué una desnaturalización parcial puede mejorar en ciertos casos el espumado o la emulsificación?","options":["Porque el desplegamiento puede exponer zonas hidrofóbicas que favorecen la adsorción y estabilización en interfases.","Porque elimina toda interacción con agua y aceite.","Porque transforma la proteína en almidón.","Porque hace desaparecer todos los radicales R."],"correct":0,"explanation":"El desplegamiento parcial puede exponer zonas hidrofóbicas capaces de adsorberse en interfases y mejorar la estabilización de emulsiones o espumas.","topic":3},{"id":"T3-Q28","difficulty":"medium","concept":"Emulsiones","question":"¿Qué elementos básicos se necesitan para formular una emulsión?","options":["Aceite, agua, un emulsificante y energía, normalmente mecánica.","Solo agua y azúcar.","Únicamente aire y una proteína.","Solo aceite y sal."],"correct":0,"explanation":"Una emulsión requiere dos fases inmiscibles —por ejemplo, aceite y agua—, un emulsificante y un aporte de energía para dispersarlas.","topic":3},{"id":"T3-Q29","difficulty":"hard","concept":"Propiedades emulsificantes","question":"¿Por qué las proteínas pueden actuar como surfactantes en emulsiones aceite/agua?","options":["Porque poseen actividad superficial y pueden formar una película que dificulta la coalescencia de las gotas.","Porque son totalmente insolubles en agua.","Porque convierten el aceite en una sustancia iónica.","Porque destruyen la interfase entre fases."],"correct":0,"explanation":"Las proteínas se adsorben en la interfase y ayudan a estabilizar las gotas frente a la coalescencia.","topic":3},{"id":"T3-Q30","difficulty":"hard","concept":"Leche homogeneizada","question":"¿Qué cambio ayuda a explicar la mayor estabilidad al cremado de la leche homogeneizada?","options":["Los glóbulos de grasa quedan recubiertos por una película de caseína y proteínas de suero más resistente.","Desaparecen todas las proteínas de la leche.","La grasa se transforma químicamente en agua.","Se destruye toda interfase grasa-agua."],"correct":0,"explanation":"Tras la homogeneización, las proteínas lácteas contribuyen a recubrir y estabilizar los glóbulos de grasa, aumentando la estabilidad del sistema.","topic":3},{"id":"T3-Q31","difficulty":"medium","concept":"Espumas","question":"¿Cómo se describe una espuma alimentaria?","options":["Una fase continua acuosa que contiene una fase gaseosa dispersa.","Una fase continua gaseosa con cristales metálicos.","Dos fases sólidas exclusivamente.","Una disolución verdadera de aire en aceite."],"correct":0,"explanation":"Una espuma presenta una fase continua, normalmente acuosa, y una fase gaseosa dispersa, como ocurre en merengues, mousses o malvaviscos.","topic":3},{"id":"T3-Q32","difficulty":"hard","concept":"Estabilización de espumas","question":"¿Qué papel desempeñan las proteínas en la interfase aire-agua de una espuma?","options":["Forman una película o lamela que ayuda a estabilizar las burbujas de aire.","Eliminan por completo el aire.","Solo aumentan el color del alimento.","Se convierten necesariamente en grasa."],"correct":0,"explanation":"Las proteínas son agentes de actividad superficial y forman películas en la interfase líquido-gas que contribuyen a la formación y estabilidad de la espuma.","topic":3},{"id":"T3-Q33","difficulty":"hard","concept":"pH y espuma","question":"¿Por qué puede aumentar la estabilidad de determinadas espumas proteicas cerca del punto isoeléctrico?","options":["Disminuye la repulsión entre proteínas y se favorecen interacciones proteína-proteína que forman una película interfacial viscosa.","La proteína adquiere necesariamente carga infinita.","Desaparecen todas las interacciones entre proteínas.","El agua se vuelve apolar."],"correct":0,"explanation":"Cerca del punto isoeléctrico disminuye la repulsión entre proteínas y pueden favorecerse interacciones proteína-proteína que refuerzan la película interfacial.","topic":3},{"id":"T3-Q34","difficulty":"hard","concept":"Azúcar y espuma","question":"¿Qué efecto puede producir el azúcar en una espuma proteica?","options":["Puede dificultar la formación de espuma pero aumentar su estabilidad al elevar la viscosidad y reducir el drenaje.","Siempre destruye inmediatamente cualquier espuma.","No modifica ninguna propiedad del sistema.","Convierte la proteína en un lípido."],"correct":0,"explanation":"La sacarosa o la lactosa pueden dificultar la formación inicial de espuma, pero aumentar su estabilidad al elevar la viscosidad de la fase continua y reducir el drenaje.","topic":3},{"id":"T3-Q35","difficulty":"hard","concept":"Lípidos y espuma","question":"¿Por qué los lípidos, especialmente fosfolípidos, pueden perjudicar una espuma proteica cuando están presentes en cantidad suficiente?","options":["Compiten con las proteínas por la interfase aire-agua y forman películas menos cohesivas.","Porque aumentan siempre la cantidad de enlaces peptídicos.","Porque eliminan la fase gaseosa mediante una reacción química.","Porque transforman el agua en aceite."],"correct":0,"explanation":"Los lípidos pueden competir con las proteínas por la interfase aire-agua y formar películas menos cohesivas, dificultando la estabilización de la espuma.","topic":3},{"id":"T3-Q36","difficulty":"hard","concept":"Péptidos bioactivos","question":"¿Cuál de las siguientes descripciones corresponde mejor a muchos péptidos bioactivos de alimentos?","options":["Cadenas cortas, a menudo de 2 a 9 aminoácidos, liberadas por proteasas y capaces de ejercer funciones biológicas.","Polisacáridos formados exclusivamente por glucosa.","Lípidos con función exclusivamente energética.","Minerales unidos por enlaces iónicos."],"correct":0,"explanation":"Muchos péptidos bioactivos son cadenas cortas liberadas de proteínas alimentarias por proteólisis y pueden ejercer actividades fisiológicas específicas.","topic":3},{"id":"T3-Q37","difficulty":"medium","concept":"Bacteriocinas","question":"¿Qué bacteriocina se utiliza comercialmente en bioconservación de alimentos?","options":["Nisina, producida por Lactococcus lactis.","Pepsina, producida por el estómago.","Celulosa, producida por plantas.","Amilosa, producida por cereales."],"correct":0,"explanation":"La nisina es una bacteriocina producida por Lactococcus lactis y se utiliza por su actividad antimicrobiana.","topic":3},{"id":"T3-Q38","difficulty":"hard","concept":"Proteínas microbianas","question":"¿Qué característica favorece el uso de micoproteínas filamentosas para elaborar análogos cárnicos?","options":["Sus hifas presentan de forma natural una morfología fibrosa que facilita la texturización.","Carece completamente de proteínas.","Es un polisacárido soluble sin estructura.","Se funde como una grasa a temperatura ambiente."],"correct":0,"explanation":"La morfología fibrosa de las hifas facilita la obtención de una textura masticable semejante a la de productos cárnicos.","topic":3},{"id":"T3-Q39","difficulty":"hard","concept":"Proteínas edulcorantes","question":"¿Qué propiedad estructural ayuda a explicar la elevada resistencia térmica de la taumatina?","options":["La presencia de ocho enlaces disulfuro.","La ausencia total de aminoácidos.","Su composición exclusiva de glucosa.","La falta de estructura tridimensional."],"correct":0,"explanation":"La taumatina contiene varios puentes disulfuro, que contribuyen a estabilizar su estructura frente a la desnaturalización.","topic":3},{"id":"T3-Q40","difficulty":"medium","concept":"Glutamato y umami","question":"¿Qué función alimentaria se atribuye al ácido glutámico y a sus sales?","options":["Actúan como potenciadores del sabor y se relacionan con la percepción umami.","Son agentes gelificantes de almidón.","Se utilizan exclusivamente para aumentar el pH.","Son pigmentos liposolubles."],"correct":0,"explanation":"El ácido glutámico y los glutamatos actúan como potenciadores del sabor y están estrechamente relacionados con la percepción del gusto umami.","topic":3},{"id":"T4-Q01","difficulty":"medium","concept":"Definición de lípidos","question":"¿Qué propiedad de solubilidad caracteriza de forma general a muchos lípidos?","options":["Son insolubles en agua y solubles en disolventes orgánicos como hexano o éter de petróleo.","Son muy solubles en agua y totalmente insolubles en disolventes orgánicos.","Solo se disuelven en soluciones salinas concentradas.","Son siempre solubles tanto en agua como en aceite."],"correct":0,"explanation":"Muchos lípidos presentan baja solubilidad en agua y elevada afinidad por disolventes orgánicos apolares o poco polares.","topic":4},{"id":"T4-Q02","difficulty":"medi
