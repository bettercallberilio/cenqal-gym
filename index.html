um","concept":"Valor energético","question":"¿Qué aporte energético aproximado proporciona 1 g de lípidos?","options":["9 kcal.","4 kcal.","2 kcal.","1 kcal."],"correct":0,"explanation":"Los lípidos aportan aproximadamente 9 kcal por gramo, más del doble que proteínas o hidratos de carbono.","topic":4},{"id":"T4-Q03","difficulty":"medium","concept":"Funciones de los lípidos","question":"¿Cuál de las siguientes es una función relevante de los lípidos en los alimentos?","options":["Contribuir a la textura, las propiedades sensoriales y el aporte energético.","Actuar únicamente como colorantes hidrosolubles.","Impedir cualquier transferencia de calor durante el procesado.","Sustituir siempre a las proteínas como catalizadores."],"correct":0,"explanation":"Las grasas y los aceites influyen en la textura, el sabor, la sensación en boca y el valor energético de los alimentos.","topic":4},{"id":"T4-Q04","difficulty":"medium","concept":"Clasificación","question":"¿Cuál de los siguientes grupos está formado principalmente por lípidos insaponificables?","options":["Esteroles, vitaminas liposolubles, hidrocarburos y pigmentos.","Triacilglicéridos, ceras y fosfolípidos exclusivamente.","Monoacilglicéridos y diacilglicéridos exclusivamente.","Ácidos grasos libres y triacilglicéridos únicamente."],"correct":0,"explanation":"Entre los lípidos insaponificables se incluyen esteroles, ciertas vitaminas, hidrocarburos y pigmentos.","topic":4},{"id":"T4-Q05","difficulty":"medium","concept":"Triacilglicéridos","question":"¿Cómo se forma un triacilglicérido?","options":["Por esterificación del glicerol con tres ácidos grasos.","Por unión de tres aminoácidos a una molécula de glucosa.","Por condensación de tres alcoholes con un fosfato.","Por hidrólisis de un esterol."],"correct":0,"explanation":"Un triacilglicérido es un triéster formado por glicerol esterificado con tres ácidos grasos.","topic":4},{"id":"T4-Q06","difficulty":"hard","concept":"Hidrólisis de triacilglicéridos","question":"¿Qué productos se obtienen por hidrólisis completa de un triacilglicérido?","options":["Glicerol y tres ácidos grasos.","Tres moléculas de glicerol y un ácido graso.","Un esterol y tres alcoholes.","Glucosa y ácidos grasos."],"correct":0,"explanation":"La hidrólisis de los tres enlaces éster libera una molécula de glicerol y tres ácidos grasos.","topic":4},{"id":"T4-Q07","difficulty":"medium","concept":"Ácidos grasos saturados","question":"¿Qué caracteriza a un ácido graso saturado?","options":["Presenta únicamente enlaces sencillos carbono-carbono en su cadena.","Contiene al menos dos dobles enlaces cis.","Presenta necesariamente un triple enlace.","Carece de grupo carboxilo."],"correct":0,"explanation":"Los ácidos grasos saturados no contienen dobles enlaces carbono-carbono en su cadena hidrocarbonada.","topic":4},{"id":"T4-Q08","difficulty":"hard","concept":"Longitud de cadena y fusión","question":"Dentro de una serie de ácidos grasos saturados, ¿qué tendencia se espera al aumentar la longitud de la cadena?","options":["Suele aumentar la temperatura de fusión.","Suele disminuir siempre la temperatura de fusión hasta valores negativos.","La temperatura de fusión no cambia con la longitud de cadena.","Todos pasan a ser gases a temperatura ambiente."],"correct":0,"explanation":"En los ácidos grasos saturados, el aumento de la longitud de cadena incrementa las interacciones de dispersión y suele elevar la temperatura de fusión.","topic":4},{"id":"T4-Q09","difficulty":"hard","concept":"Insaturación y reactividad","question":"¿Por qué los ácidos grasos insaturados son generalmente más reactivos que los saturados?","options":["Porque los dobles enlaces son puntos susceptibles de oxidación, hidrogenación e isomerización.","Porque carecen completamente de electrones π.","Porque no contienen carbono.","Porque sus enlaces C–C sencillos se rompen espontáneamente a temperatura ambiente."],"correct":0,"explanation":"Los dobles enlaces aportan centros de mayor reactividad química y explican procesos como oxidación, hidrogenación e isomerización.","topic":4},{"id":"T4-Q10","difficulty":"medium","concept":"Ácidos grasos esenciales","question":"¿Qué combinación corresponde a los precursores esenciales de las familias omega-3 y omega-6?","options":["Ácido α-linolénico y ácido linoleico.","Ácido palmítico y ácido esteárico.","Ácido oleico y ácido palmítico.","Ácido butírico y ácido láurico."],"correct":0,"explanation":"El ácido α-linolénico es precursor de la familia omega-3 y el ácido linoleico de la familia omega-6.","topic":4},{"id":"T4-Q11","difficulty":"medium","concept":"Omega-3 marinos","question":"¿Cuál de los siguientes ácidos grasos presenta 22 carbonos y 6 insaturaciones?","options":["DHA (22:6).","EPA (20:5).","DPA (22:5).","Ácido oleico (18:1)."],"correct":0,"explanation":"El DHA se representa como 22:6, es decir, posee 22 carbonos y seis dobles enlaces.","topic":4},{"id":"T4-Q12","difficulty":"hard","concept":"Configuración cis","question":"¿Qué efecto estructural suele producir un doble enlace cis en una cadena de ácido graso?","options":["Introduce una curvatura que dificulta el empaquetamiento compacto.","Endereza la cadena y favorece un empaquetamiento idéntico al de una grasa saturada.","Elimina el grupo carboxilo.","Convierte el ácido graso en una molécula iónica."],"correct":0,"explanation":"La configuración cis introduce una desviación en la cadena y reduce la capacidad de empaquetamiento ordenado.","topic":4},{"id":"T4-Q13","difficulty":"hard","concept":"Grasas trans","question":"¿Por qué un ácido graso trans puede comportarse físicamente de forma más parecida a uno saturado que su isómero cis?","options":["Porque su cadena es más recta y puede empaquetarse de forma más compacta.","Porque tiene siempre menos átomos de carbono.","Porque pierde el grupo carboxilo.","Porque se vuelve completamente soluble en agua."],"correct":0,"explanation":"La geometría trans genera cadenas más lineales, favoreciendo el empaquetamiento y una mayor tendencia a la solidez.","topic":4},{"id":"T4-Q14","difficulty":"medium","concept":"Hidrogenación","question":"¿Qué ocurre químicamente durante la hidrogenación de un ácido graso insaturado?","options":["Se añade hidrógeno a uno o más dobles enlaces carbono-carbono.","Se eliminan todos los átomos de hidrógeno de la cadena.","Se incorporan grupos amino.","Se hidroliza obligatoriamente el grupo carboxilo."],"correct":0,"explanation":"La hidrogenación reduce dobles enlaces C=C mediante la adición de hidrógeno.","topic":4},{"id":"T4-Q15","difficulty":"hard","concept":"Hidrogenación parcial","question":"¿Qué transformación no deseada puede acompañar a una hidrogenación parcial?","options":["La isomerización de algunos dobles enlaces cis a trans.","La conversión de todos los lípidos en proteínas.","La formación obligatoria de glucosa.","La desaparición total de los enlaces éster."],"correct":0,"explanation":"Durante la hidrogenación parcial puede producirse isomerización geométrica cis/trans además de la saturación parcial de dobles enlaces.","topic":4},{"id":"T4-Q16","difficulty":"hard","concept":"Hidrogenación selectiva","question":"En una hidrogenación selectiva, ¿qué ácido graso tiende a reaccionar antes?","options":["El que presenta mayor grado de insaturación.","El completamente saturado.","El de menor masa molecular aunque esté saturado.","El que carece de dobles enlaces."],"correct":0,"explanation":"Los ácidos grasos más insaturados suelen reaccionar antes; por ejemplo, el linolénico puede transformarse antes que el linoleico.","topic":4},{"id":"T4-Q17","difficulty":"medium","concept":"Fosfolípidos","question":"¿Qué característica estructural permite a los fosfolípidos actuar en interfases agua-grasa?","options":["Poseen una región hidrófila y otra hidrófoba.","Son totalmente apolares.","Carecen de cadenas hidrocarbonadas.","Son polímeros de glucosa."],"correct":0,"explanation":"Su carácter anfifílico permite orientar la parte polar hacia el agua y la región hidrófoba hacia la fase grasa.","topic":4},{"id":"T4-Q18","difficulty":"medium","concept":"Lecitina","question":"¿Qué propiedad explica el uso de la lecitina como emulsionante alimentario?","options":["Su estructura anfifílica, con una parte hidrófila y otra hidrófoba.","Su completa insolubilidad tanto en agua como en grasa.","Su capacidad exclusiva para formar cristales iónicos.","Su ausencia de grupos polares."],"correct":0,"explanation":"La lecitina puede situarse en la interfase entre fases acuosa y grasa gracias a su doble afinidad.","topic":4},{"id":"T4-Q19","difficulty":"hard","concept":"Mono y diacilglicéridos","question":"Una concentración elevada de monoacilglicéridos y diacilglicéridos en una grasa puede indicar…","options":["Hidrólisis parcial de triacilglicéridos y liberación de ácidos grasos.","Síntesis espontánea de proteínas.","Ausencia total de actividad lipásica.","Conversión del glicerol en glucosa."],"correct":0,"explanation":"Los mono y diacilglicéridos pueden generarse por hidrólisis parcial de los triacilglicéridos, por acción de lipasas o del calor.","topic":4},{"id":"T4-Q20","difficulty":"medium","concept":"Ceras","question":"¿Qué estructura caracteriza a las ceras?","options":["Ésteres de un ácido graso con un alcohol monohidroxilado de cadena larga.","Triésteres de glicerol con tres ácidos grasos.","Polímeros de aminoácidos.","Sales de ácidos grasos con sodio exclusivamente."],"correct":0,"explanation":"Las ceras son ésteres formados por un ácido graso y un alcohol de cadena larga.","topic":4},{"id":"T4-Q21","difficulty":"medium","concept":"Winterización","question":"¿Cuál es el objetivo principal de la winterización de ciertos aceites?","options":["Eliminar fracciones de alto punto de fusión que podrían cristalizar y enturbiar el aceite en frío.","Aumentar el contenido de agua del aceite.","Convertir todos los ácidos grasos cis en trans.","Hidrolizar completamente los triacilglicéridos."],"correct":0,"explanation":"La winterización es una cristalización fraccionada destinada a retirar componentes que precipitarían a baja temperatura.","topic":4},{"id":"T4-Q22","difficulty":"hard","concept":"Modificación de grasas","question":"¿Qué procesos se utilizan para modificar las propiedades físicas de grasas y aceites?","options":["Hidrogenación, interesterificación y fraccionamiento.","Fermentación alcohólica, caramelización y gelatinización.","Proteólisis, coagulación y transaminación.","Solo evaporación de agua."],"correct":0,"explanation":"Estos procesos permiten ajustar punto de fusión, plasticidad, cristalización y estabilidad de sistemas grasos.","topic":4},{"id":"T4-Q23","difficulty":"medium","concept":"Margarinas","question":"¿Qué describe mejor la estructura de una margarina?","options":["Una emulsión agua-en-aceite en la que gotitas acuosas quedan atrapadas en una matriz grasa cristalina.","Una disolución verdadera de aceite en agua.","Una espuma de aire en agua sin grasa.","Un gel de proteínas sin fase lipídica."],"correct":0,"explanation":"La margarina se formula como una emulsión agua-en-aceite cuya fase continua grasa cristaliza y retiene la fase acuosa dispersa.","topic":4},{"id":"T4-Q24","difficulty":"medium","concept":"Shortenings","question":"¿Qué efecto tecnológico buscan las mantecas vegetales o shortenings en productos de panificación?","options":["Interferir en la formación de una red de gluten excesivamente rígida y aportar plasticidad.","Favorecer al máximo el desarrollo de una red rígida de gluten.","Eliminar toda la fase grasa del producto.","Convertir el almidón en proteína."],"correct":0,"explanation":"Las mantecas recubren componentes de la masa, reducen interacciones de la red de gluten y contribuyen a una textura más corta y tierna.","topic":4},{"id":"T4-Q25","difficulty":"medium","concept":"Rancidez hidrolítica","question":"¿Qué ocurre durante la rancidez hidrolítica?","options":["Se rompen enlaces éster y se liberan ácidos grasos.","Se añaden dobles enlaces a los ácidos grasos.","Se forman únicamente esteroles.","Se reducen todos los carbonilos a alcoholes."],"correct":0,"explanation":"La lipólisis rompe enlaces éster de triacilglicéridos o fosfolípidos, liberando ácidos grasos.","topic":4},{"id":"T4-Q26","difficulty":"hard","concept":"Rancidez hidrolítica","question":"¿Qué combinación favorece la hidrólisis de triacilglicéridos durante el procesado?","options":["Agua, altas temperaturas y/o actividad de lipasas.","Ausencia total de agua y temperaturas muy bajas.","Solo presencia de nitrógeno gaseoso.","Eliminación completa de enzimas y humedad."],"correct":0,"explanation":"La hidrólisis puede estar catalizada por lipasas y también verse favorecida por altas temperaturas en presencia de agua.","topic":4},{"id":"T4-Q27","difficulty":"medium","concept":"Rancidez oxidativa","question":"¿Qué componentes lipídicos son especialmente susceptibles a la rancidez oxidativa?","options":["Ácidos grasos insaturados.","Ácidos grasos completamente saturados en condiciones suaves.","Glicerol sin esterificar exclusivamente.","Sales minerales."],"correct":0,"explanation":"La presencia de dobles enlaces aumenta la susceptibilidad de los ácidos grasos a procesos oxidativos.","topic":4},{"id":"T4-Q28","difficulty":"hard","concept":"Insaturación y oxidación","question":"¿Qué relación general existe entre grado de insaturación y velocidad de oxidación de un ácido graso?","options":["A mayor número de dobles enlaces, mayor susceptibilidad a la oxidación.","A mayor número de dobles enlaces, menor reactividad frente al oxígeno.","La insaturación no influye en absoluto.","Solo los ácidos grasos saturados se oxidan."],"correct":0,"explanation":"Los ácidos grasos poliinsaturados se oxidan con mayor facilidad que los monoinsaturados y los saturados.","topic":4},{"id":"T4-Q29","difficulty":"hard","concept":"Productos de oxidación","question":"¿Qué compuestos contribuyen de forma importante al olor típico de una grasa rancia?","options":["Compuestos volátiles de bajo peso molecular como aldehídos y cetonas.","Únicamente triacilglicéridos intactos.","Solo agua y sales minerales.","Polisacáridos de alto peso molecular."],"correct":0,"explanation":"La degradación oxidativa genera productos secundarios volátiles, entre ellos aldehídos y cetonas, responsables de olores y sabores de rancidez.","topic":4},{"id":"T4-Q30","difficulty":"hard","concept":"Oxidación en emulsiones","question":"¿Qué sistema puede estar más expuesto al oxígeno atmosférico por tener la grasa como fase continua?","options":["Una emulsión agua-en-aceite como una margarina.","Una emulsión aceite-en-agua como una mayonesa.","Una disolución acuosa de sacarosa.","Un gel de almidón sin fase grasa."],"correct":0,"explanation":"Cuando la grasa constituye la fase continua, tiene una mayor superficie de contacto con el aire y puede ser más susceptible a la oxidación.","topic":4},{"id":"T4-Q31","difficulty":"hard","concept":"Barreras físicas a la oxidación","question":"¿Por qué una nuez entera puede oxidarse más lentamente que la misma nuez triturada?","options":["La estructura intacta limita el contacto de los lípidos con el oxígeno; al triturarla aumenta el área expuesta.","La trituración elimina todos los ácidos grasos insaturados.","La nuez entera no contiene lípidos.","El oxígeno solo reacciona con proteínas."],"correct":0,"explanation":"La rotura de barreras físicas expone una mayor superficie lipídica al oxígeno y acelera el deterioro oxidativo.","topic":4},{"id":"T4-Q32","difficulty":"medium","concept":"Antioxidantes","question":"¿Cuál es la función principal de un antioxidante en un sistema graso?","options":["Retrasar o inhibir las reacciones de oxidación.","Aumentar deliberadamente la formación de radicales libres.","Hidrolizar los triacilglicéridos.","Eliminar todos los dobles enlaces por hidrogenación."],"correct":0,"explanation":"Los antioxidantes interrumpen o ralentizan las reacciones radicalarias que conducen al deterioro oxidativo.","topic":4},{"id":"T4-Q33","difficulty":"hard","concept":"Mecanismo antioxidante","question":"¿Cómo puede actuar un antioxidante fenólico frente a radicales lipídicos?","options":["Cediendo un átomo de hidrógeno y originando un radical antioxidante menos reactivo.","Aceptando tres grupos carboxilo y formando un triacilglicérido.","Generando más hidroperóxidos para acelerar la reacción.","Hidrolizando los enlaces peptídicos de las proteínas."],"correct":0,"explanation":"Muchos antioxidantes donan hidrógeno a radicales lipídicos o peroxilo, estabilizando la cadena radicalaria.","topic":4},{"id":"T4-Q34","difficulty":"medium","concept":"Antioxidantes sintéticos","question":"¿Cuál de los siguientes compuestos se utiliza como antioxidante sintético en grasas y aceites?","options":["BHT.","Sacarosa.","Cloruro sódico.","Almidón."],"correct":0,"explanation":"BHT, BHA, TBHQ y los galatos son ejemplos de antioxidantes sintéticos empleados en sistemas grasos.","topic":4},{"id":"T4-Q35","difficulty":"medium","concept":"Antioxidantes naturales","question":"¿Cuál de los siguientes puede contribuir de forma natural a la protección frente a la oxidación lipídica?","options":["Tocoferoles y compuestos fenólicos.","Solo cloruro sódico.","Únicamente glucosa.","Celulosa cristalina."],"correct":0,"explanation":"Tocoferoles, tocotrienoles, carotenoides y diversos compuestos fenólicos pueden actuar como antioxidantes naturales.","topic":4},{"id":"T4-Q36","difficulty":"hard","concept":"Secuestrantes de metales","question":"¿Cómo puede un secuestrante reducir la oxidación de una grasa?","options":["Uniendo metales como hierro o cobre y reduciendo su efecto catalítico.","Aumentando la concentración de hierro libre.","Transformando los ácidos grasos en proteínas.","Generando más radicales hidroxilo."],"correct":0,"explanation":"Hierro y cobre pueden catalizar reacciones oxidativas; su secuestro disminuye esa actividad prooxidante.","topic":4},{"id":"T4-Q37","difficulty":"hard","concept":"Índice de peróxidos","question":"¿Qué información aporta principalmente el índice de peróxidos de una grasa?","options":["El grado de formación de productos primarios de oxidación, especialmente hidroperóxidos.","La cantidad total de proteínas del alimento.","El porcentaje exacto de agua libre.","La concentración de glucosa."],"correct":0,"explanation":"El índice de peróxidos se utiliza para estimar la presencia de peróxidos e hidroperóxidos formados en las primeras etapas de la oxidación lipídica.","topic":4},{"id":"T4-Q38","difficulty":"hard","concept":"Fritura","question":"¿Qué conjunto de cambios puede producirse en un aceite durante una fritura prolongada?","options":["Oxidación, hidrólisis, aumento de viscosidad y formación de compuestos volátiles y polímeros.","Solo evaporación de agua sin cambios químicos del aceite.","Conversión completa de los lípidos en proteínas.","Disminución permanente de todos los ácidos grasos libres a cero."],"correct":0,"explanation":"Las altas temperaturas, el oxígeno, el agua del alimento y el uso repetido favorecen múltiples reacciones de deterioro del aceite.","topic":4},{"id":"T4-Q39","difficulty":"hard","concept":"Vitaminas liposolubles","question":"¿Qué consecuencia puede tener la oxidación intensa de una fase grasa sobre vitaminas liposolubles?","options":["Puede favorecer su degradación química, especialmente en presencia de calor y oxígeno.","Las hace necesariamente más estables.","Las convierte en aminoácidos esenciales.","No puede afectarlas porque son insolubles en agua."],"correct":0,"explanation":"Vitaminas liposolubles como A, D, E y K se encuentran en la fase grasa y pueden sufrir alteraciones durante procesos oxidativos o térmicos.","topic":4},{"id":"T4-Q40","difficulty":"hard","concept":"Integración estructura-propiedad","question":"¿Qué cadena causal explica mejor que un aceite rico en ácidos grasos poliinsaturados sea más líquido y, al mismo tiempo, más sensible a la oxidación?","options":["Más dobles enlaces cis → peor empaquetamiento de cadenas y más puntos reactivos → menor tendencia a cristalizar y mayor susceptibilidad oxidativa.","Más dobles enlaces cis → cadenas más rectas y menor reactividad química.","Más saturación → menor empaquetamiento y mayor oxidación.","Mayor contenido de glicerol libre → desaparición de los dobles enlaces."],"correct":0,"explanation":"Las insaturaciones cis dificultan el empaquetamiento ordenado y reducen la temperatura de fusión, pero también aumentan la reactividad frente a la oxidación.","topic":4},{"id":"T5-Q01","difficulty":"medium","concept":"Catálisis enzimática","question":"¿Qué característica distingue a una enzima como catalizador biológico?","options":["Aumenta la velocidad de una reacción sin consumirse de forma neta durante el proceso.","Desplaza necesariamente el equilibrio químico hacia los productos.","Se transforma por completo en producto al finalizar la reacción.","Solo puede actuar una vez sobre una única molécula de sustrato."],"correct":0,"explanation":"Una enzima acelera la reacción y, tras liberar los productos, puede participar en nuevos ciclos catalíticos sin consumirse de forma neta.","topic":5},{"id":"T5-Q02","difficulty":"medium","concept":"Energía de activación","question":"¿Cómo aumenta una enzima la velocidad de una reacción química?","options":["Favoreciendo una vía con menor energía de activación y estabilizando el estado de transición.","Aumentando permanentemente la energía libre de los productos.","Modificando la constante de equilibrio de la reacción.","Elevando siempre la temperatura del sistema."],"correct":0,"explanation":"La catálisis enzimática facilita el acceso al estado de transición y reduce la barrera energética que debe superar la reacción.","topic":5},{"id":"T5-Q03","difficulty":"medium","concept":"Especificidad enzimática","question":"¿Qué explica que una enzima actúe preferentemente sobre determinados sustratos?","options":["La complementariedad química y espacial entre el sustrato y el sitio activo.","La masa total del alimento en el que se encuentra.","La presencia obligatoria de enlaces metálicos en el sustrato.","La capacidad de la enzima para reaccionar con cualquier molécula por igual."],"correct":0,"explanation":"La especificidad depende de las interacciones que pueden establecerse entre el sitio activo y estructuras concretas del sustrato.","topic":5},{"id":"T5-Q04","difficulty":"medium","concept":"Sitio activo","question":"¿Qué es el sitio activo de una enzima?","options":["La región de la proteína que participa directamente en la unión y transformación del sustrato.","Toda la superficie externa de la proteína sin excepción.","Una molécula de agua atrapada en el interior de la enzima.","Una región que solo sirve para mantener unidas varias enzimas."],"correct":0,"explanation":"El sitio activo contiene los grupos que reconocen al sustrato y participan directamente en la catálisis.","topic":5},{"id":"T5-Q05","difficulty":"hard","concept":"Ajuste inducido","question":"¿Qué propone el modelo de ajuste inducido para explicar la unión enzima-sustrato?","options":["La unión del sustrato puede provocar cambios conformacionales que favorecen la catálisis y el estado de transición.","El sitio activo es absolutamente rígido y nunca cambia de conformación.","La enzima destruye primero el sustrato y después lo reconoce.","La especificidad depende únicamente de la masa molecular del sustrato."],"correct":0,"explanation":"El ajuste inducido considera que enzima y sustrato poseen cierta flexibilidad y que su interacción puede reorganizar el sitio activo para favorecer la reacción.","topic":5},{"id":"T5-Q06","difficulty":"hard","concept":"Estructura y actividad","question":"¿Por qué una desnaturalización puede inactivar una enzima?","options":["Porque puede alterar la conformación tridimensional necesaria para organizar correctamente el sitio activo.","Porque aumenta siempre el número de sitios activos.","Porque convierte la proteína en un hidrato de carbono.","Porque elimina únicamente moléculas de agua sin modificar la estructura proteica."],"correct":0,"explanation":"La actividad enzimática depende de una conformación específica; si se altera, los grupos catalíticos pueden dejar de estar en la posición adecuada.","topic":5},{"id":"T5-Q07","difficulty":"medium","concept":"Nomenclatura EC","question":"¿Qué indica el primer dígito del número EC de una enzima?","options":["La clase general de reacción química que cataliza.","El número de aminoácidos de la enzima.","La temperatura óptima de funcionamiento.","El número de moléculas de sustrato transformadas por segundo."],"correct":0,"explanation":"En la clasificación EC, el primer dígito identifica la clase de reacción catalizada; los siguientes especifican subclases y la enzima concreta.","topic":5},{"id":"T5-Q08","difficulty":"medium","concept":"Oxidorreductasas","question":"¿Qué tipo de reacción catalizan las oxidorreductasas?","options":["Reacciones de oxidación-reducción.","Ruptura exclusiva de enlaces mediante agua.","Transferencia de grupos glucosilo únicamente.","Formación exclusiva de enlaces peptídicos."],"correct":0,"explanation":"Las oxidorreductasas intervienen en transferencias de electrones o equivalentes reductores entre moléculas.","topic":5},{"id":"T5-Q09","difficulty":"medium","concept":"Transferasas","question":"¿Qué función caracteriza a las transferasas?","options":["Transfieren grupos químicos desde una molécula donadora a otra aceptora.","Rompen siempre enlaces mediante hidrólisis.","Oxidan exclusivamente ácidos grasos.","Desnaturalizan proteínas por calentamiento."],"correct":0,"explanation":"Las transferasas catalizan el traslado de grupos químicos entre moléculas.","topic":5},{"id":"T5-Q10","difficulty":"medium","concept":"Hidrolasas","question":"¿Qué característica define a las hidrolasas?","options":["Rompen enlaces covalentes mediante la incorporación de una molécula de agua.","Forman únicamente enlaces disulfuro.","Solo catalizan reacciones de oxidación.","Actúan sin reconocer ningún sustrato específico."],"correct":0,"explanation":"Las hidrolasas catalizan reacciones de hidrólisis y entre ellas se incluyen amilasas, proteasas, lipasas y glicosidasas.","topic":5},{"id":"T5-Q11","difficulty":"hard","concept":"Complejo enzima-sustrato","question":"¿Qué papel desempeña el complejo enzima-sustrato en la catálisis?","options":["Constituye una asociación transitoria que facilita alcanzar el estado de transición y formar productos.","Es un producto final irreversible que impide reutilizar la enzima.","Solo aparece cuando la enzima ya está desnaturalizada.","Es una estructura independiente de la concentración de sustrato."],"correct":0,"explanation":"La enzima se une de forma transitoria al sustrato; tras la transformación, libera los productos y recupera su capacidad catalítica.","topic":5},{"id":"T5-Q12","difficulty":"medium","concept":"Saturación enzimática","question":"¿Por qué la velocidad de una reacción enzimática deja de aumentar proporcionalmente cuando la concentración de sustrato es muy alta?","options":["Porque los sitios activos disponibles se encuentran prácticamente ocupados y la enzima se aproxima a la saturación.","Porque el sustrato desaparece por completo del medio.","Porque la enzima cambia necesariamente la constante de equilibrio.","Porque todos los enlaces del sustrato se vuelven covalentes."],"correct":0,"explanation":"Cuando casi todos los sitios activos están ocupados, añadir más sustrato produce cada vez menos incremento de velocidad.","topic":5},{"id":"T5-Q13","difficulty":"medium","concept":"Vmax","question":"¿Qué representa Vmax en una reacción enzimática?","options":["La velocidad límite a la que se aproxima la reacción cuando la enzima está saturada de sustrato.","La concentración de enzima necesaria para detener la reacción.","El pH al que la enzima se desnaturaliza.","La energía de activación de la reacción no catalizada."],"correct":0,"explanation":"Vmax corresponde a la velocidad máxima alcanzable para una cantidad determinada de enzima cuando el sustrato es saturante.","topic":5},{"id":"T5-Q14","difficulty":"hard","concept":"Constante de Michaelis","question":"¿Qué representa la constante KM en una cinética tipo Michaelis-Menten?","options":["La concentración de sustrato a la que la velocidad es la mitad de Vmax.","La cantidad total de producto cuando finaliza la reacción.","La concentración de enzima a la que se alcanza el pH óptimo.","La temperatura a la que la enzima se desnaturaliza."],"correct":0,"explanation":"KM es la concentración de sustrato correspondiente a la mitad de la velocidad máxima.","topic":5},{"id":"T5-Q15","difficulty":"hard","concept":"KM y afinidad","question":"Si dos enzimas actúan sobre el mismo sustrato y una presenta un KM menor, ¿qué interpretación es la más adecuada?","options":["La enzima con menor KM muestra mayor afinidad aparente por el sustrato.","La enzima con menor KM siempre tiene menor Vmax.","La enzima con menor KM está necesariamente desnaturalizada.","KM no guarda ninguna relación con la interacción enzima-sustrato."],"correct":0,"explanation":"Un KM bajo indica que se necesita menor concentración de sustrato para alcanzar la mitad de Vmax, lo que se interpreta como mayor afinidad aparente.","topic":5},{"id":"T5-Q16","difficulty":"medium","concept":"Efecto del pH","question":"¿Por qué el pH puede modificar la actividad de una enzima?","options":["Porque altera el estado de ionización de grupos implicados en la unión, la catálisis y la estabilidad estructural.","Porque cambia exclusivamente la masa molecular de la enzima.","Porque aumenta siempre la concentración de sustrato.","Porque convierte automáticamente todas las enzimas en coenzimas."],"correct":0,"explanation":"Los cambios de pH afectan las cargas de grupos funcionales y pueden modificar tanto el sitio activo como la conformación de la proteína.","topic":5},{"id":"T5-Q17","difficulty":"medium","concept":"pH óptimo","question":"¿Qué significa que una enzima tenga un pH óptimo?","options":["Que en ese intervalo presenta su actividad catalítica máxima bajo las condiciones consideradas.","Que fuera de ese pH la proteína deja de existir inmediatamente.","Que ese pH es idéntico para todas las enzimas.","Que el pH óptimo coincide siempre exactamente con 7."],"correct":0,"explanation":"Cada enzima puede presentar un intervalo de pH en el que la conformación y el estado de ionización son especialmente favorables para la catálisis.","topic":5},{"id":"T5-Q18","difficulty":"hard","concept":"Temperatura y actividad","question":"¿Por qué la actividad enzimática suele aumentar con la temperatura hasta alcanzar un máximo aparente y después disminuir con rapidez?","options":["Porque el aumento térmico acelera la reacción, pero a temperaturas suficientemente altas predomina la desnaturalización de la enzima.","Porque la temperatura reduce continuamente la energía cinética de las moléculas.","Porque la enzima se transforma en sustrato al superar una temperatura fija.","Porque la temperatura solo afecta al agua y nunca a la proteína."],"correct":0,"explanation":"La curva resulta de dos efectos contrapuestos: aumento de la velocidad química con la temperatura y pérdida de estructura por desnaturalización térmica.","topic":5},{"id":"T5-Q19","difficulty":"medium","concept":"Inhibición irreversible","question":"¿Qué caracteriza a una inhibición enzimática irreversible?","options":["El inhibidor inactiva de forma permanente la enzima, a menudo mediante unión covalente a un grupo esencial.","El inhibidor se separa inmediatamente sin modificar la actividad.","El inhibidor es siempre el propio sustrato.","La inhibición desaparece necesariamente al añadir más sustrato."],"correct":0,"explanation":"En la inhibición irreversible se produce una inactivación estable de la enzima, frecuentemente por modificación covalente de grupos funcionales esenciales.","topic":5},{"id":"T5-Q20","difficulty":"hard","concept":"Inhibición competitiva","question":"¿Qué caracteriza a un inhibidor competitivo?","options":["Compite con el sustrato por el acceso al sitio activo debido a cierta semejanza estructural.","Solo puede unirse al complejo enzima-sustrato.","Se une exclusivamente a un sitio alejado y nunca afecta al sitio activo.","Inactiva siempre la enzima mediante un enlace covalente irreversible."],"correct":0,"explanation":"El inhibidor competitivo ocupa el sitio activo e impide temporalmente la unión del sustrato.","topic":5},{"id":"T5-Q21","difficulty":"hard","concept":"Inhibición acompetitiva","question":"¿Qué ocurre en una inhibición acompetitiva o incompetitiva?","options":["El inhibidor se une al complejo enzima-sustrato y forma un complejo inactivo.","El inhibidor solo se une a la enzima libre en el sitio activo.","El inhibidor destruye covalentemente la enzima en todos los casos.","El inhibidor actúa únicamente aumentando la temperatura."],"correct":0,"explanation":"En este tipo de inhibición, el inhibidor se une después de que el sustrato ya está unido y bloquea la formación o liberación de productos.","topic":5},{"id":"T5-Q22","difficulty":"hard","concept":"Inhibición no competitiva","question":"¿Qué describe mejor una inhibición no competitiva?","options":["El inhibidor se une a un sitio diferente del activo y puede interferir con la enzima libre o con el complejo enzima-sustrato.","El inhibidor solo compite con el sustrato por el mismo sitio activo.","El inhibidor es transformado necesariamente en producto.","La inhibición solo aparece cuando no existe sustrato."],"correct":0,"explanation":"La unión en un sitio distinto del activo puede alterar la función catalítica sin requerir competencia directa con el sustrato.","topic":5},{"id":"T5-Q23","difficulty":"medium","concept":"Cofactores","question":"¿Qué es un cofactor enzimático?","options":["Una sustancia no proteica necesaria para la actividad de determinadas enzimas.","Una molécula de sustrato que siempre se transforma en producto.","Una proteína que destruye irreversiblemente todas las enzimas.","Un polisacárido cuya única función es aumentar la viscosidad."],"correct":0,"explanation":"Algunas enzimas requieren componentes no proteicos, como iones metálicos o coenzimas, para ser catalíticamente activas.","topic":5},{"id":"T5-Q24","difficulty":"medium","concept":"Apoenzima y holoenzima","question":"¿Cuál es la diferencia entre apoenzima y holoenzima?","options":["La apoenzima es la parte proteica sin el cofactor necesario; la holoenzima es el complejo catalíticamente activo con su cofactor.","La apoenzima es el producto final y la holoenzima es el sustrato.","La apoenzima siempre contiene un metal y la holoenzima nunca.","Son dos nombres equivalentes para cualquier proteína desnaturalizada."],"correct":0,"explanation":"Cuando una enzima requiere cofactor, la proteína sola se denomina apoenzima y el conjunto funcional apoenzima-cofactor, holoenzima.","topic":5},{"id":"T5-Q25","difficulty":"medium","concept":"Coenzimas","question":"¿Qué función desempeñan muchas coenzimas?","options":["Transportan temporalmente grupos funcionales, átomos o electrones entre moléculas durante la reacción.","Forman siempre la estructura primaria de la enzima.","Actúan exclusivamente como inhibidores irreversibles.","Solo sirven para aumentar la viscosidad del medio."],"correct":0,"explanation":"Las coenzimas participan como intermediarios en la transferencia de grupos químicos o electrones.","topic":5},{"id":"T5-Q26","difficulty":"hard","concept":"Vitaminas y coenzimas","question":"¿Qué relación existe entre vitaminas y coenzimas?","options":["Diversas coenzimas contienen estructuras derivadas de vitaminas o incorporan vitaminas como parte de su molécula.","Todas las vitaminas son enzimas completas.","Las coenzimas nunca contienen estructuras relacionadas con vitaminas.","Las vitaminas sustituyen siempre al sustrato en el sitio activo."],"correct":0,"explanation":"Numerosas vitaminas actúan como precursoras o componentes estructurales de coenzimas.","topic":5},{"id":"T5-Q27","difficulty":"medium","concept":"Uso industrial","question":"¿Qué ventaja tecnológica ofrecen las enzimas en muchos procesos alimentarios?","options":["Pueden actuar con alta especificidad en condiciones moderadas de pH y temperatura.","Requieren siempre temperaturas superiores a 300 °C.","Generan necesariamente gran cantidad de reacciones secundarias.","Solo funcionan a concentraciones muy elevadas."],"correct":0,"explanation":"Su especificidad y su capacidad de actuar en condiciones relativamente suaves permiten transformar materias primas con menor daño colateral.","topic":5},{"id":"T5-Q28","difficulty":"hard","concept":"Control del proceso","question":"¿Qué estrategia permite controlar la velocidad de una transformación enzimática industrial?","options":["Ajustar variables como pH, temperatura y concentración de enzima.","Modificar únicamente el color del alimento.","Aumentar siempre la presión hasta valores extremos.","Eliminar por completo el sustrato antes de iniciar el proceso."],"correct":0,"explanation":"La actividad puede regularse modificando condiciones del medio y la cantidad de catalizador, dentro de los límites compatibles con el alimento.","topic":5},{"id":"T5-Q29","difficulty":"hard","concept":"Aplicación en alimentos","question":"¿Por qué una enzima que funciona muy bien en un ensayo de laboratorio puede rendir de forma distinta en un alimento real?","options":["Porque la matriz alimentaria limita el control de pH, temperatura, fuerza iónica, cofactores, inhibidores y disponibilidad del sustrato.","Porque en los alimentos las enzimas dejan de obedecer principios químicos.","Porque la presencia de agua elimina automáticamente la actividad enzimática.","Porque todas las matrices alimentarias tienen exactamente la misma composición."],"correct":0,"explanation":"Los alimentos son matrices complejas y muchas variables que pueden ajustarse libremente en laboratorio están restringidas durante el procesado real.","topic":5},{"id":"T5-Q30","difficulty":"medium","concept":"Enzimas inmovilizadas","question":"¿Qué ventaja puede aportar la inmovilización de una enzima sobre un soporte?","options":["Facilitar su reutilización y su empleo como biocatalizador en procesos continuos.","Impedir de forma absoluta cualquier contacto con el sustrato.","Convertir la enzima en un lípido insoluble.","Eliminar la necesidad de controlar las condiciones del proceso."],"correct":0,"explanation":"La inmovilización permite recuperar y reutilizar el catalizador y puede facilitar configuraciones de proceso continuo.","topic":5},{"id":"T5-Q31","difficulty":"medium","concept":"Producción microbiana","question":"¿Por qué microorganismos como Aspergillus niger, Aspergillus oryzae o Bacillus subtilis son importantes en tecnología enzimática?","options":["Pueden utilizarse para producir enzimas a escala industrial con rendimientos elevados.","Son los únicos organismos capaces de producir proteínas.","Eliminan la necesidad de purificar cualquier preparación enzimática.","Transforman todas las enzimas en vitaminas."],"correct":0,"explanation":"Diversos microorganismos se emplean como fábricas biológicas para producir enzimas utilizadas en procesos industriales.","topic":5},{"id":"T5-Q32","difficulty":"medium","concept":"Proteasas vegetales","question":"¿Qué efecto tecnológico pueden producir papaína, bromelina o ficina sobre la carne?","options":["Ablandamiento por proteólisis de proteínas del tejido.","Gelatinización directa del almidón muscular.","Oxidación de todos los ácidos grasos.","Síntesis de nuevos polisacáridos estructurales."],"correct":0,"explanation":"Estas proteasas vegetales hidrolizan proteínas del tejido y pueden disminuir la dureza de la carne.","topic":5},{"id":"T5-Q33","difficulty":"medium","concept":"Quimosina","question":"¿Qué función desempeña la quimosina en la elaboración de queso?","options":["Actúa sobre las caseínas y favorece la coagulación de la leche.","Hidroliza exclusivamente la lactosa para formar glucosa.","Oxida los lípidos para generar aroma rancio.","Convierte el almidón en maltodextrinas."],"correct":0,"explanation":"La quimosina es una proteasa que actúa sobre las caseínas y desencadena la coagulación necesaria para formar la cuajada.","topic":5},{"id":"T5-Q34","difficulty":"medium","concept":"α-Amilasa","question":"¿Para qué puede utilizarse una α-amilasa en la industria alimentaria?","options":["Para hidrolizar almidón y obtener dextrinas o materias primas para jarabes.","Para coagular directamente las caseínas de la leche.","Para formar enlaces peptídicos entre proteínas cárnicas.","Para oxidar el ion tiocianato."],"correct":0,"explanation":"Las α-amilasas hidrolizan enlaces del almidón y son fundamentales en la producción de dextrinas y jarabes derivados.","topic":5},{"id":"T5-Q35","difficulty":"hard","concept":"Jarabes de almidón","question":"¿Por qué puede ser útil emplear una α-amilasa termorresistente en el procesado de almidón gelatinizado?","options":["Porque permite mantener actividad catalítica a temperaturas elevadas utilizadas durante la licuefacción del almidón.","Porque las enzimas termorresistentes solo actúan por debajo de 0 °C.","Porque evita por completo la necesidad de agua en la hidrólisis.","Porque convierte directamente el almidón en proteína."],"correct":0,"explanation":"El procesado del almidón puede requerir temperaturas elevadas, por lo que una enzima estable al calor permite realizar la hidrólisis en condiciones compatibles con la gelatinización.","topic":5},{"id":"T5-Q36","difficulty":"medium","concept":"Lisozima","question":"¿Sobre qué estructura bacteriana actúa la lisozima de forma característica?","options":["Sobre el peptidoglicano de la pared celular bacteriana.","Sobre el ADN mediante hidrólisis de nucleótidos.","Sobre los triacilglicéridos de la membrana mediante lipólisis.","Sobre el almidón mediante ruptura de enlaces glucosídicos."],"correct":0,"explanation":"La lisozima hidroliza componentes del peptidoglicano y es especialmente útil frente a bacterias Gram positivas.","topic":5},{"id":"T5-Q37","difficulty":"hard","concept":"Lisozima y Gram negativas","question":"¿Por qué puede mejorar la acción de la lisozima frente a bacterias Gram negativas tras debilitar su membrana externa?","options":["Porque el tratamiento facilita el acceso de la enzima a la capa interna de peptidoglicano.","Porque convierte la lisozima en una lipasa.","Porque elimina completamente la pared celular antes de que actúe la enzima.","Porque transforma las bacterias Gram negativas en levaduras."],"correct":0,"explanation":"La membrana externa dificulta el acceso de la lisozima; al permeabilizarla, la enzima puede alcanzar mejor su sustrato en la pared.","topic":5},{"id":"T5-Q38","difficulty":"hard","concept":"Sistema lactoperoxidasa","question":"¿Qué reacción es esencial para la actividad antimicrobiana del sistema lactoperoxidasa?","options":["La oxidación del tiocianato en presencia de peróxido de hidrógeno para generar especies antimicrobianas.","La hidrólisis de almidón en presencia de calcio.","La reducción de lactosa a ácido láctico.","La formación de enlaces peptídicos entre caseínas."],"correct":0,"explanation":"La lactoperoxidasa utiliza peróxido de hidrógeno para oxidar tiocianato y generar productos con acción antimicrobiana.","topic":5},{"id":"T5-Q39","difficulty":"medium","concept":"Enzimas y alimentos fermentados","question":"¿Cómo pueden intervenir las enzimas microbianas en un alimento fermentado?","options":["Catalizando transformaciones bioquímicas que modifican textura, sabor, aroma o composición del alimento.","Actuando únicamente como pigmentos sin actividad química.","Impedindo cualquier transformación de la materia prima.","Sustituyendo necesariamente a todos los microorganismos del proceso."],"correct":0,"explanation":"Los microorganismos producen enzimas que transforman componentes del alimento y contribuyen a las características finales de los productos fermentados.","topic":5},{"id":"T5-Q40","difficulty":"hard","concept":"Integración tecnológica","question":"Se desea ablandar una carne sin aplicar un tratamiento térmico intenso. ¿Qué estrategia es químicamente coherente?","options":["Utilizar una proteasa adecuada en condiciones de pH y temperatura compatibles, controlando el tiempo para evitar una proteólisis excesiva.","Añadir una α-amilasa para hidrolizar las proteínas miofibrilares.","Aplicar una oxidasa para polimerizar el almidón de la carne.","Eliminar toda el agua para aumentar la actividad de una proteasa."],"correct":0,"explanation":"Una proteasa puede hidrolizar parcialmente proteínas estructurales y reducir la dureza, pero el proceso debe controlarse para conservar una textura adecuada.","topic":5},{"id":"T6-Q01","difficulty":"medium","concept":"Sistemas dispersos","question":"¿Qué criterio permite diferenciar principalmente una disolución, un coloide y una suspensión?","options":["El tamaño de las partículas dispersas.","El color del sistema.","La masa total del recipiente.","El número de elementos químicos presentes."],"correct":0,"explanation":"La diferencia fundamental entre disoluciones, coloides y suspensiones está relacionada con el tamaño de las partículas dispersas y, por tanto, con su comportamiento macroscópico.","topic":6},{"id":"T6-Q02","difficulty":"medium","concept":"Disoluciones","question":"¿Qué caracteriza a una disolución verdadera?","options":["Es una mezcla homogénea a escala molecular o iónica.","Presenta partículas macroscópicas que sedimentan con facilidad.","Puede separarse siempre mediante filtración ordinaria.","Está formada necesariamente por dos líquidos inmiscibles."],"correct":0,"explanation":"En una disolución, el soluto se encuentra distribuido homogéneamente a escala molecular o iónica en el disolvente.","topic":6},{"id":"T6-Q03","difficulty":"medium","concept":"Suspensiones","question":"¿Qué comportamiento es típico de una suspensión de pulpa de fruta en agua?","options":["Las partículas pueden sedimentar con el tiempo y redistribuirse temporalmente al agitar.","Las partículas permanecen disueltas a nivel molecular de forma indefinida.","No puede separarse por filtración o centrifugación.","Presenta siempre una sola fase homogénea."],"correct":0,"explanation":"Las suspensiones contienen partículas relativamente grandes que pueden sedimentar por gravedad y volver a dispersarse tras agitación.","topic":6},{"id":"T6-Q04","difficulty":"medium","concept":"Coloides","question":"¿Qué describe mejor un sistema coloidal?","options":["Un sistema disperso con tamaño de partícula intermedio entre una disolución y una suspensión.","Una mezcla en la que todas las partículas son visibles a simple vista.","Una sustancia pura formada por una sola especie química.","Una disolución en la que el soluto ha desaparecido químicamente."],"correct":0,"explanation":"Los coloides ocupan un intervalo intermedio de tamaño de partícula y presentan propiedades distintas de las disoluciones verdaderas y las suspensiones.","topic":6},{"id":"T6-Q05","difficulty":"medium","concept":"Efecto Tyndall","question":"¿Qué fenómeno permite evidenciar la presencia de partículas coloidales mediante un haz de luz?","options":["La dispersión de la luz conocida como efecto Tyndall.","La electrólisis espontánea.","La combustión del medio dispersante.","La desaparición completa del haz luminoso por reacción química."],"correct":0,"explanation":"Las partículas coloidales dispersan la luz y hacen visible el trayecto del haz, fenómeno denominado efecto Tyndall.","topic":6},{"id":"T6-Q06","difficulty":"medium","concept":"Geles","question":"¿Qué estructura caracteriza a un gel alimentario?","options":["Una red tridimensional que atrapa una fase líquida en su interior.","Una fase gaseosa totalmente libre de líquido.","Una disolución molecular que no presenta estructura interna.","Una suspensión cuyas partículas sedimentan inmediatamente."],"correct":0,"explanation":"En un gel, una red tridimensional continua proporciona estructura y retiene una cantidad importante de fase líquida.","topic":6},{"id":"T6-Q07","difficulty":"hard","concept":"Estabilidad de suspensiones","question":"¿Qué modificación suele aumentar el tiempo de estabilidad de una suspensión frente a la sedimentación?","options":["Aumentar la viscosidad de la fase continua.","Aumentar mucho el tamaño de las partículas dispersas.","Reducir la viscosidad hasta aproximarla a la del agua.","Favorecer la aglomeración de las partículas."],"correct":0,"explanation":"Una fase continua más viscosa dificulta el movimiento de las partículas y puede retrasar su sedimentación.","topic":6},{"id":"T6-Q08","difficulty":"medium","concept":"Solubilidad","question":"¿Qué se entiende por solubilidad de un soluto en un disolvente?","options":["La cantidad máxima de soluto que puede disolverse en una cantidad dada de disolvente a una temperatura especificada.","La cantidad mínima de disolvente presente en cualquier mezcla.","La velocidad con la que un sólido sedimenta.","La presión necesaria para comprimir una disolución."],"correct":0,"explanation":"La solubilidad expresa la cantidad máxima de soluto que puede permanecer disuelta en unas condiciones determinadas.","topic":6},{"id":"T6-Q09","difficulty":"medium","concept":"Disolución sobresaturada","question":"¿Por qué una disolución sobresaturada es poco estable?","options":["Contiene más soluto disuelto del que corresponde al equilibrio y puede cristalizar el exceso.","Carece totalmente de soluto.","Solo contiene partículas coloidales.","No puede cambiar con la temperatura."],"correct":0,"explanation":"Una disolución sobresaturada contiene una cantidad de soluto superior a la estable en equilibrio, por lo que el exceso puede cristalizar.","topic":6},{"id":"T6-Q10","difficulty":"hard","concept":"Ley de Henry","question":"En una bebida carbonatada cerrada, ¿por qué se mantiene una mayor cantidad de CO₂ disuelto que después de abrirla?","options":["La presión parcial elevada de CO₂ favorece su solubilidad en el líquido.","El CO₂ se transforma químicamente en agua mientras la botella está cerrada.","La presión impide cualquier interacción entre gas y líquido.","Al abrir la botella aumenta la presión parcial de CO₂ sobre el líquido."],"correct":0,"explanation":"A temperatura constante, la solubilidad de un gas aumenta con su presión parcial. Al abrir la botella, la presión disminuye y parte del CO₂ escapa.","topic":6},{"id":"T6-Q11","difficulty":"medium","concept":"Temperatura y gases","question":"¿Qué tendencia general presenta la solubilidad de muchos gases en líquidos cuando aumenta la temperatura?","options":["Disminuye.","Aumenta siempre de forma ilimitada.","Permanece necesariamente constante.","Se hace exactamente igual a la de los sólidos."],"correct":0,"explanation":"En muchos sistemas gas-líquido, el aumento de temperatura favorece la salida del gas de la fase líquida y reduce su solubilidad.","topic":6},{"id":"T6-Q12","difficulty":"medium","concept":"Molaridad","question":"¿Cómo se define la molaridad de una disolución?","options":["Moles de soluto por litro de disolución.","Moles de soluto por kilogramo de disolvente.","Gramos de soluto por mol de disolvente.","Litros de soluto por kilogramo de disolución."],"correct":0,"explanation":"La molaridad se expresa como moles de soluto contenidos en un litro de disolución.","topic":6},{"id":"T6-Q13","difficulty":"medium","concept":"Molalidad","question":"¿Cómo se define la molalidad?","options":["Moles de soluto por kilogramo de disolvente.","Moles de soluto por litro de disolución.","Gramos de disolvente por litro de soluto.","Moles totales por kilogramo de disolución."],"correct":0,"explanation":"La molalidad utiliza como referencia la masa del disolvente: moles de soluto por kilogramo de disolvente.","topic":6},{"id":"T6-Q14","difficulty":"hard","concept":"Molaridad y temperatura","question":"¿Por qué la molalidad es menos sensible a los cambios de temperatura que la molaridad?","options":["Porque se basa en masas, mientras que la molaridad depende del volumen de la disolución.","Porque la molalidad no contiene soluto.","Porque la masa cambia mucho más con la temperatura que el volumen.","Porque la molaridad siempre se expresa en gramos."],"correct":0,"explanation":"La masa apenas cambia con la temperatura, mientras que el volumen de una disolución puede variar por dilatación térmica.","topic":6},{"id":"T6-Q15","difficulty":"medium","concept":"Propiedades coligativas","question":"¿De qué dependen las propiedades coligativas de una disolución ideal diluida?","options":["Del número de partículas de soluto presentes, más que de su identidad química.","Solo del color del soluto.","Exclusivamente de la masa molecular del disolvente.","Únicamente del tipo de recipiente."],"correct":0,"explanation":"Las propiedades coligativas están determinadas por la cantidad efectiva de partículas de soluto en la disolución.","topic":6},{"id":"T6-Q16","difficulty":"hard","concept":"Presión de vapor","question":"¿Qué ocurre con la presión de vapor de un disolvente al añadir un soluto no volátil?","options":["Disminuye respecto a la del disolvente puro.","Aumenta necesariamente por encima de la presión atmosférica.","Permanece idéntica en cualquier concentración.","Se hace cero con cualquier cantidad de soluto."],"correct":0,"explanation":"La presencia de un soluto no volátil reduce la fracción molar del disolvente y, por tanto, su presión de vapor.","topic":6},{"id":"T6-Q17","difficulty":"hard","concept":"Ebulloscopía","question":"¿Por qué una disolución con un soluto no volátil hierve a una temperatura superior a la del disolvente puro?","options":["Porque su presión de vapor es menor y necesita mayor temperatura para igualar la presión externa.","Porque el soluto aumenta directamente la presión atmosférica.","Porque el disolvente deja de evaporarse por completo.","Porque la masa molecular del disolvente se duplica."],"correct":0,"explanation":"Al disminuir la presión de vapor, se requiere una temperatura mayor para que la presión de vapor de la disolución alcance la presión externa.","topic":6},{"id":"T6-Q18","difficulty":"hard","concept":"Crioscopía","question":"¿Qué efecto produce un soluto sobre el punto de congelación del disolvente?","options":["Lo disminuye.","Lo eleva siempre varios cientos de grados.","No lo modifica en ningún caso.","Lo hace coincidir con el punto de ebullición."],"correct":0,"explanation":"La presencia de soluto provoca un descenso crioscópico: la disolución congela a menor temperatura que el disolvente puro.","topic":6},{"id":"T6-Q19","difficulty":"hard","concept":"Ósmosis","question":"A través de una membrana semipermeable que solo deja pasar agua, ¿hacia dónde se produce el flujo neto de disolvente por ósmosis?","options":["Desde la disolución menos concentrada hacia la más concentrada.","Desde la más concentrada hacia la menos concentrada en cualquier circunstancia.","Solo desde la fase gaseosa hacia la líquida.","No existe movimiento de agua en presencia de solutos."],"correct":0,"explanation":"La ósmosis implica el paso neto de disolvente hacia la disolución de mayor concentración de soluto hasta que la diferencia queda compensada.","topic":6},{"id":"T6-Q20","difficulty":"hard","concept":"Deshidratación osmótica","question":"¿Por qué una fruta sumergida en un jarabe muy concentrado puede perder agua?","options":["Porque el gradiente osmótico favorece la salida de agua desde el tejido hacia el medio más concentrado.","Porque el azúcar convierte químicamente el agua en gas.","Porque el jarabe elimina todos los solutos internos de la fruta sin mover agua.","Porque la presión osmótica desaparece al aumentar la concentración."],"correct":0,"explanation":"Una disolución externa concentrada genera una diferencia de potencial osmótico que favorece la transferencia de agua desde el alimento hacia el medio.","topic":6},{"id":"T6-Q21","difficulty":"medium","concept":"Sistema termodinámico","question":"¿Qué es un sistema termodinámico?","options":["La parte del universo que se selecciona como objeto de estudio.","Todo el universo excepto la materia estudiada.","Solo una sustancia gaseosa encerrada en un recipiente.","Una región que no puede intercambiar energía bajo ninguna circunstancia."],"correct":0,"explanation":"El sistema es la porción material elegida para el análisis; el resto constituye el entorno.","topic":6},{"id":"T6-Q22","difficulty":"medium","concept":"Sistemas abiertos y cerrados","question":"¿Qué diferencia a un sistema abierto de uno cerrado?","options":["El abierto puede intercambiar materia y energía; el cerrado intercambia energía pero no materia.","El abierto solo intercambia materia y el cerrado solo materia y energía.","El cerrado no intercambia ni materia ni energía.","No existe ninguna diferencia entre ambos."],"correct":0,"explanation":"Un sistema abierto intercambia materia y energía con el entorno; uno cerrado puede intercambiar energía, pero no materia.","topic":6},{"id":"T6-Q23","difficulty":"medium","concept":"Sistema aislado","question":"¿Qué caracteriza idealmente a un sistema aislado?","options":["No intercambia ni materia ni energía con el entorno.","Intercambia materia pero no energía.","Intercambia energía pero no materia.","Intercambia continuamente materia y calor."],"correct":0,"explanation":"Un sistema aislado se define idealmente por la ausencia de intercambio tanto de materia como de energía.","topic":6},{"id":"T6-Q24","difficulty":"medium","concept":"Variables de estado","question":"¿Cuál de las siguientes magnitudes es una función de estado?","options":["Entalpía.","Calor transferido durante un camino concreto.","Trabajo realizado durante una expansión concreta.","Longitud del recorrido seguido en el proceso."],"correct":0,"explanation":"La entalpía depende únicamente del estado inicial y final; el calor y el trabajo dependen del camino seguido.","topic":6},{"id":"T6-Q25","difficulty":"hard","concept":"Variables intensivas y extensivas","question":"¿Cuál de las siguientes parejas está correctamente clasificada?","options":["Temperatura: intensiva; masa: extensiva.","Masa: intensiva; presión: extensiva.","Volumen: intensiva; densidad: extensiva.","Entalpía total: intensiva; temperatura: extensiva."],"correct":0,"explanation":"La temperatura no depende de la cantidad de materia, mientras que la masa sí aumenta con la cantidad de sistema.","topic":6},{"id":"T6-Q26","difficulty":"hard","concept":"Trabajo presión-volumen","question":"Con la convención W = −PΔV, ¿qué signo tiene el trabajo cuando un gas se expande contra una presión externa?","options":["Negativo, porque el sistema realiza trabajo sobre el entorno.","Positivo, porque el entorno realiza trabajo sobre el sistema.","Cero en cualquier expansión.","Siempre positivo, independientemente de ΔV."],"correct":0,"explanation":"En una expansión ΔV es positiva y, con W = −PΔV, el trabajo resulta negativo: el sistema realiza trabajo sobre el entorno.","topic":6},{"id":"T6-Q27","difficulty":"medium","concept":"Calor específico","question":"¿Qué relación expresa correctamente el calor intercambiado al calentar una sustancia sin cambio de fase?","options":["Q = m·Ce·(Tf − Ti).","Q = P/V.","Q = n/RT.","Q = ΔG + ΔS."],"correct":0,"explanation":"El calor sensible depende de la masa, del calor específico y de la variación de temperatura.","topic":6},{"id":"T6-Q28","difficulty":"medium","concept":"Reacciones exotérmicas","question":"¿Qué caracteriza a una reacción exotérmica?","options":["Libera calor al entorno.","Absorbe calor del entorno como rasgo definitorio.","No intercambia nunca energía.","Presenta necesariamente ΔG positivo."],"correct":0,"explanation":"Una reacción exotérmica desprende energía en forma de calor hacia el entorno.","topic":6},{"id":"T6-Q29","difficulty":"medium","concept":"Primer principio","question":"¿Qué expresa el primer principio de la termodinámica mediante ΔU = Q + W?","options":["La variación de energía interna resulta del calor y del trabajo intercambiados con el entorno.","La energía puede crearse si el sistema recibe calor.","El trabajo y el calor son funciones de estado.","La energía interna es siempre cero."],"correct":0,"explanation":"El primer principio aplica la conservación de la energía: los cambios de energía interna se contabilizan mediante calor y trabajo.","topic":6},{"id":"T6-Q30","difficulty":"medium","concept":"Entalpía","question":"¿Qué interpretación corresponde a una variación de entalpía negativa a presión constante?","options":["El proceso libera calor y es exotérmico.","El proceso absorbe necesariamente calor.","El sistema no intercambia energía.","La reacción es necesariamente no espontánea."],"correct":0,"explanation":"A presión constante, un ΔH negativo indica liberación de calor. Esto no determina por sí solo la espontaneidad.","topic":6},{"id":"T6-Q31","difficulty":"hard","concept":"Entalpía de formación","question":"¿Qué representa la entalpía estándar de formación de un compuesto?","options":["El cambio de entalpía al formar un mol del compuesto a partir de sus elementos en sus estados estándar.","La energía necesaria para evaporar un mol de cualquier líquido.","La energía total absoluta contenida en un mol de sustancia.","El calor liberado al disolver cualquier cantidad de compuesto en agua."],"correct":0,"explanation":"La entalpía estándar de formación se refiere a la formación de un mol de compuesto a partir de sus elementos en condiciones estándar.","topic":6},{"id":"T6-Q32","difficulty":"hard","concept":"Ley de Hess","question":"¿Por qué puede calcularse la entalpía de una reacción sumando las entalpías de varias etapas que conducen al mismo estado final?","options":["Porque la entalpía es una función de estado.","Porque el calor es siempre independiente del camino.","Porque todas las reacciones intermedias tienen ΔH = 0.","Porque la entalpía depende únicamente del tiempo de reacción."],"correct":0,"explanation":"La ley de Hess se basa en que el cambio de entalpía depende solo de los estados inicial y final, no de la ruta seguida.","topic":6},{"id":"T6-Q33","difficulty":"hard","concept":"Cálculo de entalpía","question":"¿Qué expresión se utiliza para obtener la entalpía estándar de una reacción a partir de entalpías estándar de formación?","options":["ΣΔHf°(productos) − ΣΔHf°(reactivos).","ΣΔHf°(reactivos) − ΣΔHf°(productos) en todos los casos.","ΔH = TΔS únicamente.","ΔH = P/V."],"correct":0,"explanation":"La entalpía estándar de reacción se calcula sumando las entalpías de formación de los productos y restando las de los reactivos, con sus coeficientes estequiométricos.","topic":6},{"id":"T6-Q34","difficulty":"medium","concept":"Entropía","question":"¿Qué magnitud termodinámica se utiliza como medida del grado de dispersión o desorden de un sistema?","options":["Entropía.","Molaridad.","Presión osmótica.","Calor específico."],"correct":0,"explanation":"La entropía, S, se emplea para describir el grado de dispersión de la energía y, en el enfoque del material, el desorden del sistema.","topic":6},{"id":"T6-Q35","difficulty":"hard","concept":"Segundo principio","question":"¿Qué condición establece el segundo principio para un proceso espontáneo considerando el universo como sistema aislado?","options":["La entropía total del universo aumenta.","La entropía total del universo disminuye siempre.","La entalpía del sistema debe ser exactamente cero.","El calor intercambiado debe ser necesariamente nulo."],"correct":0,"explanation":"Un proceso espontáneo produce un aumento de la entropía total del universo.","topic":6},{"id":"T6-Q36","difficulty":"hard","concept":"Energía libre de Gibbs","question":"¿Qué expresión relaciona la energía libre de Gibbs con la entalpía y la entropía a temperatura constante?","options":["ΔG = ΔH − TΔS.","ΔG = ΔH + TΔS en todos los casos.","ΔG = Q/W.","ΔG = PΔV."],"correct":0,"explanation":"La energía libre de Gibbs combina los efectos entálpicos y entrópicos mediante ΔG = ΔH − TΔS.","topic":6},{"id":"T6-Q37","difficulty":"hard","concept":"Espontaneidad","question":"A temperatura y presión constantes, ¿qué indica un valor ΔG < 0?","options":["El proceso es termodinámicamente espontáneo en esas condiciones.","El sistema está necesariamente en equilibrio.","El proceso es imposible bajo cualquier condición.","La reacción debe ser endotérmica."],"correct":0,"explanation":"Un ΔG negativo indica espontaneidad termodinámica; ΔG = 0 corresponde al equilibrio y ΔG > 0 a un proceso no espontáneo en el sentido considerado.","topic":6},{"id":"T6-Q38","difficulty":"medium","concept":"Valor energético","question":"¿Qué valores energéticos estándar se asignan aproximadamente a hidratos de carbono, proteínas y lípidos?","options":["4, 4 y 9 kcal/g, respectivamente.","9, 9 y 4 kcal/g, respectivamente.","4, 9 y 4 kcal/g, respectivamente.","1, 1 y 1 kcal/g, respectivamente."],"correct":0,"explanation":"Como valores aproximados se utilizan 4 kcal/g para hidratos de carbono y proteínas, y 9 kcal/g para lípidos.","topic":6},{"id":"T6-Q39","difficulty":"medium","concept":"Metabolismo basal","question":"¿Qué representa la tasa de metabolismo basal?","options":["La energía necesaria para mantener funciones vitales básicas en reposo.","La energía contenida exclusivamente en los lípidos de la dieta.","La cantidad máxima de energía que puede almacenar el hígado.","La energía consumida únicamente durante ejercicio intenso."],"correct":0,"explanation":"La tasa metabólica basal estima la energía necesaria para mantener procesos vitales básicos, como respiración y mantenimiento de la temperatura corporal.","topic":6},{"id":"T6-Q40","difficulty":"hard","concept":"Integración físico-química","question":"Se concentra un jarabe de azúcar por calentamiento. ¿Qué combinación de fenómenos es coherente con el proceso?","options":["Al aumentar la concentración de soluto disminuye la presión de vapor, se eleva el punto de ebullición y el calentamiento requiere intercambio de energía con el entorno.","Al aumentar el soluto aumenta la presión de vapor y disminuye siempre el punto de ebullición.","La concentración no modifica ninguna propiedad termodinámica del agua.","El azúcar elimina el calor específico del sistema y hace imposible la transferencia de energía."],"correct":0,"explanation":"La concentración de un soluto no volátil reduce la presión de vapor y eleva el punto de ebullición; además, el calentamiento implica transferencia de energía, conectando propiedades de disoluciones y termoquímica.","topic":6},{"id":"T7-Q01","difficulty":"medium","concept":"Velocidad de reacción","question":"¿Qué expresa la velocidad de una reacción química?","options":["La variación de la concentración de reactivos o productos por unidad de tiempo.","La energía total almacenada en los reactivos.","La cantidad de catalizador consumida durante la reacción.","El valor de la constante de equilibrio."],"correct":0,"explanation":"La velocidad de reacción cuantifica cómo cambia la concentración de una especie química con el tiempo.","topic":7},{"id":"T7-Q02","difficulty":"hard","concept":"Velocidad instantánea","question":"En una gráfica concentración-tiempo, ¿cómo se obtiene la velocidad instantánea en un momento concreto?","options":["A partir de la pendiente de la tangente a la curva en ese punto.","Dividiendo siempre la concentración inicial entre el tiempo total.","Calculando el área bajo la curva.","Midiendo únicamente la concentración final."],"correct":0,"explanation":"La velocidad instantánea corresponde a la pendiente de la recta tangente a la curva concentración-tiempo en el instante considerado.","topic":7},{"id":"T7-Q03","difficulty":"medium","concept":"Ley de velocidad","question":"Para una reacción cuya ley de velocidad es v = k[A]^m[B]^n, ¿qué representan m y n?","options":["Los órdenes parciales de reacción respecto a A y B.","Los coeficientes estequiométricos obligatoriamente.","Las masas molares de A y B.","Las energías de activación de cada reactivo."],"correct":0,"explanation":"Los exponentes m y n indican cómo influye la concentración de cada reactivo en la velocidad y se determinan experimentalmente.","topic":7},{"id":"T7-Q04","difficulty":"hard","concept":"Orden global","question":"Si una reacción presenta v = k[A]^2[B], ¿cuál es su orden global?","options":["3.","2.","1.","4."],"correct":0,"explanation":"El orden global es la suma de los exponentes de la ley de velocidad: 2 + 1 = 3.","topic":7},{"id":"T7-Q05","difficulty":"hard","concept":"Constante de velocidad","question":"¿Qué afirmación describe correctamente la constante de velocidad k?","options":["Su valor depende de la naturaleza de la reacción y de la temperatura.","Es idéntica para todas las reacciones a una misma concentración.","Depende únicamente de la cantidad inicial de producto.","Siempre tiene unidades de s⁻¹, sea cual sea el orden."],"correct":0,"explanation":"La constante k es característica de una reacción bajo determinadas condiciones y sus unidades dependen del orden global.","topic":7},{"id":"T7-Q06","difficulty":"medium","concept":"Teoría de colisiones","question":"Según la teoría de colisiones, ¿qué debe ocurrir para que un choque entre moléculas sea eficaz?","options":["Debe producirse con energía suficiente y una orientación adecuada.","Basta con que las moléculas estén en el mismo recipiente.","Las moléculas deben tener exactamente la misma masa.","El choque debe ocurrir siempre a presión cero."],"correct":0,"explanation":"No todos los choques generan reacción: es necesario superar la barrera energética y presentar una geometría compatible con la formación y ruptura de enlaces.","topic":7},{"id":"T7-Q07","difficulty":"medium","concept":"Energía de activación","question":"¿Qué representa la energía de activación de una reacción?","options":["La energía mínima necesaria para alcanzar el estado de transición.","La energía total liberada por los productos.","La energía almacenada exclusivamente en el catalizador.","La energía necesaria para desplazar el equilibrio."],"correct":0,"explanation":"La energía de activación es la barrera energética que deben superar los reactivos para alcanzar el estado de transición.","topic":7},{"id":"T7-Q08","difficulty":"hard","concept":"Complejo activado","question":"¿Qué caracteriza al complejo activado o estado de transición?","options":["Es una configuración de alta energía en la que algunos enlaces se están rompiendo y otros comenzando a formarse.","Es siempre un producto estable que puede aislarse fácilmente.","Es un catalizador consumido durante la reacción.","Es el estado de equilibrio final de la reacción."],"correct":0,"explanation":"El estado de transición es una configuración transitoria de alta energía situada entre reactivos y productos.","topic":7},{"id":"T7-Q09","difficulty":"medium","concept":"Concentración y velocidad","question":"¿Por qué un aumento de la concentración de reactivos suele aumentar la velocidad de muchas reacciones?","options":["Porque aumenta la frecuencia de colisiones entre partículas reactantes.","Porque disminuye necesariamente la temperatura del sistema.","Porque elimina la energía de activación.","Porque transforma el equilibrio en irreversible."],"correct":0,"explanation":"Al haber más partículas por unidad de volumen, aumenta la probabilidad de colisiones y, con ello, la frecuencia de choques eficaces.","topic":7},{"id":"T7-Q10","difficulty":"hard","concept":"Temperatura y velocidad","question":"¿Por qué un aumento de temperatura suele acelerar una reacción química?","options":["Porque aumenta la fracción de moléculas con energía suficiente para superar la energía de activación.","Porque reduce a cero la energía cinética molecular.","Porque convierte todos los choques en perfectamente orientados.","Porque hace que la constante de equilibrio sea siempre infinita."],"correct":0,"explanation":"Al aumentar la temperatura se incrementa la energía cinética y una mayor proporción de moléculas puede superar la barrera de activación.","topic":7},{"id":"T7-Q11","difficulty":"hard","concept":"Ecuación de Arrhenius","question":"En términos de la ecuación de Arrhenius, ¿qué efecto produce una disminución de la energía de activación manteniendo constante la temperatura?","options":["Aumenta la constante de velocidad k.","Disminuye necesariamente k.","No modifica k bajo ninguna circunstancia.","Hace que la reacción cambie de productos a reactivos."],"correct":0,"explanation":"Una menor energía de activación aumenta el factor exponencial de Arrhenius y, por tanto, la constante de velocidad.","topic":7},{"id":"T7-Q12","difficulty":"medium","concept":"Catalizadores","question":"¿Cómo actúa un catalizador sobre la velocidad de reacción?","options":["Proporciona una vía alternativa con menor energía de activación.","Aumenta la entalpía de los productos para forzar la reacción.","Modifica permanentemente la constante de equilibrio.","Se consume estequiométricamente en la reacción global."],"correct":0,"explanation":"Un catalizador acelera la reacción al ofrecer una ruta de menor barrera energética y se regenera al final del ciclo catalítico.","topic":7},{"id":"T7-Q13","difficulty":"hard","concept":"Catalizador y equilibrio","question":"¿Qué efecto tiene un catalizador sobre un sistema reversible que ya puede alcanzar el equilibrio?","options":["Acelera tanto la reacción directa como la inversa, pero no cambia la posición del equilibrio.","Desplaza siempre el equilibrio hacia los productos.","Aumenta el valor de Kc aunque la temperatura permanezca constante.","Hace que la reacción inversa sea imposible."],"correct":0,"explanation":"El catalizador modifica la velocidad de llegada al equilibrio, no la composición de equilibrio ni el valor de la constante a una temperatura dada.","topic":7},{"id":"T7-Q14","difficulty":"hard","concept":"Conservación de alimentos","question":"¿Qué fundamento cinético explica que la refrigeración retrase muchas reacciones de deterioro de los alimentos?","options":["La disminución de temperatura reduce la constante de velocidad de muchas reacciones.","La refrigeración hace que todas las reacciones sean termodinámicamente imposibles.","El frío aumenta siempre la energía de activación de la reacción química intrínseca.","La refrigeración elimina de forma instantánea todos los reactivos."],"correct":0,"explanation":"Al disminuir la temperatura, la constante de velocidad suele disminuir y las transformaciones químicas y bioquímicas transcurren más lentamente.","topic":7},{"id":"T7-Q15","difficulty":"medium","concept":"Equilibrio químico","question":"¿Qué caracteriza a un equilibrio químico dinámico?","options":["Las velocidades de las reacciones directa e inversa son iguales aunque ambas continúan ocurriendo.","La reacción directa se detiene por completo.","Las concentraciones de reactivos y productos deben ser iguales.","Todos los reactivos se han transformado en productos."],"correct":0,"explanation":"En equilibrio, las reacciones directa e inversa continúan, pero al tener la misma velocidad las concentraciones macroscópicas permanecen constantes.","topic":7},{"id":"T7-Q16","difficulty":"medium","concept":"Constante Kc","question":"Para aA + bB ⇌ cC + dD, ¿cómo se expresa Kc de forma general?","options":["Kc = [C]^c[D]^d / ([A]^a[B]^b).","Kc = [A][B][C][D].","Kc = ([A]+[B])/([C]+[D]).","Kc = [A]^a[B]^b / ([C]^c[D]^d) siempre."],"correct":0,"explanation":"La constante de equilibrio en concentración se construye con las concentraciones de productos sobre reactivos, elevadas a sus coeficientes estequiométricos.","topic":7},{"id":"T7-Q17","difficulty":"hard","concept":"Cociente de reacción","question":"Si para una mezcla se obtiene Qc < Kc, ¿hacia dónde evolucionará espontáneamente el sistema para alcanzar el equilibrio?","options":["Hacia la formación de productos.","Hacia la formación de reactivos.","No evolucionará porque ya está en equilibrio.","La dirección no puede relacionarse con Qc y Kc."],"correct":0,"explanation":"Cuando Qc es menor que Kc hay, en términos relativos, exceso de reactivos respecto al equilibrio y la reacción avanza hacia productos.","topic":7},{"id":"T7-Q18","difficulty":"hard","concept":"Cociente de reacción","question":"Si Qc > Kc, ¿qué comportamiento se espera?","options":["El sistema evoluciona hacia los reactivos hasta que Qc disminuya a Kc.","El sistema produce más productos indefinidamente.","El sistema ya está necesariamente en equilibrio.","Kc cambia para igualarse a Qc sin que cambie la composición."],"correct":0,"explanation":"Un Qc mayor que Kc indica una proporción de productos superior a la de equilibrio, por lo que la reacción neta se desplaza hacia los reactivos.","topic":7},{"id":"T7-Q19","difficulty":"medium","concept":"Kp","question":"¿Cuándo es especialmente útil expresar el equilibrio mediante Kp?","options":["Cuando intervienen especies gaseosas y se utilizan sus presiones parciales.","Cuando solo existen sólidos puros.","Cuando se desea expresar exclusivamente el pH.","Cuando todos los componentes son líquidos puros."],"correct":0,"explanation":"Kp expresa la composición de equilibrio de sistemas gaseosos en función de las presiones parciales.","topic":7},{"id":"T7-Q20","difficulty":"hard","concept":"Relación Kc-Kp","question":"En una reacción gaseosa ideal con Δn = 0, ¿qué relación se cumple entre Kp y Kc?","options":["Kp = Kc.","Kp siempre es mayor que Kc.","Kp siempre es menor que Kc.","No existe relación entre ambas."],"correct":0,"explanation":"La relación Kp = Kc(RT)^Δn se reduce a Kp = Kc cuando el cambio neto de moles gaseosos es cero.","topic":7},{"id":"T7-Q21","difficulty":"medium","concept":"Le Châtelier","question":"¿Qué predice el principio de Le Châtelier cuando se aumenta la concentración de un reactivo en un sistema en equilibrio?","options":["El sistema tiende a consumir parte del reactivo añadido favoreciendo la reacción directa.","El equilibrio se desplaza necesariamente hacia los reactivos.","La constante Kc aumenta aunque no cambie la temperatura.","La reacción se detiene inmediatamente."],"correct":0,"explanation":"El sistema responde parcialmente a la perturbación consumiendo la especie añadida y estableciendo un nuevo equilibrio.","topic":7},{"id":"T7-Q22","difficulty":"hard","concept":"Presión y equilibrio","question":"En un equilibrio gaseoso, ¿qué efecto suele producir un aumento de presión por disminución de volumen?","options":["Favorece el lado con menor número de moles gaseosos.","Favorece siempre los productos, independientemente de la estequiometría.","Favorece el lado con mayor número de moles gaseosos.","No puede producir ningún desplazamiento."],"correct":0,"explanation":"Al aumentar la presión, el sistema tiende a desplazarse hacia el lado que contiene menos moles de gas.","topic":7},{"id":"T7-Q23","difficulty":"hard","concept":"Temperatura y equilibrio","question":"Si la reacción directa es exotérmica, ¿qué efecto tiene un aumento de temperatura sobre el equilibrio?","options":["Favorece el sentido endotérmico, es decir, la reacción inversa.","Favorece siempre la formación de productos.","No modifica el equilibrio porque la temperatura solo afecta a la velocidad.","Hace que K sea necesariamente igual a 1."],"correct":0,"explanation":"El calor puede interpretarse como producto de una reacción exotérmica; al aumentar la temperatura se favorece el sentido que consume calor.","topic":7},{"id":"T7-Q24","difficulty":"medium","concept":"Equilibrio heterogéneo","question":"¿Qué caracteriza a un equilibrio heterogéneo?","options":["Incluye especies presentes en más de una fase física.","Solo contiene gases ideales.","Todos sus componentes están en una única fase.","No puede alcanzar un estado de equilibrio."],"correct":0,"explanation":"Los equilibrios heterogéneos incluyen componentes en fases diferentes, como un sólido en equilibrio con sus iones en disolución.","topic":7},{"id":"T7-Q25","difficulty":"medium","concept":"Producto de solubilidad","question"
