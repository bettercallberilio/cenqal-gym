um","concept":"Valor energético","question":"¿Qué aporte energético aproximado proporciona 1 g de lípidos?","options":["9 kcal.","4 kcal.","2 kcal.","1 kcal."],"correct":0,"explanation":"Los lípidos aportan aproximadamente 9 kcal por gramo, más del doble que proteínas o hidratos de carbono.","topic":4},{"id":"T4-Q03","difficulty":"medium","concept":"Funciones de los lípidos","question":"¿Cuál de las siguientes es una función relevante de los lípidos en los alimentos?","options":["Contribuir a la textura, las propiedades sensoriales y el aporte energético.","Actuar únicamente como colorantes hidrosolubles.","Impedir cualquier transferencia de calor durante el procesado.","Sustituir siempre a las proteínas como catalizadores."],"correct":0,"explanation":"Las grasas y los aceites influyen en la textura, el sabor, la sensación en boca y el valor energético de los alimentos.","topic":4},{"id":"T4-Q04","difficulty":"medium","concept":"Clasificación","question":"¿Cuál de los siguientes grupos está formado principalmente por lípidos insaponificables?","options":["Esteroles, vitaminas liposolubles, hidrocarburos y pigmentos.","Triacilglicéridos, ceras y fosfolípidos exclusivamente.","Monoacilglicéridos y diacilglicéridos exclusivamente.","Ácidos grasos libres y triacilglicéridos únicamente."],"correct":0,"explanation":"Entre los lípidos insaponificables se incluyen esteroles, ciertas vitaminas, hidrocarburos y pigmentos.","topic":4},{"id":"T4-Q05","difficulty":"medium","concept":"Triacilglicéridos","question":"¿Cómo se forma un triacilglicérido?","options":["Por esterificación del glicerol con tres ácidos grasos.","Por unión de tres aminoácidos a una molécula de glucosa.","Por condensación de tres alcoholes con un fosfato.","Por hidrólisis de un esterol."],"correct":0,"explanation":"Un triacilglicérido es un triéster formado por glicerol esterificado con tres ácidos grasos.","topic":4},{"id":"T4-Q06","difficulty":"hard","concept":"Hidrólisis de triacilglicéridos","question":"¿Qué productos se obtienen por hidrólisis completa de un triacilglicérido?","options":["Glicerol y tres ácidos grasos.","Tres moléculas de glicerol y un ácido graso.","Un esterol y tres alcoholes.","Glucosa y ácidos grasos."],"correct":0,"explanation":"La hidrólisis de los tres enlaces éster libera una molécula de glicerol y tres ácidos grasos.","topic":4},{"id":"T4-Q07","difficulty":"medium","concept":"Ácidos grasos saturados","question":"¿Qué caracteriza a un ácido graso saturado?","options":["Presenta únicamente enlaces sencillos carbono-carbono en su cadena.","Contiene al menos dos dobles enlaces cis.","Presenta necesariamente un triple enlace.","Carece de grupo carboxilo."],"correct":0,"explanation":"Los ácidos grasos saturados no contienen dobles enlaces carbono-carbono en su cadena hidrocarbonada.","topic":4},{"id":"T4-Q08","difficulty":"hard","concept":"Longitud de cadena y fusión","question":"Dentro de una serie de ácidos grasos saturados, ¿qué tendencia se espera al aumentar la longitud de la cadena?","options":["Suele aumentar la temperatura de fusión.","Suele disminuir siempre la temperatura de fusión hasta valores negativos.","La temperatura de fusión no cambia con la longitud de cadena.","Todos pasan a ser gases a temperatura ambiente."],"correct":0,"explanation":"En los ácidos grasos saturados, el aumento de la longitud de cadena incrementa las interacciones de dispersión y suele elevar la temperatura de fusión.","topic":4},{"id":"T4-Q09","difficulty":"hard","concept":"Insaturación y reactividad","question":"¿Por qué los ácidos grasos insaturados son generalmente más reactivos que los saturados?","options":["Porque los dobles enlaces son puntos susceptibles de oxidación, hidrogenación e isomerización.","Porque carecen completamente de electrones π.","Porque no contienen carbono.","Porque sus enlaces C–C sencillos se rompen espontáneamente a temperatura ambiente."],"correct":0,"explanation":"Los dobles enlaces aportan centros de mayor reactividad química y explican procesos como oxidación, hidrogenación e isomerización.","topic":4},{"id":"T4-Q10","difficulty":"medium","concept":"Ácidos grasos esenciales","question":"¿Qué combinación corresponde a los precursores esenciales de las familias omega-3 y omega-6?","options":["Ácido α-linolénico y ácido linoleico.","Ácido palmítico y ácido esteárico.","Ácido oleico y ácido palmítico.","Ácido butírico y ácido láurico."],"correct":0,"explanation":"El ácido α-linolénico es precursor de la familia omega-3 y el ácido linoleico de la familia omega-6.","topic":4},{"id":"T4-Q11","difficulty":"medium","concept":"Omega-3 marinos","question":"¿Cuál de los siguientes ácidos grasos presenta 22 carbonos y 6 insaturaciones?","options":["DHA (22:6).","EPA (20:5).","DPA (22:5).","Ácido oleico (18:1)."],"correct":0,"explanation":"El DHA se representa como 22:6, es decir, posee 22 carbonos y seis dobles enlaces.","topic":4},{"id":"T4-Q12","difficulty":"hard","concept":"Configuración cis","question":"¿Qué efecto estructural suele producir un doble enlace cis en una cadena de ácido graso?","options":["Introduce una curvatura que dificulta el empaquetamiento compacto.","Endereza la cadena y favorece un empaquetamiento idéntico al de una grasa saturada.","Elimina el grupo carboxilo.","Convierte el ácido graso en una molécula iónica."],"correct":0,"explanation":"La configuración cis introduce una desviación en la cadena y reduce la capacidad de empaquetamiento ordenado.","topic":4},{"id":"T4-Q13","difficulty":"hard","concept":"Grasas trans","question":"¿Por qué un ácido graso trans puede comportarse físicamente de forma más parecida a uno saturado que su isómero cis?","options":["Porque su cadena es más recta y puede empaquetarse de forma más compacta.","Porque tiene siempre menos átomos de carbono.","Porque pierde el grupo carboxilo.","Porque se vuelve completamente soluble en agua."],"correct":0,"explanation":"La geometría trans genera cadenas más lineales, favoreciendo el empaquetamiento y una mayor tendencia a la solidez.","topic":4},{"id":"T4-Q14","difficulty":"medium","concept":"Hidrogenación","question":"¿Qué ocurre químicamente durante la hidrogenación de un ácido graso insaturado?","options":["Se añade hidrógeno a uno o más dobles enlaces carbono-carbono.","Se eliminan todos los átomos de hidrógeno de la cadena.","Se incorporan grupos amino.","Se hidroliza obligatoriamente el grupo carboxilo."],"correct":0,"explanation":"La hidrogenación reduce dobles enlaces C=C mediante la adición de hidrógeno.","topic":4},{"id":"T4-Q15","difficulty":"hard","concept":"Hidrogenación parcial","question":"¿Qué transformación no deseada puede acompañar a una hidrogenación parcial?","options":["La isomerización de algunos dobles enlaces cis a trans.","La conversión de todos los lípidos en proteínas.","La formación obligatoria de glucosa.","La desaparición total de los enlaces éster."],"correct":0,"explanation":"Durante la hidrogenación parcial puede producirse isomerización geométrica cis/trans además de la saturación parcial de dobles enlaces.","topic":4},{"id":"T4-Q16","difficulty":"hard","concept":"Hidrogenación selectiva","question":"En una hidrogenación selectiva, ¿qué ácido graso tiende a reaccionar antes?","options":["El que presenta mayor grado de insaturación.","El completamente saturado.","El de menor masa molecular aunque esté saturado.","El que carece de dobles enlaces."],"correct":0,"explanation":"Los ácidos grasos más insaturados suelen reaccionar antes; por ejemplo, el linolénico puede transformarse antes que el linoleico.","topic":4},{"id":"T4-Q17","difficulty":"medium","concept":"Fosfolípidos","question":"¿Qué característica estructural permite a los fosfolípidos actuar en interfases agua-grasa?","options":["Poseen una región hidrófila y otra hidrófoba.","Son totalmente apolares.","Carecen de cadenas hidrocarbonadas.","Son polímeros de glucosa."],"correct":0,"explanation":"Su carácter anfifílico permite orientar la parte polar hacia el agua y la r async function startTraining(topic,mode){
 const bank=qBank(topic); if(bank.length!==40){alert('Este tema todavía no tiene exactamente 40 preguntas.');return}
 const m=await mastery(topic);let pool=bank;
 if(mode==='wrong') pool=bank.filter(q=>m[q.id]?.lastCorrect===false);
 if(mode==='unmastered') pool=bank.filter(q=>!m[q.id]?.mastered);
 if(!pool.length){
   if(mode==='wrong'){alert('No tienes fallos pendientes. ¡Buen trabajo!');return}
   if(mode==='unmastered'){alert('Ya tienes las 40 preguntas dominadas. Puedes entrenarlas de nuevo cuando quieras.');return}
 }
 const session={topic,mode,order:shuffle(pool.map(q=>q.id)),index:0,correct:0,startedAt:Date.now(),roundId:`${Date.now()}-${Math.random().toString(16).slice(2)}`};
 await saveJSON(keySession(topic),session);state.session=session;showCurrent();
}
async function resumeSession(topic){const s=await loadJSON(keySession(topic),null);if(!s||s.index>=s.order.length){return openTopic(topic)}state.topic=topic;state.session=s;showCurrent()}
function getQ(id){return QUESTIONS.find(q=>q.id===id)}
function shuffledView(q){
 const items=q.options.map((text,i)=>({text,correct:i===q.correct}));return shuffle(items);
}
async function showCurrent(){
 const s=state.session;if(!s)return openTopic(state.topic);
 if(s.index>=s.order.length)return finishSession();
 const q=getQ(s.order[s.index]);state.currentQuestion=q;state.answered=false;
 const view=shuffledView(q);state.optionView=view;
 const pct=Math.round((s.index/s.order.length)*100);
 document.getElementById('screen').innerHTML=`<section class="card">
 <div class="progressrow"><span>🏋️ Tema ${s.topic}</span><span>${s.index+1}/${s.order.length}</span></div><div class="progress"><div style="width:${pct}%"></div></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px"><span class="difficulty ${q.difficulty}">${q.difficulty==='hard'?'Nivel alto':'Nivel medio'}</span><span class="pill">${esc(q.concept)}</span></div>
 <div class="question">${esc(q.question)}</div>
 <div class="answers">${view.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answer(${i})"><b>${letters[i]}</b>${esc(o.text)}</button>`).join('')}</div>
 <button class="action secondary" style="margin-top:14px" onclick="pauseTraining()">⏸ Salir y continuar después</button>
 </section>`;
}
async function answer(i){
 if(state.answered)return;state.answered=true;
 const q=state.currentQuestion,s=state.session,chosen=state.optionView[i],isCorrect=chosen.correct;
 const m=await mastery(s.topic), prev=m[q.id]||{correctCount:0,wrongCount:0,streak:0,mastered:false,lastCorrect:null,lastRound:null};
 if(isCorrect){prev.correctCount=(prev.correctCount||0)+1;prev.streak=(prev.lastCorrect===true && prev.lastRound!==s.roundId)?(prev.streak||0)+1:1;prev.lastCorrect=true;prev.lastRound=s.roundId;prev.mastered=prev.streak>=2;s.correct++}
 else{prev.wrongCount=(prev.wrongCount||0)+1;prev.streak=0;prev.lastCorrect=false;prev.lastRound=s.roundId;prev.mastered=false}
 prev.updatedAt=Date.now();m[q.id]=prev;
 await saveJSON(keyMastery(s.topic),m);await saveJSON(keySession(s.topic),s);
 document.querySelectorAll('.answer').forEach((el,idx)=>{el.disabled=true;if(state.optionView[idx].correct)el.classList.add('correct');if(idx===i&&!isCorrect)el.classList.add('wrong')});
 if(isCorrect){notify('success')}else{notify('error')}
 const status=prev.mastered?'🟢 Pregunta dominada':isCorrect?(prev.streak===1?'🟡 Primer acierto: vuelve a demostrarlo en otra vuelta':'🟡 En aprendizaje'):'🔴 Vuelve a entrenamiento';
 const fb=document.createElement('div');fb.className=`feedback ${isCorrect?'good':'bad'}`;fb.innerHTML=`<h3>${isCorrect?'✅ Correcto':'❌ Incorrecto'}</h3><p><b>¿Por qué?</b> ${esc(q.explanation)}</p><div class="concept">${status}</div><button class="action" style="margin-top:13px" onclick="nextQuestion()">${s.index+1>=s.order.length?'🏁 Ver resultado':'Siguiente →'}</button>`;
 document.querySelector('.answers').after(fb);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

}
async function renderProgress(topic){
