:"¿Qué representa Ksp en una sal poco soluble?","options":["La constante de equilibrio asociada a su disolución y a las concentraciones de los iones en equilibrio.","La velocidad con la que precipita cualquier sal.","La constante de acidez de uno de sus iones.","La presión parcial del sólido."],"correct":0,"explanation":"Ksp describe el equilibrio entre un sólido poco soluble y los iones que produce en disolución.","topic":7},{"id":"T7-Q26","difficulty":"medium","concept":"Arrhenius ácido-base","question":"Según la teoría de Arrhenius, ¿qué caracteriza a un ácido en disolución acuosa?","options":["Aumenta la concentración de H⁺ o H₃O⁺ en el medio.","Acepta siempre un par de electrones sin relación con protones.","Produce exclusivamente OH⁻.","Debe ser necesariamente una molécula orgánica."],"correct":0,"explanation":"En el modelo de Arrhenius, los ácidos aumentan la concentración de protones hidratados en agua y las bases aumentan la de OH⁻.","topic":7},{"id":"T7-Q27","difficulty":"medium","concept":"Brønsted-Lowry","question":"¿Cómo se define una base según Brønsted-Lowry?","options":["Como una especie capaz de aceptar un protón.","Como una especie que siempre libera OH⁻ aunque no haya agua.","Como una especie que dona obligatoriamente electrones en una reacción redox.","Como una sustancia que solo puede reaccionar con metales."],"correct":0,"explanation":"La teoría de Brønsted-Lowry define los ácidos como donadores de protones y las bases como aceptores de protones.","topic":7},{"id":"T7-Q28","difficulty":"hard","concept":"Pares conjugados","question":"En la reacción NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, ¿qué pareja constituye un par ácido-base conjugado?","options":["NH₄⁺/NH₃.","NH₃/OH⁻.","H₂O/NH₄⁺.","NH₄⁺/OH⁻."],"correct":0,"explanation":"Un ácido y su base conjugada difieren en un protón; NH₄⁺ pierde H⁺ para convertirse en NH₃.","topic":7},{"id":"T7-Q29","difficulty":"hard","concept":"Teoría de Lewis","question":"¿Qué define a un ácido de Lewis?","options":["Una especie capaz de aceptar un par de electrones.","Una especie que solo dona protones.","Una sustancia que produce necesariamente H⁺ en agua.","Una molécula que siempre contiene hidrógeno."],"correct":0,"explanation":"La definición de Lewis amplía el concepto ácido-base: un ácido acepta un par electrónico y una base lo dona.","topic":7},{"id":"T7-Q30","difficulty":"medium","concept":"pH","question":"¿Cómo se define el pH de una disolución diluida en términos de concentración de protones?","options":["pH = −log[H⁺].","pH = log[H⁺].","pH = [H⁺] × [OH⁻].","pH = 1/[H⁺] sin logaritmo."],"correct":0,"explanation":"El pH se define como el logaritmo decimal negativo de la concentración de protones, en la aproximación habitual para disoluciones diluidas.","topic":7},{"id":"T7-Q31","difficulty":"hard","concept":"pH y concentración","question":"Si una disolución tiene [H⁺] = 1×10⁻³ M, ¿cuál es su pH?","options":["3.","11.","7.","0,001."],"correct":0,"explanation":"pH = −log(10⁻³) = 3.","topic":7},{"id":"T7-Q32","difficulty":"hard","concept":"pH y pOH","question":"A 25 °C, si una disolución tiene pH = 9, ¿cuál es aproximadamente su pOH?","options":["5.","9.","14.","23."],"correct":0,"explanation":"A 25 °C se cumple aproximadamente pH + pOH = 14, por lo que pOH = 5.","topic":7},{"id":"T7-Q33","difficulty":"medium","concept":"Fuerza ácido-base","question":"¿Qué diferencia principal existe entre un ácido fuerte y uno débil en agua?","options":["El ácido fuerte se ioniza prácticamente por completo; el débil establece un equilibrio de ionización parcial.","El ácido débil siempre tiene menor concentración total que el fuerte.","El ácido fuerte contiene más átomos de hidrógeno.","El ácido débil nunca puede disminuir el pH."],"correct":0,"explanation":"La fuerza se refiere al grado de ionización, no a la cantidad total de ácido presente.","topic":7},{"id":"T7-Q34","difficulty":"hard","concept":"Constante Ka","question":"¿Qué indica, en general, un valor de Ka más elevado para una serie de ácidos comparables?","options":["Una mayor tendencia del ácido a donar protones.","Una base conjugada necesariamente más fuerte.","Una menor ionización del ácido.","Un pH obligatoriamente igual a 7."],"correct":0,"explanation":"Una Ka mayor refleja un equilibrio de disociación más desplazado hacia los productos y, por tanto, mayor fuerza ácida.","topic":7},{"id":"T7-Q35","difficulty":"hard","concept":"Ácido y base conjugada","question":"¿Qué relación cualitativa existe entre la fuerza de un ácido y la de su base conjugada?","options":["Cuanto más fuerte es el ácido, más débil es su base conjugada.","Cuanto más fuerte es el ácido, más fuerte es siempre su base conjugada.","No existe ninguna relación.","Un ácido fuerte no posee base conjugada."],"correct":0,"explanation":"La cesión de protones muy favorable por un ácido implica que la especie conjugada resultante tiene poca tendencia a recuperarlos.","topic":7},{"id":"T7-Q36","difficulty":"medium","concept":"Neutralización","question":"¿Qué reacción describe una neutralización ácido-base sencilla entre un ácido fuerte y una base fuerte?","options":["H⁺ + OH⁻ → H₂O.","H₂O → H₂ + O₂ necesariamente.","Na⁺ + Cl⁻ → NaCl(s) siempre.","H⁺ + e⁻ → H·."],"correct":0,"explanation":"En una neutralización fuerte-fuerte, la reacción iónica neta fundamental es la formación de agua a partir de H⁺ y OH⁻.","topic":7},{"id":"T7-Q37","difficulty":"hard","concept":"Punto de equivalencia","question":"¿Qué representa el punto de equivalencia en una valoración ácido-base?","options":["El momento en que las cantidades estequiométricas de ácido y base han reaccionado según la ecuación química.","El instante en que el indicador cambia necesariamente a pH 7.","El punto en que se añade la primera gota de titulante.","El momento en que desaparece todo el disolvente."],"correct":0,"explanation":"El punto de equivalencia es una condición estequiométrica; el pH correspondiente depende de la naturaleza del ácido y la base.","topic":7},{"id":"T7-Q38","difficulty":"hard","concept":"Indicadores ácido-base","question":"¿Qué criterio es esencial para seleccionar un indicador en una valoración ácido-base?","options":["Que su intervalo de cambio de color coincida con la zona de variación brusca de pH próxima al punto de equivalencia.","Que su color inicial sea siempre rojo.","Que tenga el mayor peso molecular posible.","Que reaccione estequiométricamente con todo el analito."],"correct":0,"explanation":"El indicador debe cambiar de color en el intervalo de pH donde la curva de valoración presenta el salto asociado al punto de equivalencia.","topic":7},{"id":"T7-Q39","difficulty":"medium","concept":"Disoluciones reguladoras","question":"¿Qué composición es típica de una disolución tampón?","options":["Un ácido débil y su base conjugada, o una base débil y su ácido conjugado.","Un ácido fuerte y una base fuerte en cantidades exactamente iguales.","Agua pura sin solutos.","Una sal insoluble y un metal."],"correct":0,"explanation":"Los tampones contienen un par conjugado capaz de consumir pequeñas cantidades de H⁺ u OH⁻ y limitar los cambios de pH.","topic":7},{"id":"T7-Q40","difficulty":"hard","concept":"Henderson-Hasselbalch","question":"Para un tampón formado por un ácido débil HA y su base conjugada A⁻, ¿qué ocurre cuando [A⁻] = [HA]?","options":["El pH es igual al pKa.","El pH es siempre 7.","El pH es igual a la Ka.","El tampón pierde completamente su capacidad reguladora."],"correct":0,"explanation":"La ecuación de Henderson-Hasselbalch, pH = pKa + log([A⁻]/[HA]), se reduce a pH = pKa cuando ambas concentraciones son iguales.","topic":7},{"id":"T8-Q01","difficulty":"medium","concept":"Concepto redox","question":"¿Qué caracteriza a una reacción de oxidación-reducción?","options":["Existe transferencia de electrones entre especies químicas.","Existe siempre transferencia de protones sin cambio electrónico.","Todos los reactivos se convierten necesariamente en gases.","La reacción debe ocurrir siempre en presencia de oxígeno molecular."],"correct":0,"explanation":"Una reacción redox implica transferencia de electrones: una especie pierde electrones y otra los gana.","topic":8},{"id":"T8-Q02","difficulty":"medium","concept":"Oxidación","question":"¿Qué ocurre cuando una especie química se oxida?","options":["Pierde electrones.","Gana electrones.","Su número de oxidación disminuye necesariamente.","Se convierte siempre en un anión."],"correct":0,"explanation":"La oxidación corresponde a una pérdida de electrones y suele ir acompañada de un aumento del número de oxidación.","topic":8},{"id":"T8-Q03","difficulty":"medium","concept":"Reducción","question":"¿Qué ocurre cuando una especie química se reduce?","options":["Gana electrones.","Pierde electrones.","Su número de oxidación aumenta necesariamente.","Se transforma siempre en un gas."],"correct":0,"explanation":"La reducción corresponde a una ganancia de electrones y suele implicar una disminución del número de oxidación.","topic":8},{"id":"T8-Q04","difficulty":"medium","concept":"Agente reductor","question":"¿Qué describe correctamente a un agente reductor?","options":["Cede electrones y se oxida durante el proceso.","Acepta electrones y se reduce.","No participa en la transferencia electrónica.","Actúa exclusivamente como catalizador."],"correct":0,"explanation":"El agente reductor dona electrones a otra especie y, por ello, él mismo se oxida.","topic":8},{"id":"T8-Q05","difficulty":"medium","concept":"Agente oxidante","question":"¿Qué describe correctamente a un agente oxidante?","options":["Acepta electrones y se reduce durante el proceso.","Cede electrones y se oxida.","No cambia su estado electrónico.","Siempre es una molécula de oxígeno."],"correct":0,"explanation":"El agente oxidante capta electrones y, como consecuencia, se reduce.","topic":8},{"id":"T8-Q06","difficulty":"hard","concept":"Identificación redox","question":"En la reacción Zn + Cu²⁺ → Zn²⁺ + Cu, ¿qué especie actúa como agente reductor?","options":["Zn.","Cu²⁺.","Zn²⁺.","Cu."],"correct":0,"explanation":"El zinc pasa de Zn a Zn²⁺, por lo que pierde electrones, se oxida y actúa como agente reductor.","topic":8},{"id":"T8-Q07","difficulty":"hard","concept":"Identificación redox","question":"En la reacción Zn + Cu²⁺ → Zn²⁺ + Cu, ¿qué especie actúa como agente oxidante?","options":["Cu²⁺.","Zn.","Zn²⁺.","Cu."],"correct":0,"explanation":"Cu²⁺ gana electrones para convertirse en Cu metálico; por ello se reduce y actúa como agente oxidante.","topic":8},{"id":"T8-Q08","difficulty":"medium","concept":"Número de oxidación","question":"¿Cuál es el número de oxidación de un elemento en su estado elemental, como Zn(s) o O₂(g)?","options":["0.","+1.","−1.","Depende siempre de la temperatura."],"correct":0,"explanation":"Los elementos en estado libre o sin combinar tienen número de oxidación cero.","topic":8},{"id":"T8-Q09","difficulty":"medium","concept":"Número de oxidación","question":"¿Cuál es el número de oxidación de un ion monoatómico?","options":["Coincide con su carga eléctrica.","Es siempre cero.","Es siempre +1.","Es siempre −1."],"correct":0,"explanation":"En un ion monoatómico, el número de oxidación coincide con la carga del ion.","topic":8},{"id":"T8-Q10","difficulty":"hard","concept":"Número de oxidación","question":"¿Cuál es el número de oxidación del azufre en SO₄²⁻ si el oxígeno se considera −2?","options":["+6.","+4.","−2.","+2."],"correct":0,"explanation":"Si x es el número de oxidación del azufre: x + 4(−2) = −2, por lo que x = +6.","topic":8},{"id":"T8-Q11","difficulty":"medium","concept":"Número de oxidación","question":"En un compuesto eléctricamente neutro, ¿qué debe cumplirse con la suma de todos los números de oxidación?","options":["Debe ser igual a 0.","Debe ser igual a +1.","Debe ser igual al número de átomos.","Debe ser siempre negativa."],"correct":0,"explanation":"En una especie neutra, la suma algebraica de los números de oxidación de todos los átomos debe ser cero.","topic":8},{"id":"T8-Q12","difficulty":"hard","concept":"Disproporción","question":"Si una misma especie química se oxida y se reduce simultáneamente dando dos productos distintos, ¿qué tipo de proceso es?","options":["Una reacción de dismutación o desproporción.","Una neutralización ácido-base.","Una precipitación sin cambio redox.","Una hidrólisis."],"correct":0,"explanation":"En una dismutación, una misma especie actúa a la vez como oxidante y como reductora.","topic":8},{"id":"T8-Q13","difficulty":"medium","concept":"Método ion-electrón","question":"¿Cuál es el primer paso conceptual al ajustar una reacción redox mediante semirreacciones?","options":["Separar e identificar las semirreacciones de oxidación y reducción.","Añadir electrones al azar a ambos lados.","Ajustar primero el agua sin identificar cambios de oxidación.","Eliminar todos los iones espectadores antes de analizar la reacción."],"correct":0,"explanation":"El método ion-electrón comienza identificando qué especie se oxida y cuál se reduce y escribiendo ambas semirreacciones por separado.","topic":8},{"id":"T8-Q14","difficulty":"hard","concept":"Ajuste en medio ácido","question":"En el ajuste de una semirreacción en medio ácido, ¿cómo se equilibran habitualmente los átomos de oxígeno?","options":["Añadiendo H₂O al lado que presenta déficit de oxígeno.","Añadiendo electrones al lado con menos oxígeno.","Añadiendo H⁺ al lado con más oxígeno.","Añadiendo OH⁻ únicamente."],"correct":0,"explanation":"En medio ácido, el oxígeno se ajusta con moléculas de agua y el hidrógeno con iones H⁺.","topic":8},{"id":"T8-Q15","difficulty":"hard","concept":"Ajuste en medio ácido","question":"Después de ajustar átomos de O e H en una semirreacción ácida, ¿cómo se equilibra la carga?","options":["Añadiendo electrones al lado adecuado.","Añadiendo moléculas de agua hasta igualar las cargas.","Modificando los subíndices de las fórmulas químicas.","Eliminando todos los iones del medio."],"correct":0,"explanation":"Los electrones se añaden al lado necesario para que la carga total sea igual en ambos miembros de la semirreacción.","topic":8},{"id":"T8-Q16","difficulty":"hard","concept":"Conservación electrónica","question":"Antes de sumar dos semirreacciones redox ajustadas, ¿qué condición debe cumplirse?","options":["El número de electrones cedidos debe ser igual al número de electrones aceptados.","Ambas semirreacciones deben contener el mismo número de moléculas de agua.","Las cargas de cada semirreacción deben ser necesariamente cero.","Ambas deben tener el mismo número de reactivos."],"correct":0,"explanation":"Los electrones deben cancelarse al sumar las semirreacciones, por lo que las cantidades cedidas y aceptadas deben igualarse.","topic":8},{"id":"T8-Q17","difficulty":"hard","concept":"Ajuste en medio básico","question":"¿Qué especie se utiliza de forma característica para ajustar hidrógeno y oxígeno en medio básico?","options":["OH⁻, junto con H₂O.","H⁺ exclusivamente.","Cl⁻ exclusivamente.","Na⁺ exclusivamente."],"correct":0,"explanation":"En medio básico se emplean iones OH⁻ y moléculas de agua para ajustar hidrógeno y oxígeno.","topic":8},{"id":"T8-Q18","difficulty":"medium","concept":"Valoraciones redox","question":"¿Qué determina una valoración redox?","options":["La concentración de una especie oxidante o reductora mediante una reacción electrónica estequiométrica con otra de concentración conocida.","La masa molecular de un gas sin reacción química.","La viscosidad de una disolución.","El punto de ebullición de un disolvente puro."],"correct":0,"explanation":"Las valoraciones redox permiten determinar concentraciones mediante una reacción cuantitativa entre oxidante y reductor.","topic":8},{"id":"T8-Q19","difficulty":"hard","concept":"Punto de equivalencia","question":"En una valoración redox expresada en equivalentes, ¿qué condición define el punto de equivalencia?","options":["Los equivalentes de oxidante son iguales a los equivalentes de reductor.","El volumen de ambas disoluciones es siempre idéntico.","El potencial de la disolución es necesariamente cero.","La concentración de ambas especies es siempre la misma."],"correct":0,"explanation":"En el punto de equivalencia se han mezclado cantidades estequiométricamente equivalentes de oxidante y reductor.","topic":8},{"id":"T8-Q20","difficulty":"medium","concept":"Indicadores redox","question":"¿Cómo funciona un indicador redox?","options":["Presenta colores distintos en sus formas oxidada y reducida.","Cambia de color únicamente al variar la temperatura.","Solo reacciona con ácidos fuertes.","Mide directamente la masa del analito."],"correct":0,"explanation":"Los indicadores redox cambian de color al modificarse su estado de oxidación, permitiendo detectar el punto final de la valoración.","topic":8},{"id":"T8-Q21","difficulty":"hard","concept":"Valoración potenciométrica","question":"¿Qué ventaja presenta una valoración potenciométrica frente a un indicador visual en una muestra coloreada o turbia?","options":["El punto final puede detectarse mediante un cambio brusco de potencial sin depender de la observación del color.","No necesita electrodos.","No requiere que ocurra una reacción química.","El potencial permanece constante durante toda la valoración."],"correct":0,"explanation":"La potenciometría detecta el cambio de potencial y puede utilizarse incluso cuando el color o la turbidez dificultan un indicador visual.","topic":8},{"id":"T8-Q22","difficulty":"hard","concept":"Ecuación de Nernst","question":"¿Qué permite relacionar la ecuación de Nernst, E = E° − (RT/nF) ln Q?","options":["El potencial real de un electrodo con el potencial estándar y la composición del sistema.","La velocidad de reacción con la energía de activación.","El pH con la concentración de OH⁻ únicamente.","La masa depositada con el tiempo de electrólisis sin considerar carga."],"correct":0,"explanation":"La ecuación de Nernst corrige el potencial estándar en función de la temperatura, los electrones transferidos y el cociente de reacción.","topic":8},{"id":"T8-Q23","difficulty":"medium","concept":"Pila voltaica","question":"¿Qué transformación energética tiene lugar en una pila voltaica?","options":["Una reacción redox espontánea genera energía eléctrica.","La energía eléctrica fuerza una reacción no espontánea.","La energía térmica se convierte siempre en energía nuclear.","No existe conversión de energía."],"correct":0,"explanation":"Una pila voltaica convierte la energía química de una reacción redox espontánea en corriente eléctrica.","topic":8},{"id":"T8-Q24","difficulty":"medium","concept":"Ánodo y cátodo","question":"¿En qué electrodo tiene lugar la oxidación en una celda electroquímica?","options":["En el ánodo.","En el cátodo.","En el puente salino.","En ambos electrodos simultáneamente."],"correct":0,"explanation":"La oxidación ocurre en el ánodo tanto en pilas voltaicas como en celdas electrolíticas.","topic":8},{"id":"T8-Q25","difficulty":"medium","concept":"Ánodo y cátodo","question":"¿En qué electrodo tiene lugar la reducción?","options":["En el cátodo.","En el ánodo.","En el puente salino.","En el conductor externo exclusivamente."],"correct":0,"explanation":"La reducción ocurre en el cátodo.","topic":8},{"id":"T8-Q26","difficulty":"hard","concept":"Pila Daniell","question":"En una pila Daniell Zn/Zn²⁺ || Cu²⁺/Cu, ¿hacia dónde fluyen los electrones por el circuito externo?","options":["Desde el electrodo de Zn hacia el electrodo de Cu.","Desde el electrodo de Cu hacia el de Zn.","Desde el puente salino hacia ambos electrodos.","Los electrones no circulan por el circuito externo."],"correct":0,"explanation":"El zinc se oxida en el ánodo y libera electrones, que viajan por el circuito externo hasta el cátodo de cobre.","topic":8},{"id":"T8-Q27","difficulty":"hard","concept":"Puente salino","question":"¿Cuál es la función principal del puente salino en una pila?","options":["Mantener la electroneutralidad de las semiceldas permitiendo la migración de iones.","Transportar electrones entre ánod ,"concept":"Electrólisis del agua","question":"En la electrólisis del agua, ¿dónde se genera hidrógeno gaseoso?","options":["En el cátodo.","En el ánodo.","En el puente salino.","En ambos electrodos en igual proporción."],"correct":0,"explanation":"La reducción tiene lugar en el cátodo y puede dar lugar a la formación de H₂.","topic":8},{"id":"T8-Q33","difficulty":"medium","concept":"Aplicaciones de la electrólisis","question":"¿Cuál de las siguientes es una aplicación industrial de la electrólisis?","options":["Depositar recubrimientos metálicos sobre una superficie.","Aumentar directamente la presión osmótica de un alimento.","Gelatinizar almidón sin calentamiento.","Formar emulsiones exclusivamente por agitación."],"correct":0,"explanation":"La electrodeposición y el recubrimiento de superficies son aplicaciones industriales clásicas de la electrólisis.","topic":8},{"id":"T8-Q34","difficulty":"medium","concept":"Primera ley de Faraday","question":"¿Qué establece la primera ley de Faraday para una electrólisis?","options":["La masa depositada es proporcional a la cantidad de carga eléctrica que atraviesa la celda.","La masa depositada es independiente de la corriente.","La masa depositada depende únicamente de la temperatura.","La cantidad de producto es inversamente proporcional al tiempo."],"correct":0,"explanation":"A mayor carga eléctrica transferida, mayor cantidad de sustancia puede depositarse o liberarse en el electrodo.","topic":8},{"id":"T8-Q35","difficulty":"hard","concept":"Carga eléctrica","question":"Si por una celda circula una corriente constante I durante un tiempo t, ¿cómo se calcula la carga eléctrica Q?","options":["Q = I·t.","Q = I/t.","Q = t/I.","Q = I + t."],"correct":0,"explanation":"La carga eléctrica es el producto de la intensidad de corriente por el tiempo, expresado en amperios y segundos para obtener culombios.","topic":8},{"id":"T8-Q36","difficulty":"hard","concept":"Constante de Faraday","question":"¿Qué representa aproximadamente una constante de Faraday, F ≈ 96500 C·mol⁻¹?","options":["La carga transportada por un mol de electrones.","La energía necesaria para romper un mol de enlaces.","La masa de un mol de electrones.","La presión de una celda electroquímica estándar."],"correct":0,"explanation":"La constante de Faraday relaciona cantidad de electrones y carga eléctrica: un mol de electrones transporta aproximadamente 96500 C.","topic":8},{"id":"T8-Q37","difficulty":"hard","concept":"Faraday y estequiometría","question":"Para depositar 1 mol de un metal M a partir de M²⁺, ¿cuántos moles de electrones son necesarios?","options":["2 mol de e⁻.","1 mol de e⁻.","0,5 mol de e⁻.","4 mol de e⁻."],"correct":0,"explanation":"La semirreacción M²⁺ + 2e⁻ → M requiere dos moles de electrones por mol de metal depositado.","topic":8},{"id":"T8-Q38","difficulty":"hard","concept":"Faraday y corriente","question":"Si se duplica la intensidad de corriente manteniendo constante el tiempo y el resto de condiciones, ¿qué ocurre idealmente con la masa depositada?","options":["Se duplica.","Se reduce a la mitad.","Permanece constante.","Se cuadruplica."],"correct":0,"explanation":"Como Q = I·t y la masa depositada es proporcional a Q, duplicar la corriente duplica idealmente la masa depositada.","topic":8},{"id":"T8-Q39","difficulty":"hard","concept":"Pila frente a electrólisis","question":"¿Cuál es la diferencia esencial entre una pila voltaica y una celda electrolítica?","options":["La pila aprovecha una reacción espontánea para generar corriente; la celda electrolítica consume corriente para forzar una reacción no espontánea.","Ambas generan corriente a partir de reacciones espontáneas.","Ambas requieren siempre una fuente externa.","En la pila no ocurren reacciones redox."],"correct":0,"explanation":"La pila transforma energía química espontánea en energía eléctrica, mientras que la electrólisis utiliza energía eléctrica para impulsar una transformación no espontánea.","topic":8},{"id":"T8-Q40","difficulty":"hard","concept":"Integración redox-electroquímica","question":"Una especie pierde electrones en una semicelda y esos electrones circulan por un conductor hacia otra semicelda donde son consumidos. ¿Qué interpretación integra correctamente el proceso?","options":["La primera especie se oxida en el ánodo, actúa como reductora y los electrones son consumidos en una reducción catódica.","La primera especie se reduce en el cátodo y actúa como oxidante.","Ambas especies se oxidan simultáneamente sin reducción.","Los electrones circulan por el puente salino y no por el conductor externo."],"correct":0,"explanation":"La oxidación genera electrones en el ánodo; éstos circulan por el circuito externo y son aceptados por la especie que se reduce en el cátodo.","topic":8}];const tg = window.Telegram?.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('secondary_bg_color');}catch(e){}}
const TOPICS=[
 {n:1,title:'Enlace químico y propiedades del agua',subtitle:'40 preguntas · nivel medio/alto',available:true},
 {n:2,title:'Química orgánica, grupos funcionales e hidratos de carbono',subtitle:'40 preguntas · nivel medio/alto',available:true},
 {n:3,title:'Aminoácidos y proteínas',subtitle:'40 preguntas · nivel medio/alto',available:true},
 {n:4,title:'Lípidos',subtitle:'40 preguntas · nivel medio/alto',available:true},
 {n:5,title:'Enzimas',subtitle:'40 preguntas · nivel medio/alto',available:true},
 {n:6,title:'Sistemas dispersos, disoluciones y termoquímica',subtitle:'40 preguntas · nivel medio/alto',available:true},
 {n:7,title:'Cinética, equilibrio químico y ácido-base',subtitle:'40 preguntas · nivel medio/alto',available:true},
 {n:8,title:'Oxidación-reducción y transferencia de electrones',subtitle:'40 preguntas · nivel medio/alto',available:true}
];
const letters=['A','B','C','D'];
let state={view:'topics',topic:1,session:null,currentQuestion:null,answered:false};

function haptic(type='light'){try{tg?.HapticFeedback?.impactOccurred(type)}catch(e){}}
function notify(type){try{tg?.HapticFeedback?.notificationOccurred(type)}catch(e){}}

const storage={
 async get(key){
   return new Promise(resolve=>{
    try{if(tg?.CloudStorage){tg.CloudStorage.getItem(key,(err,val)=>resolve(!err&&val?val:null));return}}catch(e){}
    resolve(localStorage.getItem(key));
   })
 },
 async set(key,val){
   return new Promise(resolve=>{
    try{if(tg?.CloudStorage){tg.CloudStorage.setItem(key,String(val),()=>resolve());return}}catch(e){}
    localStorage.setItem(key,String(val));resolve();
   })
 },
 async remove(key){
   return new Promise(resolve=>{
    try{if(tg?.CloudStorage){tg.CloudStorage.removeItem(key,()=>resolve());return}}catch(e){}
    localStorage.removeItem(key);resolve();
   })
 }
};
function keyMastery(t){return `cq_gym_mastery_t${t}_v1`}
function keySession(t){return `cq_gym_session_t${t}_v1`}
async function loadJSON(key,fallback){try{const x=await storage.get(key);return x?JSON.parse(x):fallback}catch(e){return fallback}}
async function saveJSON(key,v){await storage.set(key,JSON.stringify(v))}
async function mastery(topic){return await loadJSON(keyMastery(topic),{})}
function qBank(topic){return QUESTIONS.filter(q=>q.topic===topic)}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

async function renderTopics(){
 state.view='topics';state.session=null;
 const topicData={};
 for(const t of TOPICS){
   if(!t.available)continue;
   const m=await mastery(t.n);
   topicData[t.n]={
     mastered:Object.values(m).filter(x=>x.mastered).length,
     active:await loadJSON(keySession(t.n),null)
   };
 }
 document.getElementById('screen').innerHTML=`
 <section class="card hero"><h2>🏋️ Gimnasio CENQAL</h2><p>Puedes entrenar tantas veces como quieras. Las preguntas aparecen de una en una y siempre recibirás el razonamiento después de responder.</p></section>
 <section class="topics">${TOPICS.map(t=>{
   const d=topicData[t.n]||{mastered:0,active:null};
   return `<button class="topic ${t.available?'available':'locked'}" ${t.available?'':'disabled'} onclick="openTopic(${t.n})"><strong>📘 Tema ${t.n}</strong><small>${esc(t.title)}</small><span class="badge">${t.available?(d.mastered===40?'🏆 Dominado':`${d.mastered}/40 dominadas`):'🔒 Próximamente'}</span></button>`;
 }).join('')}</section>
 ${TOPICS.filter(t=>t.available && topicData[t.n]?.active && topicData[t.n].active.index<topicData[t.n].active.order.length).map(t=>`<section class="card"><b>⏯ Tienes un entrenamiento del Tema ${t.n} en curso</b><div class="masteryline">Vas por la pregunta ${topicData[t.n].active.index+1} de ${topicData[t.n].active.order.length}.</div><button class="action" onclick="resumeSession(${t.n})">Continuar entrenamiento</button></section>`).join('')}`;
}

async function openTopic(topic){
 haptic();state.topic=topic;
 const bank=qBank(topic);const m=await mastery(topic);const entries=Object.values(m);
 const mastered=entries.filter(x=>x.mastered).length, wrong=entries.filter(x=>x.lastCorrect===false).length, seen=entries.length;
 const active=await loadJSON(keySession(topic),null);
 document.getElementById('screen').innerHTML=`
 <section class="card"><span class="pill">TEMA ${topic}</span><h2 style="margin:9px 0 5px">${esc(TOPICS[topic-1].title)}</h2><p class="muted" style="margin:0">Banco de ${bank.length}/40 preguntas · intentos ilimitados</p>
 <div class="stats"><div class="stat"><b>${mastered}</b><span>Dominadas</span></div><div class="stat"><b>${wrong}</b><span>Por repasar</span></div><div class="stat"><b>${seen}</b><span>Practicadas</span></div></div>
 <div class="actions">
 ${active&&active.index<active.order.length?`<button class="action" onclick="resumeSession(${topic})">▶️ Continuar · ${active.index+1}/${active.order.length}</button>`:''}
 <button class="action ${active?'secondary':''}" onclick="startTraining(${topic},'full')">🔄 Entrenar las 40</button>
 <button class="action secondary" onclick="startTraining(${topic},'unmastered')">🎯 Entrenar lo que no domino</button>
 <button class="action secondary" onclick="startTraining(${topic},'wrong')">❌ Repasar mis fallos</button>
 <button class="action secondary" onclick="renderProgress(${topic})">📊 Mi progreso</button>
 <button class="action secondary" onclick="renderTopics()">← Elegir otro tema</button>
 </div></section>
 <section class="card"><b>¿Cuándo se considera dominada?</b><p class="muted" style="line-height:1.45;margin-bottom:0">Una pregunta pasa a 🟢 dominada después de dos aciertos consecutivos en entrenamientos distintos. Si posteriormente la fallas, vuelve a entrenamiento. El objetivo final es 40/40, pero puedes seguir practicando siempre.</p></section>`;
}

async function startTraining(topic,mode){
 const bank=qBank(topic); if(bank.length!==40){alert('Este tema todavía no tiene exactamente 40 preguntas.');return}
 const m=await mastery(topic);let pool=bank;
 if(mode==='wrong') pool=bank.filter(q=>m[q.id]?.lastCorrect===false);
 if(mode==='unmastered') pool=bank.filter(q=>!m[q.id]?.mastered);
 if(!pool.length){
   if(mode==='wrong'){alert('No tienes fallos pendientes. ¡Buen trabajo!');return}
   if(mode==='unmastered'){alert('Ya tienes las 40 preguntas dominadas. Puedes entrenarlas de nuevo cuando quieras.');return}
 }
 const session={topic,mode,order:shuffle(pool.map(q=>q.id)),index:0,correct:0,startedAt:Date.now(),roundId:`${Date.now()}-${Math.random().toString(16).slice(2)}`};
 await saveJSON(keySession(topic),session);state.session=session;showCurrent();
}
async function resumeSession(topic){const s=await loadJSON(keySession(topic),null);if(!s||s.index>=s.order.length){return openTopic(topic)}state.topic=topic;state.session=s;showCurrent()}
function getQ(id){return QUESTIONS.find(q=>q.id===id)}
function shuffledView(q){
 const items=q.options.map((text,i)=>({text,correct:i===q.correct}));return shuffle(items);
}
async function showCurrent(){
 const s=state.session;if(!s)return openTopic(state.topic);
 if(s.index>=s.order.length)return finishSession();
 const q=getQ(s.order[s.index]);state.currentQuestion=q;state.answered=false;
 const view=shuffledView(q);state.optionView=view;
 const pct=Math.round((s.index/s.order.length)*100);
 document.getElementById('screen').innerHTML=`<section class="card">
 <div class="progressrow"><span>🏋️ Tema ${s.topic}</span><span>${s.index+1}/${s.order.length}</span></div><div class="progress"><div style="width:${pct}%"></div></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px"><span class="difficulty ${q.difficulty}">${q.difficulty==='hard'?'Nivel alto':'Nivel medio'}</span><span class="pill">${esc(q.concept)}</span></div>
 <div class="question">${esc(q.question)}</div>
 <div class="answers">${view.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answer(${i})"><b>${letters[i]}</b>${esc(o.text)}</button>`).join('')}</div>
 <button class="action secondary" style="margin-top:14px" onclick="pauseTraining()">⏸ Salir y continuar después</button>
 </section>`;
}
async function answer(i){
 if(state.answered)return;state.answered=true;
 const q=state.currentQuestion,s=state.session,chosen=state.optionView[i],isCorrect=chosen.correct;
 const m=await mastery(s.topic), prev=m[q.id]||{correctCount:0,wrongCount:0,streak:0,mastered:false,lastCorrect:null,lastRound:null};
 if(isCorrect){prev.correctCount=(prev.correctCount||0)+1;prev.streak=(prev.lastCorrect===true && prev.lastRound!==s.roundId)?(prev.streak||0)+1:1;prev.lastCorrect=true;prev.lastRound=s.roundId;prev.mastered=prev.streak>=2;s.correct++}
 else{prev.wrongCount=(prev.wrongCount||0)+1;prev.streak=0;prev.lastCorrect=false;prev.lastRound=s.roundId;prev.mastered=false}
 prev.updatedAt=Date.now();m[q.id]=prev;
 await saveJSON(keyMastery(s.topic),m);await saveJSON(keySession(s.topic),s);
 document.querySelectorAll('.answer').forEach((el,idx)=>{el.disabled=true;if(state.optionView[idx].correct)el.classList.add('correct');if(idx===i&&!isCorrect)el.classList.add('wrong')});
 if(isCorrect){notify('success')}else{notify('error')}
 const status=prev.mastered?'🟢 Pregunta dominada':isCorrect?(prev.streak===1?'🟡 Primer acierto: vuelve a demostrarlo en otra vuelta':'🟡 En aprendizaje'):'🔴 Vuelve a entrenamiento';
 const fb=document.createElement('div');fb.className=`feedback ${isCorrect?'good':'bad'}`;fb.innerHTML=`<h3>${isCorrect?'✅ Correcto':'❌ Incorrecto'}</h3><p><b>¿Por qué?</b> ${esc(q.explanation)}</p><div class="concept">${status}</div><button class="action" style="margin-top:13px" onclick="nextQuestion()">${s.index+1>=s.order.length?'🏁 Ver resultado':'Siguiente →'}</button>`;
 document.querySelector('.answers').after(fb);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
async function nextQuestion(){const s=state.session;s.index++;await saveJSON(keySession(s.topic),s);showCurrent()}
async function pauseTraining(){await saveJSON(keySession(state.session.topic),state.session);haptic();openTopic(state.session.topic)}
async function finishSession(){
 const s=state.session,m=await mastery(s.topic);const mastered=Object.values(m).filter(x=>x.mastered).length;const pct=Math.round(100*s.correct/Math.max(1,s.order.length));
 await storage.remove(keySession(s.topic));state.session=null;
 document.getElementById('screen').innerHTML=`<section class="card center"><div class="big">${mastered===40?'🏆':'🏁'}</div><h2>${mastered===40?'Tema dominado':'Entrenamiento completado'}</h2><p><b>${s.correct}/${s.order.length}</b> correctas en esta vuelta · ${pct}%</p><p class="muted">Dominio acumulado: <b>${mastered}/40</b></p><div class="actions"><button class="action" onclick="startTraining(${s.topic},'full')">🔄 Entrenar otra vez</button><button class="action secondary" onclick="startTraining(${s.topic},'unmastered')">🎯 Lo que no domino</button><button class="action secondary" onclick="startTraining(${s.topic},'wrong')">❌ Repasar fallos</button><button class="action secondary" onclick="openTopic(${s.topic})">← Volver al tema</button></div></section>`;
}
async function renderProgress(topic){
 const m=await mastery(topic),bank=qBank(topic);let mastered=0,learning=0,wrong=0,unseen=0;
 bank.forEach(q=>{const x=m[q.id];if(!x)unseen++;else if(x.mastered)mastered++;else if(x.lastCorrect===false)wrong++;else learning++});
 document.getElementById('screen').innerHTML=`<section class="card"><span class="pill">TEMA ${topic}</span><h2>📊 Mi progreso</h2><div class="stats"><div class="stat"><b>${mastered}</b><span>🟢 Dominadas</span></div><div class="stat"><b>${learning}</b><span>🟡 Aprendiendo</span></div><div class="stat"><b>${wrong}</b><span>🔴 Falladas</span></div></div><div class="masteryline">Sin practicar: ${unseen}/40</div><div class="progress"><div style="width:${Math.round(mastered/40*100)}%"></div></div><p class="muted" style="line-height:1.45">Dominio: ${Math.round(mastered/40*100)}%. No hay límite de intentos. El progreso se conserva para que puedas retomar el entrenamiento más adelante.</p><div class="actions"><button class="action" onclick="startTraining(${topic},'unmastered')">🎯 Entrenar lo que no domino</button><button class="action secondary" onclick="openTopic(${topic})">← Volver</button></div></section>`;
}
window.openTopic=openTopic;window.renderTopics=renderTopics;window.startTraining=startTraining;window.resumeSession=resumeSession;window.answer=answer;window.nextQuestion=nextQuestion;window.pauseTraining=pauseTraining;window.renderProgress=renderProgress;
renderTopics();
</script>
